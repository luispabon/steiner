steps:
  - id: step-1
    title: Create the pull-request skill Markdown file
    scope: Add skills/pull-request/SKILL.md with frontmatter, provider detection heuristics, target branch selection, body assembly rules, per-provider CLI commands, auth prerequisites, fallback behavior, and confirmation gate. Follow the exact frontmatter format and style of existing bundled skills (plan, review, implement).
    files:
      - skills/pull-request/SKILL.md
    constraints:
      - Do not modify any other skill file (especially skills/review/SKILL.md)
      - Do not modify any Go source files
      - Keep the skill content concise enough to not dominate the context window
      - Use generic "PR/MR" terminology throughout
    acceptance:
      - File exists at skills/pull-request/SKILL.md
      - Frontmatter contains name: pull-request and a description
      - Includes sections for provider detection, target branch selection, body assembly, per-provider commands, fallback, and approval gate
      - Supports GitHub, GitLab, Azure DevOps, Bitbucket Cloud, Bitbucket Server/DC, Gitea/Codeberg/Forgejo
    verification:
      - make build-binaries succeeds
      - ./bin/steiner skills lists pull-request
      - go test ./internal/skill/... passes
      - make check passes

  - id: step-2
    title: Verify build and discovery
    scope: Run the full verification suite to confirm the new skill is automatically discovered via the embedded FS and does not break any existing tests or checks.
    files: []
    constraints:
      - No code changes in this step
    acceptance:
      - make build-binaries produces a binary that includes the new skill
      - steiner skills output contains pull-request
      - All existing tests pass
      - make check passes
    verification:
      - make build-binaries
      - ./bin/steiner skills
      - go test ./...
      - make check
