steps:
  - id: step-1
    title: Add EnsureSteinerProjectDir helper to runtime_build.go
    scope: Create a new helper function in cmd/steiner/runtime_build.go that ensures a .steiner/ directory exists in the working directory and contains a .gitignore file with content "*" (skip if .gitignore already exists). Return errors for filesystem failures.
    files:
      - cmd/steiner/runtime_build.go
    constraints:
      - Do not modify sandbox.EnsureHome or existing .gitignore handling.
      - Use os.MkdirAll with 0o755 and os.ReadFile/os.WriteFile for the .gitignore.
      - Idempotent — safe to call multiple times.
    acceptance:
      - Helper compiles and is exported or package-level callable.
      - Returns nil when directory and .gitignore already exist.
      - Creates directory and .gitignore when absent.
      - Leaves existing .gitignore untouched.
    verification:
      - go vet ./cmd/steiner
      - make build-binaries

  - id: step-2
    title: Hook EnsureSteinerProjectDir into defaultBuildRuntime
    scope: Call the new helper early in defaultBuildRuntime in cmd/steiner/runtime.go, before config loading or sandbox setup. Pass the working directory (or derive from os.Getwd).
    files:
      - cmd/steiner/runtime.go
    constraints:
      - Must run for both exec and interactive modes.
      - Error from helper should propagate and abort startup.
    acceptance:
      - defaultBuildRuntime calls the helper before other initialization.
      - Startup errors if the working directory is read-only and .steiner cannot be created.
    verification:
      - go test ./cmd/steiner -run TestDefaultBuildRuntimeResolvesSelectedModelAndScheduler
      - go test ./cmd/steiner

  - id: step-3
    title: Add unit tests for EnsureSteinerProjectDir in runtime_build_test.go
    scope: Create cmd/steiner/runtime_build_test.go with table-driven tests covering (a) creates dir and .gitignore from scratch, (b) skips existing .gitignore, (c) returns error on read-only parent if applicable.
    files:
      - cmd/steiner/runtime_build_test.go
    constraints:
      - Use t.TempDir for isolation.
      - Do not depend on real working directory state.
    acceptance:
      - All new tests pass.
      - Existing cmd/steiner tests still pass.
    verification:
      - go test ./cmd/steiner -run TestEnsureSteinerProjectDir
      - go test ./cmd/steiner
      - go test -race ./cmd/steiner

  - id: step-4
    title: Run full verification suite
    scope: Execute the full project check target to confirm no regressions.
    constraints:
      - Fix only task-related failures.
    acceptance:
      - make check passes (or any failures are unrelated and reported).
    verification:
      - make check
