steps:
  - id: step-1
    title: Prefix plan directory names with .steiner/plans/ in plan picker
    scope: |
      Modify internal/tui/plan_picker.go so that Open() stores the full relative
      path (".steiner/plans/" + entry.Name()) in allNames instead of just the
      directory basename. This propagates through filtering, display, and selection
      insertion without further changes.
    files:
      - internal/tui/plan_picker.go
    constraints:
      - Only change the string stored in allNames; do not alter overlay keyboard handling, filtering, or view logic.
    acceptance:
      - planPicker.Open() populates allNames with full relative paths.
      - Filtering and selection still work as before.
    verification:
      - go test ./internal/tui/... -run TestPlanPicker
      - go build ./...
      - go vet ./...

  - id: step-2
    title: Update plan picker tests for full relative paths
    scope: |
      Update internal/tui/plan_picker_test.go so that all assertions expect the
      full relative path (".steiner/plans/" + name) instead of the bare directory
      name.
    files:
      - internal/tui/plan_picker_test.go
    constraints:
      - Keep existing test coverage; only update expected string values.
    acceptance:
      - All TestPlanPicker* tests pass.
    verification:
      - go test ./internal/tui/... -run TestPlanPicker

  - id: step-3
    title: Run full repository verification
    scope: |
      Execute make check (or individual commands if make check is unavailable)
      to ensure no regressions in formatting, imports, build, tests, race detection,
      vet, lint, or vulnerability scanning.
    files: []
    constraints:
      - Fix only task-related failures.
    acceptance:
      - make check passes, or any failures are unrelated to this change and documented.
    verification:
      - make check
