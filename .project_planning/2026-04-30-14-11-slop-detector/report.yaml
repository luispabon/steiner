      	}

      	if filterGlob != nil && !filterGlob.Match(relPath) {
      		return nil
      	}

      	if exts != nil {
      		ext := filepath.Ext(path)
      		found := false
      		for _, e := range exts {
      			if strings.EqualFold(ext, e) {
      				found = true
      				break
      			}
      		}
      		if !found {
