  - id: F003
    file: internal/tool/builtin/decode.go
    language: go
    method: setField
    enclosing: null
    line_range: [118, 142]
    category: potential_bug
    severity: high
    confidence: high
    description: setField silently truncates float inputs when the destination field is an integer or unsigned integer. A tool payload like 3.9 becomes 3 with no error, and out-of-range values can still be accepted until reflection overflows.
    current_code: |
      case reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:
      	switch rv.Kind() {
      	case reflect.String:
      		n, err := strconv.ParseInt(rv.String(), 10, fv.Type().Bits())
      		if err != nil {
      			return fmt.Errorf("parse int: %w", err)
      		}
      		fv.SetInt(n)
      		return nil
      	case reflect.Float32, reflect.Float64:
      		fv.SetInt(int64(rv.Float()))
      		return nil
      	}
      case reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64:
      	switch rv.Kind() {
      	case reflect.String:
      		n, err := strconv.ParseUint(rv.String(), 10, fv.Type().Bits())
      		if err != nil {
      			return fmt.Errorf("parse uint: %w", err)
      		}
      		fv.SetUint(n)
      		return nil
      	case reflect.Float32, reflect.Float64:
      		fv.SetUint(uint64(rv.Float()))
      		return nil
    suggested_code: |
      case reflect.Int, reflect.Int8, reflect.Int16, reflect.Int32, reflect.Int64:
      	switch rv.Kind() {
      	case reflect.String:
      		n, err := strconv.ParseInt(rv.String(), 10, fv.Type().Bits())
      		if err != nil {
      			return fmt.Errorf("parse int: %w", err)
      		}
      		fv.SetInt(n)
      		return nil
      	case reflect.Float32, reflect.Float64:
      		f := rv.Float()
      		if math.Trunc(f) != f {
      			return fmt.Errorf("cannot convert non-integral float %v to %v", raw, fv.Type())
      		}
      		n := int64(f)
      		if fv.OverflowInt(n) {
      			return fmt.Errorf("cannot convert out-of-range float %v to %v", raw, fv.Type())
      		}
      		fv.SetInt(n)
      		return nil
      	}
      case reflect.Uint, reflect.Uint8, reflect.Uint16, reflect.Uint32, reflect.Uint64:
      	switch rv.Kind() {
      	case reflect.String:
      		n, err := strconv.ParseUint(rv.String(), 10, fv.Type().Bits())
      		if err != nil {
      			return fmt.Errorf("parse uint: %w", err)
      		}
      		fv.SetUint(n)
      		return nil
      	case reflect.Float32, reflect.Float64:
      		f := rv.Float()
      		if f < 0 || math.Trunc(f) != f {
      			return fmt.Errorf("cannot convert non-integral float %v to %v", raw, fv.Type())
      		}
      		n := uint64(f)
      		if fv.OverflowUint(n) {
      			return fmt.Errorf("cannot convert out-of-range float %v to %v", raw, fv.Type())
      		}
      		fv.SetUint(n)
      		return nil
      	}
    rationale: Rejecting fractional and overflowing numeric coercions prevents malformed tool input from being accepted as a different integer value.
    breaking_risk: medium
    related_findings: []

  - id: F004
    file: internal/tool/builtin/grep_core.go
    language: go
    method: grepSearch
    enclosing: null
    line_range: [152, 164]
    category: potential_bug
    severity: high
    confidence: high
    description: The multiline flag only prepends (?s) to the regex but still applies the match one line at a time. Any pattern that needs to span a newline can never match, so multiline mode is currently a false promise.
    current_code: |
      lines := strings.Split(string(content), "\n")
      for i, line := range lines {
      	if re.MatchString(line) {
      		matches = append(matches, grepMatch{
      			file:       relPath,
      			lineNumber: i + 1,
      			line:       strings.TrimRight(line, "\r"),
      		})
      		if len(matches) >= limit {
      			return filepath.SkipAll
      		}
      	}
      }
    suggested_code: |
      contentText := string(content)
      if multiline {
      	locs := re.FindAllStringIndex(contentText, -1)
      	for _, loc := range locs {
      		startLine := 1 + strings.Count(contentText[:loc[0]], "\n")
      		lineStart := strings.LastIndex(contentText[:loc[0]], "\n") + 1
      		lineEndOffset := strings.Index(contentText[loc[1]:], "\n")
      		lineEnd := len(contentText)
      		if lineEndOffset >= 0 {
      			lineEnd = loc[1] + lineEndOffset
      		}
      		matches = append(matches, grepMatch{
      			file:       relPath,
      			lineNumber: startLine,
      			line:       strings.TrimRight(contentText[lineStart:lineEnd], "\r"),
      		})
      		if len(matches) >= limit {
      			return filepath.SkipAll
      		}
      	}
      	return nil
      }

      lines := strings.Split(contentText, "\n")
      for i, line := range lines {
      	if re.MatchString(line) {
      		matches = append(matches, grepMatch{
      			file:       relPath,
      			lineNumber: i + 1,
      			line:       strings.TrimRight(line, "\r"),
      		})
      		if len(matches) >= limit {
      			return filepath.SkipAll
      		}
      	}
      }
    rationale: Matching against the whole file in multiline mode makes the advertised regex semantics actually work while preserving the existing per-line output shape.
    breaking_risk: medium
    related_findings: [F011]

