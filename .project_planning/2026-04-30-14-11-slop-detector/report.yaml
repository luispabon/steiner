  - id: F001
    file: internal/config/load.go
    language: go
    method: Load
    enclosing: null
    line_range: [39, 54]
    category: potential_bug
    severity: medium
    confidence: high
    description: Load falls back to process-global HOME and silently ignores failures from os.UserHomeDir and os.Getwd. That makes config discovery drift away from LoadOptions and can quietly skip the project config path when cwd resolution fails.
    current_code: |
      homeDir := opts.HomeDir
      if homeDir == "" {
      	homeDir = os.Getenv("HOME")
      	if homeDir == "" {
      		if resolved, err := os.UserHomeDir(); err == nil {
      			homeDir = resolved
      		}
      	}
      }

      workingDir := opts.WorkingDir
      if workingDir == "" {
      	if cwd, err := os.Getwd(); err == nil {
      		workingDir = cwd
      	}
      }
    suggested_code: |
      homeDir := opts.HomeDir
      if homeDir == "" {
      	if value := strings.TrimSpace(env["HOME"]); value != "" {
      		homeDir = value
      	} else {
      		resolved, err := os.UserHomeDir()
      		if err != nil {
      			return Config{}, fmt.Errorf("resolve home dir: %w", err)
      		}
      		homeDir = resolved
      	}
      }

      workingDir := opts.WorkingDir
      if workingDir == "" {
      	cwd, err := os.Getwd()
      	if err != nil {
      		return Config{}, fmt.Errorf("resolve working dir: %w", err)
      	}
      	workingDir = cwd
      }
    rationale: Configuration loading stays deterministic and surfaces path discovery failures instead of silently falling back to ambient process state.
    breaking_risk: medium
    related_findings: []

