  - id: F006
    file: internal/tui/git.go
    language: go
    method: newGitState
    enclosing: null
    line_range: [46, 50]
    category: potential_bug
    severity: medium
    confidence: high
    description: newGitState drops the os.Getwd error and returns an empty startDir. The rest of git-state bootstrapping then quietly behaves as if repository discovery is unavailable instead of recording why it failed.
    current_code: |
      func newGitState(startDir string) *gitState {
      	if strings.TrimSpace(startDir) == "" {
      		startDir, _ = os.Getwd()
      	}
      	return &gitState{startDir: startDir}
    suggested_code: |
      func newGitState(startDir string) *gitState {
      	if strings.TrimSpace(startDir) == "" {
      		cwd, err := os.Getwd()
      		if err != nil {
      			logGitError(fmt.Errorf("resolve working directory: %w", err))
      			return &gitState{}
      		}
      		startDir = cwd
      	}
      	return &gitState{startDir: startDir}
      }
    rationale: Logging the cwd resolution failure preserves a concrete reason when git status disappears instead of silently degrading to an empty state.
    breaking_risk: low
    related_findings: []

