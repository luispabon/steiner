  - id: F008
    file: internal/output/event_render.go
    language: go
    method: renderEvent
    enclosing: null
    line_range: [8, 240]
    category: extract_method
    severity: low
    confidence: medium
    description: renderEvent has grown into one large type switch that repeats the same part-building and channel-selection patterns for many event kinds. It is still correct today, but adding new event types now requires editing a large hotspot with a lot of similar-looking branches.
    current_code: |
      func renderEvent(event Event) Segment {
      	switch payload := event.Payload.(type) {
      	case RunStartedEvent:
      		parts := []string{"run started"}
      		if payload.Mode != "" {
      			parts = append(parts, fmt.Sprintf("mode=%s", payload.Mode))
      		}
      		if payload.Model != "" {
      			parts = append(parts, fmt.Sprintf("model=%s", payload.Model))
      		}
      		if payload.Prompt != "" {
      			parts = append(parts, fmt.Sprintf("prompt=%s", payload.Prompt))
      		}
      		if payload.MaxTurns > 0 {
      			parts = append(parts, fmt.Sprintf("turn_limit=%d", payload.MaxTurns))
      		}
      		if payload.MaxTokens > 0 {
      			parts = append(parts, fmt.Sprintf("token_limit=%d", payload.MaxTokens))
      		}
      		return Segment{Channel: ChannelStatus, Label: "status", Text: strings.Join(parts, " ")}
      	case TurnStartedEvent:
      		parts := []string{
      			fmt.Sprintf("turn=%d started", payload.Turn),
      		}
      		if payload.MessageCount > 0 {
      			parts = append(parts, fmt.Sprintf("messages=%d", payload.MessageCount))
      		}
      		if payload.Model != "" {
      			parts = append(parts, fmt.Sprintf("model=%s", payload.Model))
      		}
      		return Segment{Channel: ChannelStatus, Label: "status", Text: strings.Join(parts, " ")}
      	}
      }
    suggested_code: ""
    rationale: Per-event helpers would localize formatting rules and reduce the chance of regressions when the event surface expands.
    breaking_risk: low
    related_findings: []

  - id: F009
    file: internal/output/plain.go
    language: go
    method: renderStreamingLocked
    enclosing: PlainRenderer
    line_range: [389, 409]
    category: potential_bug
    severity: medium
    confidence: medium
    description: renderStreamingLocked and finishStreamingLocked ignore every io.WriteString error. If the writer is closed or short-lived, the renderer keeps mutating its streaming state as if output was delivered, which can hide terminal or pipe failures.
    current_code: |
      func (r *PlainRenderer) renderStreamingLocked(segment Segment) {
      	if r.streaming != "" && r.streaming != segment.Channel {
      		r.finishStreamingLocked()
      	}
      	if r.streaming == "" {
      		label := segment.Label
      		if label == "" {
      			label = string(segment.Channel)
      		}
      		_, _ = io.WriteString(r.w, r.decorate(segment.Channel, label+"> "))
      		r.streaming = segment.Channel
      	}
      	_, _ = io.WriteString(r.w, segment.Text)
      }

      func (r *PlainRenderer) finishStreamingLocked() {
      	if r.streaming == "" {
      		return
      	}
      	_, _ = io.WriteString(r.w, "\n")
      	r.streaming = ""
      }
    suggested_code: ""
    rationale: Surfacing or recording writer failures would keep renderer state aligned with what was actually emitted.
    breaking_risk: medium
    related_findings: []

  - id: F010
    file: internal/prompt/assembler.go
    language: go
    method: Assemble
    enclosing: Assembler
    line_range: [27, 108]
    category: extract_method
    severity: low
    confidence: medium
    description: "Assembler.Assemble encodes a long, order-sensitive pipeline inline: preamble, agents, project context, skills, durable context, conversation, and tool summaries. That ordering is intentional, but keeping the whole pipeline in one method makes precedence changes harder to review and test in isolation."
    current_code: |
      func (a Assembler) Assemble(ctx context.Context) (Assembly, error) {
      	blocks := make([]ContextBlock, 0, 8)
      	messages := make([]provider.Message, 0, 8+len(a.opts.Conversation)+len(a.opts.ToolResults))
      	budgets := newBudgetTracker(a.policy.Budgets)

      	appendBlock := func(block ContextBlock) {
      		clipped, truncated, ok := applyBudget(budgets, block.Source, block.Content)
      		if !ok && len(block.Content) > 0 {
      			return
      		}
      		block.Content = clipped
      		block.ByteSize = len(clipped)
      		if truncated {
      			block.Truncated = true
      		}
      		blocks = append(blocks, block)
      		messages = append(messages, blockMessage(block))
      	}

      	preamble := SystemPreamble(a.opts.PromptOverrides.System)
      	appendBlock(preamble)

      	globalAgentsPath := a.opts.GlobalAgentsPath
      	if globalAgentsPath == "" {
      		globalAgentsPath = DefaultGlobalAgentsPath(a.opts.HomeDir)
      	}
      	projectAgentsPath := a.opts.ProjectAgentsPath
      	if projectAgentsPath == "" && a.opts.ProjectRoot != "" {
      		projectAgentsPath = filepath.Join(a.opts.ProjectRoot, "AGENTS.md")
      	}

      	agentBlocks, err := LoadAgents(globalAgentsPath, projectAgentsPath)
      	if err != nil {
      		return Assembly{}, err
      	}
      	for _, block := range agentBlocks {
      		appendBlock(block)
      	}

      	projectContext, err := GatherProjectContext(ProjectContextOptions{
      		Root:        a.opts.ProjectRoot,
      		BudgetBytes: a.policy.Budgets.ProjectContextBytes,
      		ExtraFiles:  a.opts.ProjectContextExtraFiles,
      		IgnoreFiles: a.opts.ProjectContextIgnoreFiles,
      	})
      	if err != nil {
      		return Assembly{}, err
      	}
      	for _, block := range projectContext {
      		appendBlock(block)
      	}

      	skillRoot := a.opts.SkillsRoot
      	if skillRoot == "" {
      		skillRoot = DefaultSkillsRoot(a.opts.HomeDir)
      	}
      	skillBlocks, err := LoadSkillBlocks(ctx, skill.Loader{RootDir: skillRoot}, a.opts.SkillNames)
      	if err != nil {
      		return Assembly{}, err
      	}
      	for _, block := range skillBlocks {
      		appendBlock(block)
      	}

      	if block, ok := durableContextBlock(a.opts.ContextState, a.policy.Compaction); ok {
      		appendBlock(block)
      	}

      	for _, message := range a.opts.Conversation {
      		messages = append(messages, message)
      	}

      	for _, toolResult := range a.opts.ToolResults {
      		block := summarizeToolMessage(toolResult, a.policy.ToolSummary)
      		appendBlock(block)
      	}

      	return Assembly{
      		Messages: messages,
      		Blocks:   blocks,
      	}, nil
      }
    suggested_code: ""
    rationale: Named helpers for each assembly phase would preserve the ordering contract while making future precedence changes easier to audit.
    breaking_risk: low
