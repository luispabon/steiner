steps:
  - id: step-1
    title: Add CavemanMode to config layer
    scope: internal/config
    files:
      - internal/config/config.go
      - internal/config/defaults.go
      - internal/config/load_override.go
      - internal/config/patch.go
      - internal/config/env.go
      - internal/config/validate.go
    constraints:
      - Default CavemanMode must be true
      - CLI flag --caveman must override config
      - Env var STEINER_CAVEMAN_MODE must override config
    acceptance:
      - Config loads CavemanMode from file, env, and CLI
      - Validation passes for true/false
      - Existing tests still pass
    verification:
      - go test ./internal/config/...
      - go test ./cmd/steiner/...

  - id: step-2
    title: Plumb CavemanMode through RunRequest and agent loop
    scope: internal/agent
    files:
      - internal/agent/runner.go
      - internal/agent/types.go (or runner.go if types live there)
      - internal/agent/turn_progression.go
      - internal/agent/turn_progression_types.go
      - internal/agent/compaction.go
    constraints:
      - RunRequest gains CavemanMode bool field
      - turnInput carries it unchanged
      - Compaction logic reads RunRequest.CavemanMode when building compaction request
    acceptance:
      - Agent compiles
      - Turn progression passes CavemanMode through to prepareTurn
    verification:
      - go test ./internal/agent/...
      - go vet ./internal/agent/...

  - id: step-3
    title: Update prompt assembly for caveman system and compaction prompts
    scope: internal/prompt
    files:
      - internal/prompt/system.go
      - internal/prompt/compaction.go
      - internal/prompt/types.go
    constraints:
      - SystemPreamble conditionally prepends caveman style instruction
      - BuildConversationCompactionPrompt uses caveman instruction body when enabled
      - AssemblyOptions carries CavemanMode flag
    acceptance:
      - Prompt assembly tests updated/added for caveman mode
      - Compaction prompt shorter when caveman enabled
    verification:
      - go test ./internal/prompt/...

  - id: step-4
    title: Wire CLI caveman flag and runtime closure into cliRunner
    scope: cmd/steiner
    files:
      - cmd/steiner/commands.go
      - cmd/steiner/runner.go
      - cmd/steiner/runner_run.go
      - cmd/steiner/interactive_session.go
    constraints:
      - --caveman flag added to root persistent flags
      - cliRunner gains cavemanMode func() bool field
      - buildRunRequest sets RunRequest.CavemanMode from closure
      - wireInteractiveRunner binds closure to Session state
    acceptance:
      - CLI compiles
      - Flag sets RunRequest.CavemanMode correctly
    verification:
      - go test ./cmd/steiner/...

  - id: step-5
    title: Inherit caveman mode in sub-agent delegation
    scope: internal/delegation
    files:
      - internal/delegation/bootstrap.go
    constraints:
      - BuildChildRun copies parent RunRequest.CavemanMode into child RunRequest
      - Child prompt assembly sets CavemanMode on AssemblyOptions
    acceptance:
      - Delegation tests pass
      - Sub-agent receives caveman flag
    verification:
      - go test ./internal/delegation/...

  - id: step-6
    title: Add interactive toggle and TUI command
    scope: internal/interactive, internal/tui
    files:
      - internal/interactive/actions.go
      - internal/interactive/session.go
      - internal/interactive/compaction.go
      - internal/tui/input.go
      - internal/tui/help.go
      - internal/tui/model_input.go
    constraints:
      - ToggleCavemanMode action flips Session.deps.Config.CavemanMode
      - /caveman-toggle parsed in TUI input
      - Help text and slash overlay include the command
      - manualCompaction reads live Config.CavemanMode
    acceptance:
      - TUI parses /caveman-toggle
      - Toggle emits a context report confirming state change
      - Manual compaction respects caveman mode
    verification:
      - go test ./internal/interactive/...
      - go test ./internal/tui/...

  - id: step-7
    title: Final verification and format
    scope: repo-wide
    files: []
    constraints:
      - All new code formatted with gofmt and goimports
      - No test regressions
    acceptance:
      - make check passes (or each constituent command passes if make check unavailable)
    verification:
      - make check
