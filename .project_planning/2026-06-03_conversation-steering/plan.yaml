steps:
  - id: step-1
    title: Add SteerPrompt action and steering channel to ActiveRunController
    scope: |
      Define SteerPrompt action type in interactive/actions.go.
      Extend ActiveRunController in interactive/state.go with a buffered(1) chan string
      for steering messages. Add Steer(text) send method (non-blocking, latest-wins)
      and Drain() method. Update Clear() to drain residual messages.
    files:
      - internal/interactive/actions.go
      - internal/interactive/state.go
      - internal/interactive/state_test.go
    constraints:
      - Channel must be buffered with capacity 1
      - Steer send must be non-blocking; if channel full, drain old and send new (latest-wins)
      - Clear() must drain the channel to avoid stale steers leaking to the next run
      - Do not change the Interrupt() or Set() signatures
    acceptance:
      - SteerPrompt action type exists and satisfies Action interface
      - ActiveRunController.Steer(text) queues a message, latest-wins on full channel
      - ActiveRunController.Drain() returns pending steer or empty string
      - ActiveRunController.Clear() drains residual messages
      - Tests cover send, latest-wins replacement, drain, and clear-drain
    verification:
      - gofmt -w internal/interactive/actions.go internal/interactive/state.go
      - goimports -w internal/interactive/actions.go internal/interactive/state.go
      - go test ./internal/interactive/ -run TestActiveRunController
      - go build ./internal/interactive/

  - id: step-2
    title: Wire SteerPrompt through Session.Handle and expose channel to runner
    scope: |
      Add SteerPrompt case to Session.Handle() dispatching to runController.Steer().
      Initialize the steering channel in ActiveRunController (in NewSession or lazily in Set).
      Expose a SteerCh() <-chan string accessor on ActiveRunController for the runner to consume.
      Update runExecutor interface and Session.submitPrompt to pass the steer channel
      through to the runner.
    files:
      - internal/interactive/session.go
      - internal/interactive/state.go
      - internal/interactive/deps.go
      - internal/interactive/run_flow.go
    constraints:
      - runExecutor interface change must be minimal — add steer channel parameter or embed in existing params
      - Do not break --exec mode (steer channel can be nil)
      - Keep Session.Handle() dispatch simple — just call Steer()
    acceptance:
      - Session.Handle(SteerPrompt{Text: "foo"}) sends "foo" to the steering channel
      - runExecutor interface accepts a steer channel (or it's plumbed through existing params)
      - submitPrompt passes steer channel to runner
      - Existing tests still pass
    verification:
      - gofmt -w internal/interactive/session.go internal/interactive/state.go internal/interactive/deps.go internal/interactive/run_flow.go
      - goimports -w internal/interactive/session.go internal/interactive/state.go internal/interactive/deps.go internal/interactive/run_flow.go
      - go build ./internal/interactive/
      - go test ./internal/interactive/

  - id: step-3
    title: Inject steering messages in agent runner turn loop
    scope: |
      Add SteerCh field to RunRequest. In Runner.Run() outer for-loop, after p.advance()
      returns and before the next iteration, do a non-blocking select on SteerCh.
      If a message is received, append it as a user message to state.Conversation
      and state.Lineage, then continue to the next turn (the model will see it).
      Emit a SteerReceivedEvent through the event sink so the TUI can clear the
      queued indicator.
    files:
      - internal/agent/runner.go
      - internal/agent/runner_test.go
      - internal/output/events.go
    constraints:
      - Non-blocking select only — never block the turn loop waiting for a steer
      - SteerCh nil is valid (--exec mode, sub-agents) — skip the check
      - Steering message is a standard agent.Message{Role: MessageRoleUser}
      - Do not change turn_progression.go — injection is in the outer loop only
    acceptance:
      - When SteerCh delivers a message between turns, it appears as a user message in conversation
      - Model receives the steer on the next API call
      - SteerReceivedEvent is emitted when a steer is consumed
      - Nil SteerCh does not panic or alter behavior
      - Test with mock provider verifies steer injection between turns
    verification:
      - gofmt -w internal/agent/runner.go
      - goimports -w internal/agent/runner.go
      - go test ./internal/agent/ -run TestSteer
      - go test -race ./internal/agent/ -run TestSteer
      - go build ./...

  - id: step-4
    title: Wire steer channel through CLI adapter to agent RunRequest
    scope: |
      Update the CLI adapter (cmd/steiner or wherever runExecutor is implemented)
      to pass the steer channel from ActiveRunController into agent.RunRequest.SteerCh.
      Ensure --exec mode passes nil.
    files:
      - cmd/steiner/interactive.go
      - cmd/steiner/run.go
    constraints:
      - Only touch the wiring — no business logic in cmd/steiner
      - --exec mode must not be affected
    acceptance:
      - Interactive mode passes steer channel to agent runner
      - --exec mode passes nil SteerCh
      - go build ./cmd/steiner/
    verification:
      - gofmt -w cmd/steiner/interactive.go
      - go build ./cmd/steiner/
      - go test ./cmd/steiner/ 2>/dev/null || true
    depends_on: [step-2, step-3]

  - id: step-5
    title: Unblock TUI input during active conversation and route to SteerPrompt
    scope: |
      In model_update_keys.go, change handleConversationKeyMsg to allow text input
      during active conversation (remove the blanket key swallow on line 98-99).
      Route Enter during active conversation to SteerPrompt action instead of
      SubmitPrompt. Show a visual "queued" indicator in the status bar or composer
      area when a steer message has been sent. Clear the indicator when
      SteerReceivedEvent arrives. Handle the SteerReceivedEvent in model_update.go.
    files:
      - internal/tui/model_update_keys.go
      - internal/tui/model_update.go
      - internal/tui/model.go
    constraints:
      - Esc/Ctrl+C/Ctrl+D must still trigger interrupt, not steer
      - Approval keys must still work during approval phase
      - Empty input on Enter during active run should be ignored (no empty steers)
      - Ctrl+X behavior (whatever it does) must be preserved
      - Input field must be cleared after steer is sent
    acceptance:
      - User can type text during an active model run
      - Enter sends text as SteerPrompt action and clears input
      - "queued" indicator visible after steer sent
      - Indicator clears when SteerReceivedEvent arrives
      - Esc/Ctrl+C still interrupts
      - Empty Enter during active run is a no-op
      - Approval flow unaffected
    verification:
      - gofmt -w internal/tui/model_update_keys.go internal/tui/model_update.go internal/tui/model.go
      - goimports -w internal/tui/model_update_keys.go internal/tui/model_update.go internal/tui/model.go
      - go build ./internal/tui/
      - go test ./internal/tui/ 2>/dev/null || true

  - id: step-6
    title: Final verification and make check
    scope: |
      Run full verification suite. Fix any issues found.
      Run go test -race on concurrency-sensitive packages.
    files: []
    constraints:
      - All checks must pass
    acceptance:
      - make check passes
      - go test -race ./internal/interactive/ ./internal/agent/ passes
    verification:
      - make check
      - go test -race ./internal/interactive/ ./internal/agent/
    depends_on: [step-4, step-5]
