steps:
  - id: step-1
    title: File hash computation helper
    scope: >
      Create internal/tool/builtin/file_hash.go with the shared hash function:
      CRC32-IEEE of content after stripping trailing whitespace per line,
      low 16 bits, formatted as 4 uppercase hex chars. Create
      internal/tool/builtin/file_hash_test.go with comprehensive tests.
    files:
      - internal/tool/builtin/file_hash.go
      - internal/tool/builtin/file_hash_test.go
    constraints:
      - Use stdlib hash/crc32 only, no new dependencies
      - Normalize by stripping trailing [ \t\r] from each line before hashing (match oh-my-pi approach)
      - Input is []byte, output is string (4 uppercase hex chars)
      - Unexported function (fileContentHash) — only used within builtin package
    acceptance:
      - fileContentHash returns deterministic 4-char uppercase hex for any input
      - Empty content returns a valid hash
      - Content differing only in trailing whitespace produces the same hash
      - Content differing in non-whitespace produces different hashes (probabilistic but test a few known pairs)
      - CRLF and LF files with same logical content produce the same hash
      - File with no trailing newline hashes correctly
    verification:
      - gofmt -w internal/tool/builtin/file_hash.go internal/tool/builtin/file_hash_test.go
      - go test ./internal/tool/builtin/ -run TestFileContentHash -v
      - go vet ./internal/tool/builtin/

  - id: step-2
    title: Hash-tagged read and grep output
    depends_on: [step-1]
    scope: >
      Add FileHash field to ReadResult. Add FileHashes map to GrepResult.
      Compute and populate hashes in the read and grep tool handlers.
      Add tests verifying hash presence and correctness in results.
    files:
      - internal/tool/builtin/result.go
      - internal/tool/builtin/read.go
      - internal/tool/builtin/grep.go
      - internal/tool/builtin/read_test.go
      - internal/tool/builtin/grep_test.go
    constraints:
      - ReadResult.FileHash is always populated (not optional)
      - GrepResult.FileHashes is a map[string]string keyed by display path
      - Hash is computed on the full file content, not just the returned window
      - Read tool reads full file content anyway (countFileLines already does this) — reuse that data
      - Do not change the Output string format — hash goes in the struct field only
      - Existing read and grep tests must pass unchanged
    acceptance:
      - ReadResult JSON includes "file_hash" field with 4-char hex value
      - GrepResult JSON includes "file_hashes" map when results are non-empty
      - Hash matches fileContentHash computed on the same file
      - Reading the same file twice returns the same hash
    verification:
      - go test ./internal/tool/builtin/ -run "TestRead|TestGrep" -v
      - go vet ./internal/tool/builtin/

  - id: step-3
    title: File hash staleness guard on mutate operations
    depends_on: [step-1]
    scope: >
      Add FileHash field to MutateOperation input type and schema.
      Add hash verification to the mutate planner — when file_hash is provided,
      verify it matches the current content hash before applying the operation.
      On mismatch, fail with a diagnostic. Add comprehensive tests.
    files:
      - internal/tool/builtin/input.go
      - internal/tool/builtin/schema.go
      - internal/tool/builtin/mutate.go
      - internal/tool/builtin/mutate_test.go
    constraints:
      - file_hash is optional — omitting preserves current behavior exactly
      - Verification happens in stateFor or a new verify step before planOperation applies changes
      - Hash is checked against planner state (which reflects prior operations), not raw disk
      - On mismatch, return error with diagnostic including expected vs actual hash
      - create operations skip hash verification (file doesn't exist yet)
      - Schema adds file_hash as optional string field on the operation object
      - All 25+ existing mutate tests must pass unchanged
    acceptance:
      - Valid hash on replace operation — succeeds
      - Stale hash on replace operation — fails with diagnostic containing "file_hash mismatch"
      - Missing hash on replace operation — succeeds (backward compat)
      - Valid hash on line_replace — succeeds
      - Stale hash on line_replace — fails
      - Hash on create (new file) — ignored, operation succeeds
      - Hash on delete — verified against current content
      - Hash on move — verified against source file
      - Hash after prior operation modified same file — must match post-modification hash
      - Hash on write (overwrite existing) — verified against current content
      - All existing mutate tests still pass
    verification:
      - go test ./internal/tool/builtin/ -run TestMutate -v
      - go vet ./internal/tool/builtin/

  - id: step-4
    title: Insert operations
    depends_on: [step-1]
    scope: >
      Add insert_before and insert_after operation types to mutate.
      Update schema, input types, and planner. Add comprehensive tests
      including edge cases and combinations with file_hash.
    files:
      - internal/tool/builtin/schema.go
      - internal/tool/builtin/mutate.go
      - internal/tool/builtin/mutate_test.go
    constraints:
      - insert_before line N inserts content before line N, shifting existing lines down
      - insert_after line N inserts content after line N
      - line field is required, 1-based
      - insert_after line 0 is an error (use insert_before line 1 to prepend)
      - content field is required and provides the text to insert
      - Binary file check applies (reject binary files)
      - Nonexistent file is rejected
      - Empty file with insert_before/insert_after is rejected (no valid anchor line)
      - Content without trailing newline gets one appended to maintain file structure
      - CRLF line endings in existing file are preserved for inserted content
      - file_hash verification is supported
      - Insert operations set state.touched and add to result.Modified
      - Diff output is generated for insert operations
      - All existing mutate tests still pass
    acceptance:
      - insert_before line 1 prepends content
      - insert_before middle line inserts correctly
      - insert_before last line inserts before it
      - insert_after line 1 inserts after first line
      - insert_after last line appends content
      - insert_after line 0 returns error
      - Insert single line into multi-line file
      - Insert multi-line content
      - Insert into single-line file (both before and after)
      - Insert preserves CRLF endings
      - Insert on binary file rejected
      - Insert on nonexistent file rejected
      - Insert combined with replace on same file works
      - Insert combined with line_replace on same file works
      - Insert with valid file_hash succeeds
      - Insert with stale file_hash fails
      - Diff output includes inserted lines
      - All existing mutate tests still pass
    verification:
      - go test ./internal/tool/builtin/ -run TestMutate -v
      - go vet ./internal/tool/builtin/

  - id: step-5
    title: Final validation and tool description update
    depends_on: [step-2, step-3, step-4]
    scope: >
      Update the mutate tool description to mention insert_before/insert_after
      and file_hash. Run full test suite, linter, and build. Verify no regressions.
    files:
      - internal/tool/builtin/mutate.go
    constraints:
      - Tool description must mention insert_before and insert_after as available operations
      - Tool description should mention file_hash as optional staleness guard
      - Do not change existing operation descriptions
      - No functional code changes in this step — description only
    acceptance:
      - mutate tool Description string includes insert_before, insert_after, file_hash
      - make check passes
      - go test -race ./... passes
      - All tests pass including new ones from prior steps
    verification:
      - gofmt -w internal/tool/builtin/mutate.go
      - make check
      - go test -race ./...
