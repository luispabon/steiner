steps:
  - id: step-1
    title: Config and sandbox foundation
    scope: |
      Add sandbox-related config types to internal/config and create the
      internal/sandbox package with bubblewrap invocation, mount assembly,
      environment filtering, and prerequisite checks.
    files:
      - internal/config/config.go
      - internal/config/defaults.go
      - internal/config/patch_apply.go
      - internal/config/patch_context.go
      - internal/sandbox/sandbox.go
      - internal/sandbox/sandbox_test.go
      - internal/sandbox/mounts.go
      - internal/sandbox/mounts_test.go
      - internal/sandbox/env.go
      - internal/sandbox/env_test.go
      - internal/sandbox/prereq.go
      - internal/sandbox/prereq_test.go
    constraints:
      - Add SandboxConfig, PermissionsConfig, HostMount to internal/config
      - Remove ApprovalConfig, ApprovalMode type, and related constants from internal/config
      - Sandbox type configured from SandboxConfig + workspace path + user home
      - WrapCommand(cmd *exec.Cmd) *exec.Cmd wraps process with bwrap args
      - In unsafe mode (enabled=false), WrapCommand is no-op passthrough
      - Mount assembly builds the full bwrap argument list from config
      - Developer environment paths auto-mounted ro (ssh, git, aws, kube, docker)
      - Host mounts from config layered as additional ro binds
      - Environment allowlist filters vars, overrides HOME
      - PrereqCheck verifies bwrap on PATH, returns clear error if missing
      - .steiner/home/ directory creation and gitignore setup
      - Keep file organisation under ~300 lines per file
    acceptance:
      - SandboxConfig, PermissionsConfig, HostMount structs exist with yaml tags
      - ApprovalConfig and ApprovalMode removed from config package
      - Sandbox.WrapCommand produces correct bwrap args for standard mount layout
      - Sandbox.WrapCommand is no-op when sandbox disabled
      - Mount assembly includes workspace rw, sandbox home rw, tmpfs /tmp, system paths ro, dev env ro
      - Host mounts from config added as ro binds
      - Env allowlist passes PATH/TERM/LANG/LC_*/TZ/SSH_AUTH_SOCK/EDITOR/VISUAL/SHELL/USER/LOGNAME/XDG_RUNTIME_DIR
      - Env blocks credential vars (AWS_SECRET_ACCESS_KEY, GH_TOKEN, etc.)
      - HOME overridden to /home/steiner
      - PrereqCheck returns nil when bwrap found, clear error when missing
      - .steiner/home/ created if not exists
      - All config changes compile with existing codebase (go build ./...)
    verification:
      - go test ./internal/sandbox/... -run Test
      - go test ./internal/config/... -run Test
      - go build ./...

  - id: step-2
    title: Fork Dive BashSession
    scope: |
      Fork Dive's BashSession into internal/tool/builtin/bash_session.go.
      Persistent bash process with marker-based output capture, timeout,
      output truncation. Add CommandWrapper hook for sandbox integration.
      Remove Dive toolkit dependency from bash tool.
    files:
      - internal/tool/builtin/bash_session.go
      - internal/tool/builtin/bash_session_test.go
      - internal/tool/builtin/bash.go
      - internal/tool/builtin/bash_test.go
    constraints:
      - Fork BashSession from Dive (persistent process, stdin/stdout pipes, marker-based output boundaries)
      - Drop all Dive type dependencies (dive.ToolResult, dive.TypedTool, etc.)
      - Add CommandWrapper func field to BashSession — called when creating the bash process, allows sandbox to wrap exec.Cmd
      - Return (stdout, stderr string, exitCode int, err error) — same interface as Dive
      - Rewrite bash.go to use forked BashSession directly instead of toolkit.BashTool
      - Keep steiner's existing BashResult output format
      - Port relevant Dive tests and add coverage for: persistent session state, stderr capture, restart clears state, multiple sequential commands, CommandWrapper hook
      - Include attribution comment referencing Dive origin
    acceptance:
      - bash_session.go contains BashSession with Start, Execute, Close, Restart
      - CommandWrapper field exists and is called during session start
      - bash.go no longer imports github.com/deepnoodle-ai/dive/toolkit
      - All existing bash_test.go tests pass
      - New tests cover persistent env vars across calls, stderr capture, session restart, CommandWrapper invocation
      - Output format unchanged (BashResult with exit_code, output, truncated, message)
    verification:
      - go test ./internal/tool/builtin/... -run TestBash
      - go build ./...

  - id: step-3
    title: Replace approval system with sandbox boundary prompts
    depends_on: [step-1]
    scope: |
      Remove the existing ApprovalResolver/ApprovalMode pipeline from the
      execution pipeline. Replace with sandbox boundary violation detection
      and prompting. Built-in tools get pre-check prompts via PathPolicy.
      Bash gets post-execution retry on sandbox denial.
    files:
      - internal/tool/approval.go
      - internal/tool/approval_test.go
      - internal/tool/execution_pipeline.go
      - internal/tool/execution_pipeline_test.go
      - internal/tool/executor.go
      - internal/tool/executor_test.go
      - internal/tool/types.go
      - internal/tool/preview.go
      - internal/tool/preview_test.go
    constraints:
      - Remove ApprovalResolver, ResolveApprovalMode, ModeFor, IsApprovalPrompt, IsApprovalDenied
      - Remove ToolDef.Approval field
      - Remove authorizeExecution and its approval mode branching from pipeline
      - Keep ApprovalResponder interface — repurpose for sandbox violation prompts
      - Adapt ApprovalRequest to carry sandbox violation context (denied path, reason, grant instructions)
      - New pipeline flow for built-in tools — PathPolicy violation triggers prompt, approved = execute with relaxed policy
      - New pipeline flow for bash/subprocess — sandbox denial detection triggers prompt, approved = re-execute without sandbox
      - Executor gains Sandbox field, wired at construction
      - In unsafe mode (no sandbox), pipeline never prompts
      - Preview adapted to show sandbox violation context
      - Update all tests to reflect new pipeline
    acceptance:
      - No references to ApprovalMode, ApprovalResolver, or ApprovalConfig in tool package
      - Pipeline prompts only on sandbox boundary violations
      - Built-in tool path violations detected before execution, prompt shown, relaxed execution on approval
      - Bash sandbox denial detected from exit code + stderr, prompt shown, unsandboxed re-execution on approval
      - Unsafe mode never prompts for any tool
      - Existing pipeline test scenarios updated or replaced
      - ApprovalResponder still used for prompting
    verification:
      - go test ./internal/tool/... -run Test
      - go build ./...

  - id: step-4
    title: Wire sandbox into CLI and tool execution
    depends_on: [step-1, step-2, step-3]
    scope: |
      Wire Sandbox into the CLI entry point: --unsafe flag, prerequisite
      check, sandbox initialization. Connect sandbox to bash tool via
      CommandWrapper and to subprocess execution via WrapCommand. Wire
      sandbox into Executor construction.
    files:
      - cmd/steiner/main.go
      - cmd/steiner/commands.go
      - cmd/steiner/runner.go
      - cmd/steiner/runner_run.go
      - cmd/steiner/tools.go
      - cmd/steiner/runtime.go
      - cmd/steiner/runtime_build.go
      - internal/tool/builtin/builtins.go
      - internal/tool/builtin/env.go
    constraints:
      - Add --unsafe flag to CLI, sets SandboxConfig.Enabled = false
      - On startup in standard mode, run PrereqCheck — hard error with install instructions if bwrap missing
      - Create Sandbox from config + workspace path + user home
      - Pass Sandbox to Executor construction
      - Pass CommandWrapper from Sandbox to bash tool Env
      - Wire Sandbox.WrapCommand into subprocess execution path in execution_pipeline.go
      - Ensure .steiner/home/ setup runs on startup
      - Env struct gains CommandWrapper field
      - Remove approval-related CLI config (if any)
    acceptance:
      - steiner --unsafe starts without bwrap
      - steiner (standard) fails with clear error if bwrap missing
      - steiner (standard) runs bash commands inside bwrap
      - Subprocess tools run inside bwrap in standard mode
      - --unsafe mode runs everything without bwrap, no prompts
      - .steiner/home/ created on first run
      - Build succeeds, existing tests pass
    verification:
      - go build ./cmd/steiner
      - go test ./cmd/steiner/... -run Test
      - go test ./internal/tool/... -run Test

  - id: step-5
    title: Delegation and subagent sandbox inheritance
    depends_on: [step-4]
    scope: |
      Ensure subagents inherit parent sandbox settings. Child permissions
      never exceed parent. Remove approval-related delegation code.
    files:
      - internal/delegation/bootstrap.go
      - internal/delegation/bootstrap_test.go
      - internal/delegation/contract.go
      - internal/delegation/contract_test.go
      - internal/delegation/tool.go
      - internal/delegation/tool_test.go
    constraints:
      - Subagent executor inherits parent Sandbox
      - Subagent cannot disable sandbox if parent has it enabled
      - Remove any ApprovalMode/ApprovalConfig references in delegation
      - Research agent gets read-only workspace mount (enforced by sandbox mount, not just tool selection)
      - child_permissions <= parent_permissions invariant tested
    acceptance:
      - Subagent tool execution uses parent Sandbox.WrapCommand
      - No ApprovalMode references in delegation package
      - Research subagent workspace is read-only at OS level
      - Test confirms child cannot escalate sandbox permissions
    verification:
      - go test ./internal/delegation/... -run Test
      - go build ./...

  - id: step-6
    title: Config documentation update
    depends_on: [step-1]
    scope: |
      Update docs/CONFIGURATION.md with new sandbox, permissions, and
      host_mounts config fields. Remove approval config documentation.
    files:
      - docs/CONFIGURATION.md
    constraints:
      - Document SandboxConfig fields (enabled, default)
      - Document PermissionsConfig fields (docker)
      - Document HostMount format (path, mode)
      - Remove ApprovalConfig documentation
      - Update config examples
    acceptance:
      - All new config fields documented with types, defaults, and examples
      - No references to approval config section
    verification: []

  - id: step-7
    title: Tool sandboxing documentation
    depends_on: [step-4]
    scope: |
      Create docs/TOOL_SANDBOXING.md with comprehensive sandboxing docs
      and v2 roadmap. Update README.md tool section.
    files:
      - docs/TOOL_SANDBOXING.md
      - README.md
    constraints:
      - Document threat model, goals, non-goals
      - Document standard vs unsafe mode
      - Document mount layout and filesystem model
      - Document developer environment auto-mounts
      - Document sandbox home (.steiner/home/)
      - Document environment variable allowlist
      - Document sandbox boundary prompts (how they work, when they appear)
      - Document host mounts configuration
      - Document docker opt-in
      - Document error reporting format
      - Section on v2 deferred items (session path grants, audit logging, macOS seatbelt, Windows/WSL2)
      - Update README.md built-in tools section and add sandboxing feature section
    acceptance:
      - docs/TOOL_SANDBOXING.md exists and covers all above topics
      - v2 roadmap section lists deferred items with brief rationale
      - README.md references sandboxing and links to detailed docs
    verification: []

  - id: step-8
    title: Final integration test and cleanup
    depends_on: [step-4, step-5, step-6, step-7]
    scope: |
      Full test suite, lint, build. Remove any remaining approval system
      dead code. Verify no regressions.
    files: []
    constraints:
      - grep for ApprovalMode, ApprovalConfig, ApprovalResolver across entire codebase — must be zero hits outside test helpers
      - All tests pass
      - Lint clean
      - Build succeeds
      - No unused imports or dead code from approval removal
    acceptance:
      - make check passes
      - make build-binaries succeeds
      - No ApprovalMode/ApprovalConfig/ApprovalResolver references in production code
      - No compilation warnings
    verification:
      - make check
      - make build-binaries
      - grep -r 'ApprovalMode\|ApprovalConfig\|ApprovalResolver' --include='*.go' . | grep -v _test.go | grep -v vendor
