stages:
  - id: stage-1
    objective: Harden file annotation correctness by invalidating reread annotations on steiner-originated writes even when filesystem mtime does not advance.
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: Add per-path write-generation tracking to smart context file observation and wire it through write/edit paths, annotation decisions, and diagnostics.
        scope: Own FileTracker state changes, write/edit generation bumps, read-time generation capture, annotation invalidation, and related diagnostics/tests.
        files:
          - internal/agent/file_tracker.go
          - internal/agent/file_tracker_test.go
          - internal/agent/context_manager.go
          - internal/agent/context_manager_test.go
          - internal/agent/context_management_integration_test.go
          - internal/agent/tool_exec.go
          - internal/agent/tool_exec_test.go
          - internal/output/debug.go
        constraints:
          - Keep generation state in Go runtime manager state only; do not persist it into conversation messages or history.
          - Increment the generation counter only after a successful steiner-originated file mutation and before the tool result is returned.
          - Preserve current annotation behavior when a path has never been mutated by steiner.
          - Extend file-annotation diagnostics to distinguish generation mismatches from mtime mismatches without introducing a new top-level event type.
          - Do not broaden this stage into scratchpad or masking refactors.
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - FileTracker records current generation alongside read metadata and checks both mtime and generation before serving an unchanged-file annotation.
          - Successful write/edit tool executions synchronously bump the generation for the affected path.
          - Diagnostics expose when full content was served because the generation changed despite identical mtime.
          - New and updated tests cover sub-second rewrite invalidation, unchanged rereads, and manager lifecycle survival of generation state.
        acceptance:
          - A write-read-write-read sequence within the same mtime granularity serves full content on the second read because generation changed.
          - An unchanged reread with matching range, mtime, and generation still produces the compact annotation.
          - Existing smart-context integration behavior remains intact outside the new invalidation condition.
        handoff: Implement generation tracking as an additive correctness fix with tightly scoped changes around file observation and mutation paths, then prove it with local agent-context tests before widening verification.
        verification:
          - gofmt -w internal/agent/file_tracker.go internal/agent/file_tracker_test.go internal/agent/context_manager.go internal/agent/context_manager_test.go internal/agent/context_management_integration_test.go internal/agent/tool_exec.go internal/agent/tool_exec_test.go internal/output/debug.go
          - go test ./internal/agent -run TestFileTracker
          - go test ./internal/agent -run TestContext

  - id: stage-2
    objective: Replace rolling conversation masking with epoch-based masking that preserves a byte-stable masked prefix between epoch advances and resets cleanly after compaction.
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: Add epoch masking state to the smart context manager, refactor masking boundaries around epoch advances, and extend masking diagnostics with epoch metadata.
        scope: Own smart-manager epoch state, PreAssembly masking boundary changes, compaction/reset integration, optional context-pressure trigger plumbing, and masking diagnostics/tests.
        files:
          - internal/agent/context_manager.go
          - internal/agent/context_manager_test.go
          - internal/agent/context_management_integration_test.go
          - internal/agent/compaction.go
          - internal/agent/compaction_test.go
          - internal/agent/state.go
          - internal/prompt/masking.go
          - internal/prompt/masking_test.go
          - internal/output/debug.go
        constraints:
          - Treat stage 2 as parallel-eligible with stage 3 after stage 1 is merged; do not introduce artificial dependencies on scratchpad work.
          - Extend the existing `output.ContextDiagnosticsEvent` and `NewContextMaskingEvent` payload path with epoch metadata instead of creating a separate epoch event type.
          - Make the turn-count trigger required and the context-pressure trigger conditional on a clean token-estimation hook at the PreAssembly boundary.
          - Reset epoch state after any compaction strategy and initialize it sensibly when loading existing conversation history.
          - Preserve prompt.MaskConversation package ownership for actual masking transformation logic; keep epoch policy in `internal/agent`.
        depends_on:
          - stage-1-step-1
        parallel_group: post-stage-1
        can_run_in_parallel: true
        suggested_model: cheap-good
        outputs:
          - SmartContextManager tracks epoch boundary and epoch start turn and uses them instead of rolling `currentTurn-window` masking.
          - Masking diagnostics include enough metadata to distinguish previously masked turns from newly masked turns in an epoch advance.
          - Compaction resets epoch state and reports the reset through existing diagnostics pathways.
          - Tests verify byte-stable masked output between epoch advances and correct reset behavior after compaction or loaded-history startup.
        acceptance:
          - Between epoch advances, repeated prompt assemblies for successive turns keep the already-masked prefix byte-identical.
          - After an epoch advance, only the newly eligible older turns transition into masked form.
          - After compaction, retained conversation resumes with no stale epoch boundary masking retained turns unexpectedly.
        handoff: Implement epoch masking as an agent-policy change around the current prompt masking functions, reuse the existing context diagnostics event family, and leave stage 3 entirely decoupled except for normal merge coordination.
        verification:
          - gofmt -w internal/agent/context_manager.go internal/agent/context_manager_test.go internal/agent/context_management_integration_test.go internal/agent/compaction.go internal/agent/compaction_test.go internal/agent/state.go internal/prompt/masking.go internal/prompt/masking_test.go internal/output/debug.go
          - go test ./internal/prompt -run TestMask
          - go test ./internal/agent -run TestContext
          - go test ./internal/agent -run TestCompaction

  - id: stage-3
    objective: Introduce tiered scratchpad modes with scaffold-first behavior, shared heuristic decisions infrastructure, and a compatibility-safe reduced hybrid schema.
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: Add scratchpad mode config and shared scaffold-managed state infrastructure, including heuristic decision extraction and compatibility-tolerant hybrid parsing.
        scope: Own config plumbing, scratchpad state shape changes, tool schema compatibility handling, heuristic decisions extraction, and related tests that are independent of pivot-turn inference.
        files:
          - internal/config/config.go
          - internal/config/defaults.go
          - internal/config/validate.go
          - internal/config/config_test.go
          - internal/config/validate_test.go
          - internal/agent/scratchpad.go
          - internal/agent/scratchpad_test.go
          - internal/agent/context_manager.go
          - internal/agent/context_manager_test.go
          - internal/agent/context_management_integration_test.go
          - internal/agent/tool_result.go
          - internal/prompt/system.go
        constraints:
          - Treat stage 3 as parallel-eligible with stage 2 after stage 1 is merged; do not serialise it behind epoch masking work.
          - Make heuristic decision extraction mode-agnostic shared infrastructure; only the merge of model-written decisions is hybrid-specific.
          - Reducing hybrid from 7 fields to 4 is a compatibility-sensitive schema change: parsing must accept unknown legacy fields, ignore them, and log a warning rather than erroring or silently breaking.
          - In `scaffold_only`, the scratchpad tool must not be registered and scratchpad instructions must not appear in the system prompt.
          - In `hybrid`, preserve existing behavior as closely as practical while switching to the reduced field set and compatibility parsing.
        depends_on:
          - stage-1-step-1
        parallel_group: post-stage-1
        can_run_in_parallel: true
        suggested_model: cheap-good
        outputs:
          - Config accepts `context_management.scratchpad_mode` with default `scaffold_only` and validated `hybrid` alternative.
          - Scratchpad state and rendering move toward `intent`, `decisions`, `open`, and `next`, while shared derived fields such as working file and last action come from steiner-managed state.
          - Heuristic decision extraction runs for both modes and appends edit/test/file-switch/compaction facts independent of model-written decisions.
          - Hybrid tool-result ingestion tolerates legacy extra fields, ignores them, and emits a warning diagnostic for compatibility visibility.
        acceptance:
          - `scaffold_only` requests do not expose the scratchpad tool or its instructions to the model.
          - `hybrid` requests still accept old-style tool payloads without failing request processing.
          - Shared heuristic decisions are populated even when no model-written decisions are supplied.
        handoff: Build the shared scratchpad infrastructure and compatibility layer first so pivot inference in the next step can consume stable state without entangling schema migration and provider-call work.
        verification:
          - gofmt -w internal/config/config.go internal/config/defaults.go internal/config/validate.go internal/config/config_test.go internal/config/validate_test.go internal/agent/scratchpad.go internal/agent/scratchpad_test.go internal/agent/context_manager.go internal/agent/context_manager_test.go internal/agent/context_management_integration_test.go internal/agent/tool_result.go internal/prompt/system.go
          - go test ./internal/config -run Test
          - go test ./internal/agent -run TestScratchpad
          - go test ./internal/agent -run TestContext

      - id: stage-3-step-2
        objective: Implement pivot-turn detection and second-pass scaffold-only inference using a provider path that bypasses normal scratchpad injection.
        scope: Own momentum/pivot detection, compact pivot inference request building, same-provider model call integration, carry-forward behavior on non-pivot turns or parse failures, and integration tests for non-recursive scaffold-only updates.
        files:
          - internal/agent/context_manager.go
          - internal/agent/model_call.go
          - internal/agent/message_convert.go
          - internal/agent/runner.go
          - internal/agent/runner_test.go
          - internal/agent/context_management_integration_test.go
          - internal/agent/turn_progression.go
          - internal/prompt/types.go
        constraints:
          - Do not route pivot inference through the normal assembled conversation path in `assemblyOptions`; that path currently appends the synthetic scratchpad user message and would create recursive contamination.
          - Use the same provider/model configuration as the main inference path, but construct a minimal request explicitly for pivot inference.
          - On parse failure, carry forward prior `intent` and `next` values rather than clearing state.
          - Keep non-pivot turns cheap by carrying forward prior inferred fields unchanged and avoiding extra model calls.
          - Cover first-turn and post-compaction pivot detection explicitly in tests.
        depends_on:
          - stage-3-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Scaffold-only mode performs a second-pass JSON inference on pivot turns using minimal state and last-response context.
          - The pivot inference request bypasses scratchpad injection and uses a dedicated minimal prompt/request builder.
          - Momentum, working file, and last action state feed pivot detection and scaffold rendering consistently.
          - Integration tests prove scaffold-only intent/next updates happen without recursive scratchpad injection.
        acceptance:
          - Pivot inference requests do not include the normal synthetic scratchpad user message.
          - First turn, post-compaction turns, and momentum pivots trigger inference; steady iterative turns do not.
          - Failed or malformed second-pass responses preserve prior inferred intent/next state.
        handoff: Add the minimal second-pass provider call only after shared scaffold state is stable, and validate that scaffold-only behavior remains token-light and non-recursive.
        verification:
          - gofmt -w internal/agent/context_manager.go internal/agent/model_call.go internal/agent/message_convert.go internal/agent/runner.go internal/agent/runner_test.go internal/agent/context_management_integration_test.go internal/agent/turn_progression.go internal/prompt/types.go
          - go test ./internal/agent -run TestContext
          - go test ./internal/agent -run TestRunner
          - go test ./internal/agent ./internal/config ./internal/prompt
