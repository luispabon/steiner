steps:
  - id: step-1
    title: Image token estimation in provider
    scope: |
      Fix token_estimator.go:countMessage() to account for message.Images.
      Add image token cost using Anthropic formula: (width * height) / 750 per image.
      If dimensions unknown, fall back to len(Data) * 3/4 / 4 (base64 decode size / ~4 chars per token).
      Add image overhead constant (85 tokens per image block for Anthropic wire framing).
    files:
      - internal/provider/token_estimator.go
      - internal/provider/token_estimator_test.go
    constraints:
      - Do not change the public API of EstimateMessageTokens or EstimateChatRequestTokens
      - Image token count is additive to existing text token count in countMessage()
      - Must handle zero-dimension images gracefully (fallback to byte-size heuristic)
    acceptance:
      - countMessage() returns nonzero tokens for messages with images
      - A message with a 2560x1545 image estimates ~5270 tokens for the image portion
      - A message with no images has unchanged token count
      - Zero-dimension images use byte-size fallback
    verification:
      - go test ./internal/provider/ -run TestEstimate -count=1
      - go build ./...

  - id: step-2
    title: Image resize utility
    scope: |
      Add image resize function that caps longest side at 2048px, preserving aspect ratio.
      Input: raw image bytes. Output: resized PNG bytes, width, height.
      If image already fits within 2048px, return as-is (no re-encode).
      Use Go stdlib image package (already imported in read.go).
      Place in internal/tool/builtin alongside existing image helpers (binary.go, read.go).
    files:
      - internal/tool/builtin/image_resize.go
      - internal/tool/builtin/image_resize_test.go
    constraints:
      - No new dependencies — stdlib image, image/png, image/jpeg only
      - Output always PNG (consistent with clipboard extraction)
      - Preserve aspect ratio
      - Return original bytes unchanged if already within 2048px limit
    acceptance:
      - 4000x3000 image resized to 2048x1536
      - 1920x1080 image returned unchanged
      - 100x100 image returned unchanged
      - Non-square aspect ratios preserved correctly
      - Output is valid PNG
    verification:
      - go test ./internal/tool/builtin/ -run TestResize -count=1
      - go build ./...

  - id: step-3
    title: Clipboard reading with build-tag platform gating
    scope: |
      Add clipboard image reading to internal/tui using go-nativeclipboard.
      Three files: clipboard.go (shared types/constants), clipboard_supported.go (build-tagged
      for linux/darwin/windows amd64/arm64), clipboard_not_supported.go (stub for other platforms).
      ReadClipboardImage() returns raw image bytes or error.
      ReadClipboardText() returns string or error (for path fallback).
      5MB size limit on image data.
      MIME detection via net/http.DetectContentType.
    files:
      - go.mod (add go-nativeclipboard dependency)
      - internal/tui/clipboard.go
      - internal/tui/clipboard_supported.go
      - internal/tui/clipboard_not_supported.go
      - internal/tui/clipboard_test.go
    constraints:
      - No cgo — go-nativeclipboard uses purego
      - Build tags must match crush's pattern for platform support
      - Errors must be typed (ErrClipboardNoImage, ErrClipboardUnsupported, ErrImageTooLarge)
      - Must not panic on any platform
    acceptance:
      - Compiles on linux/amd64, darwin/amd64, darwin/arm64, windows/amd64
      - Unsupported platforms return ErrClipboardUnsupported
      - Images over 5MB return ErrImageTooLarge
      - MIME type correctly detected for PNG, JPEG, GIF, WebP
    verification:
      - go build ./...
      - go vet ./...

  - id: step-4
    title: TUI paste handling and pending image state
    depends_on: [step-2, step-3]
    scope: |
      Add Ctrl+V key binding to TUI composer. On Ctrl+V, dispatch async tea.Cmd that:
      1. Tries ReadClipboardImage() — if image found, resize to 2048px cap, detect MIME,
         base64 encode, build agent.ImageBlock, return as clipboardImageMsg
      2. If no image, tries ReadClipboardText() — if text is a valid path to an image file
         (using builtin.IsImageExtension), read file, resize, encode, return as clipboardImageMsg
      3. If neither, return nil (no-op, normal text paste unaffected)

      Add pendingImages []agent.ImageBlock to TUI Model. On clipboardImageMsg, append to
      pendingImages and show [Image N] indicator in composer area.
      Clear pendingImages on submit and on /clear.
    files:
      - internal/tui/model.go (add pendingImages field)
      - internal/tui/model_update.go (handle clipboardImageMsg)
      - internal/tui/model_update_keys.go (add Ctrl+V key binding)
      - internal/tui/model_input.go (pass pendingImages on submit, clear on submit/clear)
      - internal/tui/clipboard_paste.go (new — paste command, clipboardImageMsg type, async tea.Cmd)
      - internal/tui/clipboard_paste_test.go
    constraints:
      - Ctrl+V must not interfere with normal text paste (textarea handles that via different path)
      - Async — clipboard read must not block TUI
      - Multiple pastes before submit accumulate images
      - Status line or composer area must indicate pending images
    acceptance:
      - Ctrl+V with image in clipboard adds to pendingImages
      - Ctrl+V with file path to image in clipboard reads and attaches the image
      - Ctrl+V with text-only clipboard is a no-op
      - "[Image 1]" indicator visible in composer when image pending
      - Submit clears pendingImages
      - /clear clears pendingImages
    verification:
      - go test ./internal/tui/ -run TestPaste -count=1
      - go build ./...

  - id: step-5
    title: SubmitPrompt extension and session handler wiring
    depends_on: [step-4]
    scope: |
      Add Images []agent.ImageBlock field to interactive.SubmitPrompt.
      Update TUI executeSubmitAction to pass pendingImages into SubmitPrompt.Images.
      Update interactive session Handle(SubmitPrompt) to thread images into the agent.Message
      appended to conversation history.
    files:
      - internal/interactive/actions.go (add Images field to SubmitPrompt)
      - internal/interactive/session.go (thread images into agent.Message)
      - internal/interactive/session_test.go (test image threading)
      - internal/tui/model_input.go (pass pendingImages to SubmitPrompt)
    constraints:
      - SubmitPrompt.Images is nil when no images — zero allocation for text-only prompts
      - Session handler must not modify the ImageBlock data (pass through as-is)
    acceptance:
      - SubmitPrompt with images creates agent.Message with Images field populated
      - SubmitPrompt without images works identically to before (no regression)
      - Images appear in conversation history after submit
    verification:
      - go test ./internal/interactive/ -run TestSubmitPrompt -count=1
      - go test ./internal/tui/ -run TestSubmit -count=1
      - go build ./...

  - id: step-6
    title: Strip images after model response
    depends_on: [step-1]
    scope: |
      After the model responds to a turn containing images, strip the ImageBlock data from
      that user/tool message and replace with a text placeholder appended to Content.
      Placeholder format: "[image: WxH fmt size]" (e.g., "[image: 2560x1545 png 478KB]").
      This happens in turn_progression.go after the model's response is received,
      before the next turn begins.

      The stripping replaces ImageBlock.Data with "" and sets a flag or moves the
      description into Content — the ImageBlock metadata (dimensions, MIME, size) is
      preserved for display purposes but the heavy base64 data is gone.
    files:
      - internal/agent/turn_progression.go (strip images after model response)
      - internal/agent/turn_progression_test.go (test stripping)
      - internal/agent/types.go (possibly add helper for placeholder text generation)
    constraints:
      - Only strip after model has responded (not before sending)
      - Preserve ImageBlock metadata for TUI display (width, height, media type, size)
      - Clear ImageBlock.Data to free memory
      - Placeholder text must be appended to message Content, not replace it
      - Must handle messages with multiple images
      - Must handle tool result messages with images (read tool)
    acceptance:
      - After model response, user message images have Data="" and placeholder in Content
      - After model response, tool messages with images have Data="" and placeholder in Content
      - Token estimation for stripped messages reflects reduced cost (no image tokens)
      - TUI still shows image placeholder from metadata (width/height preserved)
      - Messages without images are untouched
    verification:
      - go test ./internal/agent/ -run TestStrip -count=1
      - go test ./internal/agent/ -run TestTurnProgress -count=1
      - go build ./...

  - id: step-7
    title: Vision capability gating
    scope: |
      Wire the Vision config field through to message assembly so images are not sent
      to models that don't support vision. When Vision is explicitly false, strip images
      from messages before sending (replace with placeholder text).

      Check in the provider request building or prompt assembly layer — if the resolved
      model has Vision==false (explicit), remove image blocks and add a note like
      "[image omitted: model does not support vision]".

      Vision==nil (unset) should default to allowing images (most modern models support vision).
    files:
      - internal/provider/anthropic_wire.go (gate image blocks on vision capability)
      - internal/provider/openai_wire.go (gate image blocks on vision capability)
      - internal/provider/types.go (possibly add Vision field to ChatRequest or pass through)
      - internal/provider/anthropic_wire_test.go
      - internal/provider/openai_wire_test.go
    constraints:
      - Vision==nil (unset) means allow images (permissive default)
      - Vision==false means strip images with placeholder
      - Vision==true means allow images
      - Must not lose the text content of messages when stripping images
    acceptance:
      - Model with vision=false sends no image blocks, adds placeholder text
      - Model with vision=true sends image blocks normally
      - Model with vision=nil (default) sends image blocks normally
      - Text content of messages preserved regardless of vision setting
    verification:
      - go test ./internal/provider/ -run TestVision -count=1
      - go test ./internal/provider/ -run TestAnthropic -count=1
      - go build ./...

  - id: step-8
    title: Documentation update
    depends_on: [step-4, step-5, step-6, step-7]
    scope: |
      Update README.md and relevant docs to document image paste support.
      docs/IMAGE_PROMPTS.md already exists — verify it's accurate after implementation.
      Update CLAUDE.md built-in tools section if read tool image behavior changed.
    files:
      - README.md
      - docs/IMAGE_PROMPTS.md
    constraints:
      - Keep doc updates minimal and accurate
      - Do not document internal implementation details in user-facing docs
    acceptance:
      - README mentions image paste (Ctrl+V) in features
      - IMAGE_PROMPTS.md accurately reflects implemented behavior
    verification:
      - make check
