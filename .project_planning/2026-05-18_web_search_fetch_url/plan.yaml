stages:
  - id: stage-1
    objective: Add SearchConfig to config package and validate it
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: |
          Add SearchConfig struct and wire it into Config. Add validation that
          catches misconfigured backends at startup (e.g. backend "google" but
          missing env vars, backend "searxng" but missing URL, unknown backend name).
        scope: Config struct, validation, defaults, deserialization
        files:
          - internal/config/config.go
          - internal/config/validate.go
          - internal/config/config_test.go
          - internal/config/validate_test.go
          - internal/config/defaults.go
          - internal/config/defaults_test.go
        constraints:
          - SearchConfig must have Backend string and SearxngURL string fields
          - Backend values: "" (disabled), "google", "kagi", "brave", "searxng"
          - Validation must check env vars exist for google (GOOGLE_SEARCH_CX, GOOGLE_SEARCH_API_KEY), kagi (KAGI_API_KEY), brave (BRAVE_API_KEY)
          - Validation must check SearxngURL is non-empty when backend is "searxng"
          - Empty/unset backend is valid (disabled state)
          - Unknown backend name is a validation error
          - Zero-value SearchConfig means search disabled
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - SearchConfig struct in config.go
          - Validation rules in validate.go
          - Tests for deserialization, defaults, and validation
        acceptance:
          - SearchConfig deserializes from YAML correctly
          - Valid configs pass validation
          - Missing env vars for configured backend fail validation
          - Missing SearxngURL for searxng backend fails validation
          - Unknown backend name fails validation
          - Empty backend passes validation
        handoff: |
          Added SearchConfig to config.Config with Backend and SearxngURL fields.
          Validation checks env vars for google/kagi/brave and SearxngURL for searxng.
          Empty backend is valid (search disabled). Tests cover all paths.
        verification:
          - go test ./internal/config/... -run TestSearch
          - go test ./internal/config/...
          - go vet ./internal/config/...

  - id: stage-2
    objective: Implement search backends and fetch_url tool
    parallel: true
    steps:
      - id: stage-2-step-1
        objective: |
          Implement the Brave Search web.Searcher backend. This is a new implementation
          since dive/wonton have no Brave support. HTTP GET to Brave's web search API,
          parse JSON response, map to web.SearchOutput.
        scope: Brave Search API client implementing web.Searcher
        files:
          - internal/tool/builtin/brave_search.go
          - internal/tool/builtin/brave_search_test.go
        constraints:
          - Must implement web.Searcher interface from github.com/deepnoodle-ai/wonton/web
          - API endpoint is https://api.search.brave.com/res/v1/web/search
          - API key passed via X-Subscription-Token header
          - Constructor takes API key string, returns (web.Searcher, error) — error if key empty
          - Respect context cancellation
          - HTTP timeout 15s
          - Map Brave response web.results[] to web.SearchItem (url, title, description)
          - Clamp limit to 1-20 (Brave max is 20 per request)
          - Return error on non-200 responses
          - Do not add external dependencies beyond wonton/web and stdlib
        depends_on: []
        parallel_group: backends
        can_run_in_parallel: true
        suggested_model: cheap-good
        outputs:
          - BraveSearcher struct in brave_search.go
          - NewBraveSearcher constructor
          - Tests using httptest.NewServer with recorded Brave API response shape
        acceptance:
          - Implements web.Searcher
          - Successful search returns correctly mapped results
          - Empty API key returns constructor error
          - Non-200 response returns error
          - Context cancellation is respected
          - Limit is clamped to 1-20
        handoff: |
          BraveSearcher implements web.Searcher. Constructor takes API key string.
          Tests use httptest.NewServer to mock Brave API. All results mapped to
          web.SearchItem with url, title, description.
        verification:
          - go test ./internal/tool/builtin/... -run TestBrave
          - go vet ./internal/tool/builtin/...

      - id: stage-2-step-2
        objective: |
          Implement fetch_url tool as a steiner ToolDef wrapping dive's toolkit.FetchTool.
          Follow the bash.go wrapping pattern: define input/schema, call dive tool, shape result.
          Add to input.go for FetchURLInput type and NormalizeFetchURL. Add schema to schema.go.
        scope: fetch_url ToolDef, input types, schema, tests
        files:
          - internal/tool/builtin/fetch_url.go
          - internal/tool/builtin/fetch_url_test.go
          - internal/tool/builtin/input.go
          - internal/tool/builtin/schema.go
        constraints:
          - Follow bash.go wrapping pattern exactly
          - Schema has url (required string) and max_size (optional int, default 500000, max 1000000)
          - Use dive toolkit.NewFetchTool with FetchToolOptions
          - Use dive toolkit.SafeHTTPClient for SSRF-safe HTTP client
          - Result shape is structured JSON with url, title, description, content (markdown), content_length fields
          - Approval mode auto
          - Return structured error result on network failure, not hard error
          - Add FetchURLInput struct to input.go
          - Add FetchURLSchema() to schema.go
          - Add NormalizeFetchURL to input.go
        depends_on: []
        parallel_group: backends
        can_run_in_parallel: true
        suggested_model: cheap-good
        outputs:
          - NewFetchURLTool(env) function returning tool.ToolDef
          - FetchURLInput in input.go
          - FetchURLSchema() in schema.go
          - Tests using httptest.NewServer serving HTML
        acceptance:
          - Fetches URL and returns markdown content
          - SSRF protection blocks private IPs
          - max_size parameter limits content
          - Network errors return structured error result
          - Invalid URL returns validation error
          - Schema matches expected shape
        handoff: |
          fetch_url tool wraps dive's FetchTool. NewFetchURLTool(env) returns tool.ToolDef.
          FetchURLInput and FetchURLSchema added to input.go and schema.go.
          Tests use httptest.NewServer. Structured error results on failure.
        verification:
          - go test ./internal/tool/builtin/... -run TestFetchURL
          - go vet ./internal/tool/builtin/...

      - id: stage-2-step-3
        objective: |
          Implement the search backend factory and web_search ToolDef. The factory
          reads SearchConfig and returns a web.Searcher (or nil when disabled). The
          ToolDef wraps any web.Searcher backend with steiner's input/schema/result patterns.
          Also implement SearXNG searcher (simple HTTP+JSON client).
        scope: Search backend factory, SearXNG searcher, web_search ToolDef, input types, schema
        files:
          - internal/tool/builtin/search_backend.go
          - internal/tool/builtin/search_backend_test.go
          - internal/tool/builtin/web_search.go
          - internal/tool/builtin/web_search_test.go
          - internal/tool/builtin/input.go
          - internal/tool/builtin/schema.go
        constraints:
          - NewSearchBackend(cfg config.SearchConfig) (web.Searcher, error) — returns nil, nil when backend is empty
          - For google, use dive experimental/toolkit/google.New with google.WithCredentials from env vars
          - For kagi, use dive experimental/toolkit/kagi.New with kagi.WithKagiAPIKey from env var
          - For brave, use NewBraveSearcher from brave_search.go
          - For searxng, implement a SearxngSearcher that GETs <url>/search?q=<query>&format=json&categories=general and maps results to web.SearchOutput
          - NewWebSearchTool(searcher web.Searcher) returns tool.ToolDef
          - Schema has query (required string) and limit (optional int, default 10, max 30)
          - Result shape is JSON array of {url, title, description}
          - Approval mode auto
          - Add WebSearchInput to input.go, WebSearchSchema() to schema.go, NormalizeWebSearch to input.go
          - SearxngSearcher constructor takes URL string
        depends_on:
          - stage-1-step-1
          - stage-2-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - NewSearchBackend factory
          - SearxngSearcher implementing web.Searcher
          - NewWebSearchTool function
          - WebSearchInput, WebSearchSchema, NormalizeWebSearch
          - Tests for factory (all backends + nil), SearxngSearcher (httptest), web_search ToolDef (mock searcher)
        acceptance:
          - Factory returns correct searcher type for each backend value
          - Factory returns nil for empty backend
          - SearxngSearcher fetches and maps results correctly
          - web_search ToolDef shapes results into expected JSON
          - Network errors return structured error result
          - Empty query returns validation error
          - Limit clamped to 1-30
        handoff: |
          Search backend factory builds web.Searcher from config. SearxngSearcher
          implements web.Searcher. web_search ToolDef wraps any searcher.
          All wired through NewSearchBackend(cfg). Tests cover all backends and error paths.
        verification:
          - go test ./internal/tool/builtin/... -run TestSearchBackend
          - go test ./internal/tool/builtin/... -run TestWebSearch
          - go test ./internal/tool/builtin/... -run TestSearxng
          - go vet ./internal/tool/builtin/...

  - id: stage-3
    objective: Wire tools into registry, conditionally disable research agent, remove dummy stubs
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: |
          Wire everything together: add fetch_url to Builtins(), conditionally add
          web_search based on config, update buildActiveRegistry to conditionally
          register web_search and skip research agent when no backend configured,
          remove dummy tools, update AllSpecializedToolDefs to accept excluded types.
        scope: Builtins wiring, runner.go, delegation, dummy removal
        files:
          - internal/tool/builtin/builtins.go
          - internal/tool/dummy_tools.go
          - internal/tool/dummy_tools_test.go
          - cmd/steiner/runner.go
          - internal/delegation/specialized_tools.go
          - internal/delegation/specialized_tools_test.go
          - internal/delegation/agent_type.go
          - cmd/steiner/runner_test.go
        constraints:
          - Builtins(env) always includes NewFetchURLTool(env)
          - Builtins(env) does NOT include web_search (it's conditionally added at runner level)
          - buildActiveRegistry receives SearchConfig or a pre-built web.Searcher
          - When searcher is non-nil, register web_search in both base clone and extendedBase
          - When searcher is nil, do NOT register web_search, do NOT register research agent specialized tool
          - Add ExcludeTypes []AgentType field to SpecializedToolDeps
          - AllSpecializedToolDefs skips types in ExcludeTypes
          - Delete internal/tool/dummy_tools.go and internal/tool/dummy_tools_test.go
          - Remove DummyWebSearchTool/DummyFetchURLTool registration from buildActiveRegistry
          - Update runner_test.go for changed buildActiveRegistry signature
          - Update specialized_tools_test.go for ExcludeTypes
        depends_on:
          - stage-2-step-2
          - stage-2-step-3
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Updated Builtins() with fetch_url
          - Conditional web_search registration in buildActiveRegistry
          - Research agent excluded when no search backend
          - Dummy tools deleted
          - Updated tests
        acceptance:
          - fetch_url always present in Builtins
          - web_search registered only when searcher non-nil
          - Research agent tool not registered when searcher nil
          - Research agent tool registered when searcher non-nil
          - Dummy tools files deleted
          - No references to DummyWebSearchTool or DummyFetchURLTool remain
          - All existing tests pass with updated signatures
          - go build ./... succeeds
        handoff: |
          fetch_url in Builtins. web_search conditionally registered.
          Research agent excluded when no search backend. Dummy stubs removed.
          AllSpecializedToolDefs respects ExcludeTypes. All tests updated.
        verification:
          - go build ./...
          - go test ./internal/tool/...
          - go test ./internal/delegation/...
          - go test ./cmd/steiner/...
          - go vet ./...
          - make check
