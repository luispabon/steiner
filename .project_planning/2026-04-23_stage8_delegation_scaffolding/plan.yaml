stages:
  - id: stage-1
    objective: >-
      Establish delegation contract and isolated child state. Introduce the
      `internal/delegation` package with the spec, result, scoped context
      handoff builder, limits model, and a one-shot `SpawnDelegate` entrypoint.
      Add `internal/agent/subagent_state.go` for the isolated child agent
      state. Cover behaviour with unit tests. No wiring into the parent tool
      registry yet; no scheduler or event changes.
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: >-
          Build the delegation package and child-agent state. Define
          `DelegationSpec`, `DelegationResult`, the status enum, and the
          tighten-only limits model. Implement the scoped context handoff
          builder (fresh system prompt, no parent transcript), the child tool
          registry construction that omits `delegate`, and a Go-level
          `SpawnDelegate(ctx, spec) (DelegationResult, error)` entry that wires
          the isolated child state through the existing agent loop machinery
          behind an internal interface. Make the contract shape forward
          compatible with a later `SessionHandle` / re-promptable variant
          without exposing one now.
        scope: >-
          `internal/delegation/` package and `internal/agent/subagent_state.go`
          plus their unit tests. Read-only access to existing agent loop and
          tool registry interfaces to understand their shapes.
        files:
          - internal/delegation/contract.go
          - internal/delegation/task.go
          - internal/delegation/result.go
          - internal/delegation/scaffold.go
          - internal/delegation/limits.go
          - internal/delegation/*_test.go
          - internal/agent/subagent_state.go
          - internal/agent/subagent_state_test.go
        constraints:
          - Respect package boundaries per AGENTS.md. `internal/delegation` must
            not reach into provider transport internals; it consumes provider
            abstractions through their existing public Go interfaces.
          - Do not expose `delegate` on any tool registry in this step. Tool
            registration is deferred to stage-3.
          - Fresh child context means no parent transcript leak; if the
            handoff builder needs project `AGENTS.md`, it must be gathered
            through the normal context-gathering path, not copied from parent.
          - Treat child result as data: no path where child output is
            interpreted as instructions to parent.
          - Use table-driven tests where multiple input/output pairs apply.
          - Thread `context.Context` through every exported function.
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - New `internal/delegation` package compiling cleanly.
          - New `internal/agent/subagent_state.go` compiling cleanly.
          - Unit tests covering contract serialisation, child-state isolation
            from parent state, tighten-only limit override behaviour, and
            child tool-registry excluding `delegate`.
        acceptance:
          - `go build ./...` succeeds.
          - `go vet ./internal/delegation/... ./internal/agent/...` is clean.
          - `go test ./internal/delegation/... ./internal/agent/...` passes.
          - `gofmt -l` reports no unformatted files among edited files.
          - Contract structs have fields matching `overview.md`: parent sends
            task, scoped context, allowed tools, limits; child returns final
            answer, compact summary, status, turn/token counters. No
            `touched_files` field.
          - Child tool registry construction is unit-tested to exclude the
            `delegate` tool even when the parent had it.
        handoff: >-
          Delegation package + child state exist with unit tests. Stage-2 can
          now hook the scheduler, add events, and render placeholders without
          touching contract shape.
        verification:
          - gofmt -w <changed Go files>
          - go vet ./internal/delegation/... ./internal/agent/...
          - go test ./internal/delegation/... ./internal/agent/...
          - go build ./...

  - id: stage-2
    objective: >-
      Wire the internal integration points: scheduler gates all LLM calls for
      parent and children, new delegation event types exist with typed
      payloads, and the TUI content pane renders those events as muted
      placeholder blocks. All three land together because they are small,
      orthogonal, and the stage-3 end-to-end test needs them all.
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: >-
          Extend `internal/provider/scheduler.go` so every LLM call acquires a
          slot from a single shared budget bounded by `provider.parallelism`,
          with no bypass path for children. Add the three delegation event
          types (`EventDelegationStarted`, `EventDelegationComplete`,
          `EventDelegationFailed`) and their typed payloads
          (`DelegationStartedEvent`, `DelegationCompleteEvent`,
          `DelegationFailedEvent`) to `internal/output/log.go`, carrying
          `agent_id`, task preview, status, turn and token counters, and
          error string as relevant. Extend `internal/tui/content.go` to
          handle those events as muted placeholder blocks (no dedicated
          polish). Ensure `internal/delegation` emits these events at the
          right lifecycle points but does not know about the TUI.
        scope: >-
          `internal/provider/scheduler.go`, `internal/output/log.go`,
          `internal/tui/content.go`, emission calls from
          `internal/delegation/task.go`, plus related tests.
        files:
          - internal/provider/scheduler.go
          - internal/provider/scheduler_test.go
          - internal/output/log.go
          - internal/output/log_test.go
          - internal/tui/content.go
          - internal/tui/content_test.go
          - internal/delegation/task.go
        constraints:
          - No regression in existing scheduler semantics for the
            single-agent path. Existing tests must continue to pass.
          - Delegation package must emit events via the existing
            `internal/output` interface; do not import the TUI directly.
          - Event payloads carry task *preview* (truncated), never the full
            task body, to avoid bloating event logs.
          - TUI placeholders must be styled as muted (per existing theme
            affordances) and must not require adding new theme tokens in
            this stage.
        depends_on: [stage-1-step-1]
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Scheduler enforces shared budget for parent + child runs.
          - Three new delegation event types and typed payloads available in
            `internal/output`.
          - `internal/tui/content.go` renders the new events as muted
            placeholders.
          - Delegation package emits started / complete / failed events
            around the child lifecycle.
        acceptance:
          - `go vet ./internal/provider/... ./internal/output/... ./internal/tui/... ./internal/delegation/...`
            is clean.
          - `go test ./internal/provider/... ./internal/output/... ./internal/tui/... ./internal/delegation/...`
            passes.
          - A scheduler unit test demonstrates `parallelism` is still
            enforced when multiple agent instances (parent + simulated
            child) attempt concurrent calls.
          - An `internal/output` unit test round-trips each of the three
            delegation events through its encoder/decoder.
          - A `internal/tui/content` unit test asserts the new events are
            rendered as placeholder blocks without crashing and without
            leaking child transcript content.
        handoff: >-
          Scheduler, events, and TUI placeholders are in place. Stage-3 can
          register the model-facing tool and drive a full end-to-end
          delegation through the existing primitives.
        verification:
          - gofmt -w <changed Go files>
          - go vet ./internal/provider/... ./internal/output/... ./internal/tui/... ./internal/delegation/...
          - go test ./internal/provider/... ./internal/output/... ./internal/tui/... ./internal/delegation/...
          - go build ./...

  - id: stage-3
    objective: >-
      Expose `delegate` as a model-facing tool on the parent agent, add the
      oversized-output summarisation path inside the child, and prove the
      whole lifecycle end to end with an integration test driven via the
      existing Go-level entry. Close out Stage 8 with full verification.
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: >-
          Register a `delegate` tool on the parent's tool registry with the
          schema in `overview.md` (`task` required; optional `context`,
          `system_prompt`, `model`, `max_turns`, `timeout`). The handler
          calls `delegation.SpawnDelegate` and returns the structured result
          as the tool result. Implement the oversized-output path inside the
          child: when the child's terminal output exceeds
          `output_limit_tokens`, run one additional summarisation turn in
          the child before returning, rather than truncating. Add an
          integration test (inside `internal/delegation` or a neighbour
          package as appropriate) that drives a child run end to end via
          the Go entry point, using an in-memory fake provider, and
          asserts: (a) result envelope fields are populated, (b)
          `DelegationStarted`/`DelegationComplete` events reach
          `internal/output`, (c) the child's tool registry has no
          `delegate`, and attempting it yields a clean tool error, (d)
          oversized-output triggers one summarisation turn and the returned
          output respects the limit. Run full verification before handoff.
        scope: >-
          `internal/tool` parent registry wiring, `internal/delegation` tool
          handler and summarisation path, integration test harness, full
          Stage-8 verification.
        files:
          - internal/tool/registry.go
          - internal/tool/*.go
          - internal/delegation/tool.go
          - internal/delegation/result.go
          - internal/delegation/integration_test.go
          - internal/delegation/task.go
        constraints:
          - The `delegate` tool handler must not leak child transcript into
            the parent tool result. Only the structured `DelegationResult`
            fields defined in stage-1 are returned.
          - Tool-arg limits may tighten config defaults but must never
            loosen them. Enforce at schema validation time.
          - Nested delegation returns a clean tool error to the child; it
            must not kill the child session.
          - Summarisation turn must itself be bounded by the same
            `output_limit_tokens`; if the summary still exceeds, log a
            warning event and truncate the summary with a clear note. This
            is the only path where truncation is acceptable.
          - Do not introduce new external dependencies.
          - Integration test uses fakes for the provider and does not
            require real network access.
        depends_on: [stage-2-step-1]
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - `delegate` tool registered on the parent registry and callable
            via the normal tool-dispatch path.
          - Oversized-output summarisation path implemented and tested.
          - Integration test proving end-to-end child lifecycle via the Go
            entry.
          - Clean end-of-implementation verification (`go vet`, `go test
            ./...`, `make build-binaries`).
        acceptance:
          - `gofmt -l` reports no unformatted Go files among edited files.
          - `go vet ./...` is clean.
          - `go test ./...` passes.
          - `make build-binaries` succeeds; both `bin/steiner` and
            `bin/steiner-core-tools` build.
          - Integration test asserts: structured result returned to parent;
            events flow through `internal/output`; child tool registry
            excludes `delegate`; nested delegation attempt returns a tool
            error to the child; oversized output triggers summarisation
            turn.
          - Stage 8 exit criteria met: parent model can call `delegate`
            and receive structured child result; scheduler gates all LLM
            calls; delegation events flow through the event interface and
            land in TUI content pane.
        handoff: >-
          Stage 8 delegation scaffolding is complete and green. Reviewer can
          pick up from here with confidence that contract, wiring, and
          end-to-end path are all verified.
        verification:
          - gofmt -w <changed Go files>
          - go vet ./...
          - go test ./...
          - make build-binaries
