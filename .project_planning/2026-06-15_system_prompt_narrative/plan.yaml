steps:
  - id: step-1
    title: Section-based architecture in system.go
    scope: |
      Replace the monolithic string concatenation in SystemPreamble() with a section-based
      architecture. Define sectionID type, named constants for each section, a default ordering
      slice, and a section registry (map from sectionID to content-producing function). The
      assembly iterates the ordered slice, skips absent sections (e.g. delegation when disabled),
      and joins with "\n\n". Style tail (caveman, humanizer, suffix) appends after the ordered
      sections, outside the ordering system.

      Split the current defaultSystemPreamble constant into separate section constants:
      - identity: single sentence (existing `identity` const, unchanged text)
      - delegation: existing `delegationInstructions` const (unchanged text)
      - coreRules: extracted from defaultSystemPreamble — behavioral guardrails only, with
        delegation-specific lines removed ("delegate to explore" etc)
      - workflow: extracted from defaultSystemPreamble — "Before editing", "While editing",
        "Verification", "When skills are enabled", "Final response" subsections

      Promote four rules from the code agent prompt into the appropriate sections:
      - "Read the relevant files and nearby tests before making changes" → workflow (Before editing)
      - "Do not report completion with failing task-related checks" → workflow (Verification)
      - "Quote exact errors on failure" → workflow (Verification)
      - "List files modified with a one-line summary per file" → workflow (Final response)

      The SystemPreamble function signature stays unchanged. Internal implementation changes only.
    files:
      - internal/prompt/system.go
    constraints:
      - Do not change the SystemPreamble function signature
      - Do not change the text of existing instructions (restructure only, plus promotions)
      - Move delegation-aware lines from core rules into delegation section
      - Ensure output with delegation enabled matches the new ordering (identity → delegation → core rules → workflow → tail)
      - Ensure output with delegation disabled produces (identity → core rules → workflow → tail)
      - The defaultSectionOrder slice must be a package-level var, trivially editable
    acceptance:
      - SystemPreamble produces a coherent prompt with sections separated by "\n\n"
      - Section ordering matches Option B when delegation enabled
      - Section ordering collapses cleanly when delegation disabled
      - Style tail (caveman, humanizer, suffix) always appears after all ordered sections
      - No duplicate identity statements
      - Core rules contain no delegation-specific references
      - Four promoted rules appear in workflow section
    verification:
      - go build ./internal/prompt/
      - gofmt -w internal/prompt/system.go
      - goimports -w internal/prompt/system.go

  - id: step-2
    title: Update system prompt tests
    scope: |
      Rewrite tests in system_test.go and caveman_test.go to match the new section-based output.
      Tests should verify:
      - Section ordering (delegation before core rules before workflow when enabled)
      - Delegation absence when disabled (no delegation content, core rules + workflow present)
      - Caveman/humanizer appended after all sections
      - System suffix is always last
      - No duplicate identity statements across the full output
      - Promoted rules present in output
      - Delegation-specific lines absent from core rules section
      - Override still replaces the base sections (existing override behavior)

      Update humanizer_test.go if any assertions depend on position relative to sections
      that have moved.
    files:
      - internal/prompt/system_test.go
      - internal/prompt/caveman_test.go
      - internal/prompt/humanizer_test.go
    constraints:
      - Keep tests table-driven where appropriate
      - Test the public API (SystemPreamble), not internal section functions
      - Preserve existing test coverage for caveman/humanizer/suffix behavior
    acceptance:
      - All tests in internal/prompt/ pass
      - Coverage for section ordering, delegation presence/absence, style tail positioning
      - No test depends on exact substring position that would break from reordering the slice
    verification:
      - go test ./internal/prompt/ -v -run TestSystemPreamble
      - go test ./internal/prompt/ -v -run TestBuildConversation
    depends_on:
      - step-1

  - id: step-3
    title: DRY code and delegate sub-agent prompts
    scope: |
      Modify delegation to make code and delegate sub-agents use the shared system preamble
      instead of self-contained override prompts.

      In agent_type.go:
      - Remove the AgentTypeCode entry from agentPrompts (or set it to empty string)
      - The code agent should get no system prompt override, causing SystemPreamble to use
        the default base sections

      In bootstrap.go / buildChildPrompt:
      - When spec.SystemPrompt is empty (code agent, delegate with no custom prompt), do NOT
        set PromptOverrides.System — let SystemPreamble produce the shared base
      - When spec.SystemPrompt is non-empty (explore, research, plan, verify, or delegate
        with custom prompt), continue using it as PromptOverrides.System override
      - DelegationEnabled is already false for children, so delegation section is naturally
        excluded — no change needed there

      In defaultChildSystemPrompt:
      - Remove or leave as empty string — generic delegate without a custom system prompt
        gets the shared base

      The identity line "You are steiner, a lean coding agent." applies to sub-agents too —
      no addendum, no role qualifier. The parent's task message provides role context.
    files:
      - internal/delegation/agent_type.go
      - internal/delegation/bootstrap.go
    constraints:
      - Do not change explore, research, plan, verify prompts
      - Do not change the BuildChildRun or buildChildPrompt signatures unless necessary
      - Sub-agents must still receive CavemanMode/HumanizerMode flags
      - Sub-agents must still receive project context (AGENTS.md, extra files)
      - Sub-agents must NOT receive delegation instructions (DelegationEnabled stays false)
    acceptance:
      - code sub-agent gets identity → core rules → workflow → style tail (no delegation)
      - delegate sub-agent (no custom prompt) gets the same shared base
      - delegate sub-agent (with custom prompt) still uses the custom prompt as override
      - explore/research/plan/verify sub-agents unchanged
      - No duplicate identity statements in any sub-agent prompt
    verification:
      - go build ./internal/delegation/
      - go test ./internal/delegation/ -v -run TestBuildChild
      - go test ./internal/delegation/ -v -run TestSpecialized

  - id: step-4
    title: Update delegation tests
    scope: |
      Update tests in bootstrap_test.go, specialized_tools_test.go, and agent_type_test.go
      to reflect the DRY changes. Tests that assert on the code agent having its own system
      prompt need updating. Tests that verify explore/research/plan/verify prompts should
      remain unchanged.

      Key assertions to add or update:
      - code agent's assembled prompt contains shared identity, core rules, workflow
      - code agent's assembled prompt does NOT contain delegation instructions
      - delegate (no custom prompt) gets shared base
      - delegate (with custom prompt) still uses override
      - Integration tests that spawn child agents work with the new prompt structure
    files:
      - internal/delegation/bootstrap_test.go
      - internal/delegation/agent_type_test.go
      - internal/delegation/specialized_tools_test.go
    constraints:
      - Do not weaken existing test coverage
      - Keep integration test structure intact
    acceptance:
      - All tests in internal/delegation/ pass
      - Coverage for code agent DRY behavior
      - Coverage for delegate fallback behavior
    verification:
      - go test ./internal/delegation/ -v
    depends_on:
      - step-3

  - id: step-5
    title: Verify agent loop integration and broad checks
    scope: |
      Verify that the agent loop in internal/agent/ correctly wires CachedSystemPreamble
      with the new section-based output. The cached preamble mechanism should work unchanged
      since SystemPreamble's signature hasn't changed, but verify no assumptions broke.

      Run the full test suite and make check to catch any cross-package regressions.
      Fix any compilation errors, test failures, or lint issues introduced by the changes.
    files:
      - internal/agent/context_manager_base.go
      - internal/agent/context_manager_base_test.go
      - internal/agent/compaction.go
    constraints:
      - Do not change agent loop wiring unless broken by the restructure
      - Do not change compaction prompt text
    acceptance:
      - CachedSystemPreamble produces valid output with new section-based SystemPreamble
      - All tests pass across the full codebase
      - make check passes
      - No lint warnings introduced
    verification:
      - go test ./internal/agent/ -v -run TestBaseContextManager
      - go test ./...
      - go vet ./...
      - golangci-lint run ./...
      - make check
    depends_on:
      - step-2
      - step-4
