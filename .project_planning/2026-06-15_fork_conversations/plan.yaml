steps:
  - id: step-1
    title: "Add Fork helper to session package"
    scope: |
      Add a Fork function to internal/session that takes a Session and returns
      a new Session with a fresh ID, cloned lineage, same model, and title
      set to "Fork of: <original title>". Add comprehensive tests.
    files:
      - internal/session/session.go
      - internal/session/session_test.go
    constraints:
      - Deep copy the lineage (use existing ConversationLineage.Clone)
      - New ID via existing generateID
      - Title truncated to 80 chars via TitleFromPrompt
      - CreatedAt/UpdatedAt set to now
      - Do not modify Store; this is a pure Session constructor
    acceptance:
      - Fork returns a new Session with different ID, same model, cloned lineage
      - Title follows "Fork of: <original>" pattern
      - Lineage mutations on fork do not affect original
      - Tests cover: basic fork, title truncation, lineage independence
    verification:
      - gofmt -w internal/session/session.go
      - goimports -w internal/session/session.go
      - go test ./internal/session/...
      - go vet ./internal/session/...

  - id: step-2
    title: "Add ForkSession actions to interactive package"
    scope: |
      Add ForkSession (fork current live session) and ForkSavedSession (fork
      from session picker by ID) action types. Wire both into handleStateAction.
      ForkSession: save current session, fork it, switch to fork.
      ForkSavedSession: load saved session, fork it, switch to fork.
      Emit status event confirming fork origin.
    files:
      - internal/interactive/actions.go
      - internal/interactive/session.go
      - internal/interactive/session_test.go
    constraints:
      - Follow existing action patterns (LoadSession, RotateSession, ClearConversation)
      - Save original session before forking (no context loss)
      - Use session.Fork for the clone
      - Preserve model from source session
      - Emit context report event with fork confirmation message
    acceptance:
      - ForkSession creates new session from current conversation + model, switches to it
      - ForkSavedSession loads a saved session by ID, forks it, switches to fork
      - Original session is saved before fork
      - Status event emitted with "Forked from: <title>"
      - Tests cover both actions, error paths, and state after fork
    verification:
      - gofmt -w internal/interactive/actions.go internal/interactive/session.go
      - goimports -w internal/interactive/actions.go internal/interactive/session.go
      - go test ./internal/interactive/...
      - go vet ./internal/interactive/...
    depends_on:
      - step-1

  - id: step-3
    title: "Wire /fork command and session picker fork in TUI"
    scope: |
      Add /fork to the slash command list in model_input.go.
      Handle /fork in the command dispatch to emit ForkSession action.
      Add fork keybinding (f) in session picker overlay to emit
      ForkSavedSession with the highlighted session's ID.
      Update session picker entry rendering to prefix each entry with
      datetime in "[ YYYY-MM-DD HH:MM:SS ]" format using UpdatedAt.
      Update help.go with /fork entry.
    files:
      - internal/tui/model_input.go
      - internal/tui/model_update_keys.go
      - internal/tui/help.go
    constraints:
      - Follow existing slash command patterns (/clear, /resume)
      - Session picker fork key should not conflict with existing bindings
      - /fork while no conversation exists should show informative message
      - Help text consistent with existing entries
      - Session picker datetime uses UpdatedAt, formatted as "[ 2026-06-15 14:30:00 ]"
      - Use local time, not UTC, for the datetime display
    acceptance:
      - /fork appears in slash command autocomplete
      - /fork triggers ForkSession action on current session
      - f key in session picker triggers ForkSavedSession for highlighted entry
      - /fork with empty conversation shows appropriate message
      - Help screen shows /fork entry
      - Session picker entries prefixed with "[ YYYY-MM-DD HH:MM:SS ] " before title
    verification:
      - gofmt -w internal/tui/model_input.go internal/tui/model_update_keys.go internal/tui/help.go
      - goimports -w internal/tui/model_input.go internal/tui/model_update_keys.go internal/tui/help.go
      - go test ./internal/tui/...
      - go vet ./internal/tui/...
    depends_on:
      - step-2

  - id: step-4
    title: "Update documentation"
    scope: |
      Update README.md with /fork feature description following existing
      feature section patterns. Mention both /fork command and session picker
      fork capability.
    files:
      - README.md
    constraints:
      - Follow existing feature documentation pattern in README
      - Keep description concise
      - Mention both fork sources (live session and session picker)
    acceptance:
      - README documents /fork command
      - README mentions session picker fork capability
    verification:
      - go build ./...
      - make check
    depends_on:
      - step-3
