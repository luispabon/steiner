stages:
  - id: stage-1
    objective: Restore interactive cancellation and approval behavior during active streaming
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: Fix streaming-time key handling so ESC and Ctrl+C cancel the active run and tool approvals remain usable while streaming
        scope: Own the interactive TUI and runtime wiring needed to propagate interruption beyond local UI state, relax the streaming input gate only for approval interaction, and add regression coverage for T025 to T027
        files:
          - cmd/steiner/interactive.go
          - internal/tui/app.go
          - internal/tui/model.go
          - internal/tui/model_update.go
          - internal/tui/model_input.go
          - internal/tui/model_events.go
          - internal/tui/model_test.go
          - cmd/steiner/*_test.go
        constraints:
          - Keep package boundaries intact; runtime cancellation orchestration belongs in cmd/steiner and UI state handling belongs in internal/tui
          - Do not re-enable arbitrary prompt submission during an active run; only interruption and approval interaction should bypass the streaming input block
          - Ensure ESC and Ctrl+C stop the actual active conversation, not just local streaming indicators
          - Preserve existing approval semantics and output event flow
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Interactive mode can interrupt an in-flight run from the TUI
          - Approval requests can be answered while assistant streaming is active
          - Regression tests cover T025, T026, and T027 acceptance criteria at the model layer and, where needed, the interactive runtime boundary
        acceptance:
          - Pressing ESC during streaming cancels the active run and returns the UI to a clean prompt state
          - Pressing Ctrl+C during an active conversation cancels it instead of being swallowed by the streaming gate
          - Tool approval input remains possible during streaming and approve or deny decisions reach the approval responder
          - Existing non-approval prompt input remains blocked during active streaming unless deliberately allowed by the implementation
        handoff: Update the interactive cancellation path by adding explicit TUI-to-runtime interrupt plumbing and narrowing the streaming gate so only approval interaction and cancellation controls pass through.
        verification:
          - gofmt -w cmd/steiner/interactive.go internal/tui/app.go internal/tui/model.go internal/tui/model_update.go internal/tui/model_input.go internal/tui/model_events.go internal/tui/model_test.go
          - go test ./internal/tui -run 'TestModel.*(Approval|Esc|CtrlC|Streaming)'
          - go test ./cmd/steiner -run 'Test.*(Interactive|Cancel|Approval)'

  - id: stage-2
    objective: Restore multiline prompt entry behavior for Shift+Enter
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: Fix Shift+Enter newline insertion in the interactive prompt and add focused regression coverage for T028
        scope: Own the prompt textarea key-routing and related tests needed to make Shift+Enter reliably insert a newline without breaking ordinary Enter submit behavior
        files:
          - internal/tui/input.go
          - internal/tui/model_update.go
          - internal/tui/model_input.go
          - internal/tui/model_test.go
          - internal/tui/input_test.go
        constraints:
          - Preserve plain Enter as the submit action for normal prompts and approvals
          - Keep the fix local to interactive input handling unless code inspection proves the defect lives in shared textarea configuration
          - Avoid changing unrelated prompt layout or wrapping behavior while addressing T028
        depends_on:
          - stage-1-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Shift+Enter inserts a newline in the prompt textarea
          - Focused tests protect newline insertion and non-regression of normal Enter submission
        acceptance:
          - Shift+Enter inserts a newline in the input prompt
          - Regular Enter still submits the prompt when appropriate
          - Approval mode Enter behavior remains intact
        handoff: Trace why the textarea key binding for Shift+Enter is not taking effect, fix the minimal routing/configuration issue, and prove the result with focused TUI tests.
        verification:
          - gofmt -w internal/tui/input.go internal/tui/model_update.go internal/tui/model_input.go internal/tui/model_test.go internal/tui/input_test.go
          - go test ./internal/tui -run 'Test.*(Shift|Enter|Input|Approval)'
