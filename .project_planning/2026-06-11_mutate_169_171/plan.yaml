steps:
  - id: step-1
    title: Fix atomic batch result metadata and codify batch semantics
    scope: >-
      Make failed atomic mutate batches report committed state truthfully, align
      result bookkeeping with actual commit outcomes, and document the real
      execution model: content matching applies sequentially against in-memory
      state while file_hash validation uses the initial on-disk snapshot.
    files:
      - internal/tool/builtin/mutate.go
      - internal/tool/builtin/result.go
      - internal/tool/builtin/schema.go
      - internal/tool/builtin/mutate_test.go
      - README.md
    constraints:
      - Keep atomic rollback behavior unchanged on disk.
      - Result metadata must describe committed outcomes, not provisional planning state.
      - Preserve existing file_hash snapshot validation unless later steps intentionally extend it.
      - Keep package boundaries intact within internal/tool/builtin.
    acceptance:
      - Failed batches leave disk unchanged and report no created/modified/deleted/moved outputs as committed.
      - OperationsApplied reflects only successfully committed operations.
      - Schema and README text explicitly describe sequential in-memory matching plus initial-snapshot file_hash validation.
      - Regression tests cover the misleading metadata case from issue #171.
    verification:
      - go test ./internal/tool/builtin -run 'TestMutate.*|Test.*Mutate.*'
      - go test ./...

  - id: step-2
    title: Introduce standalone delete_line and define line-deletion boundaries
    scope: >-
      Add a first-class mutate operation type delete_line for text files, define
      how it targets and deletes one or more full lines, and resolve the overlap
      with existing line_replace deletion behavior so the model-facing API is
      explicit rather than implicit.
    files:
      - internal/tool/builtin/input.go
      - internal/tool/builtin/schema.go
      - internal/tool/builtin/mutate.go
      - internal/tool/builtin/mutate_test.go
      - README.md
      - docs/SUBAGENT_DELEGATION.md
    constraints:
      - delete_line must remain text-oriented and must not blur with whole-file delete.
      - Reuse existing line-editing internals where practical rather than forking separate deletion machinery.
      - Define exact validation rules for permitted fields and failure modes.
      - Preserve backward compatibility for existing line_replace callers unless an explicit deprecation path is added.
    acceptance:
      - Mutate schema exposes a standalone delete_line operation with documented valid fields.
      - delete_line can delete one or more exact target lines with deterministic behavior and clear validation errors.
      - Whole-file delete remains separate and unambiguous.
      - Tests cover single-line deletion, multi-line deletion if supported, text/binary rejection, and invalid field combinations.
      - Built-in tool docs are updated for the new operation.
    verification:
      - go test ./internal/tool/builtin -run 'TestMutate.*|Test.*DeleteLine.*'
      - go test ./...

  - id: step-3
    title: Improve mutate observability and post-condition verification
    scope: >-
      Extend mutate results and request handling so callers can verify edit
      correctness without follow-up reads, including match counts, bounded
      post-edit confirmation context, and post-condition assertions such as
      assert_absent and assert_present with rollback on failure.
    files:
      - internal/tool/builtin/input.go
      - internal/tool/builtin/result.go
      - internal/tool/builtin/schema.go
      - internal/tool/builtin/mutate.go
      - internal/tool/builtin/mutate_test.go
      - README.md
    constraints:
      - Keep output bounded and summarized per repo tool invariants.
      - Assertion failures must preserve atomicity and roll back filesystem changes.
      - Result additions should be structured JSON fields, not only prose in output.
      - New fields must remain comprehensible to model callers.
    acceptance:
      - Replace-like operations report match counts or equivalent scoped confirmation data.
      - Mutate returns bounded post-edit context sufficient for quick visual validation.
      - assert_absent and assert_present are supported and cause rollback on failure.
      - Tests cover assertion pass/fail, rollback on assertion failure, and output bounding.
    verification:
      - go test ./internal/tool/builtin -run 'TestMutate.*|Test.*Assert.*|Test.*Context.*'
      - go test ./...

  - id: step-4
    title: Tighten edge-case semantics for file_hash, move overwrite, and append behavior
    scope: >-
      Resolve the remaining semantics gaps from issues #169 and #171 around
      file_hash on non-existent targets, move collisions, and insert_after at
      end-of-file, choosing explicit API behavior and documenting it.
    files:
      - internal/tool/builtin/input.go
      - internal/tool/builtin/schema.go
      - internal/tool/builtin/mutate.go
      - internal/tool/builtin/mutate_test.go
      - README.md
    constraints:
      - Prefer explicit behavior over silent acceptance for ambiguous edge cases.
      - Preserve safe defaults when adding overwrite-like behavior.
      - Avoid introducing overlapping ways to express the same operation without clear documentation.
    acceptance:
      - file_hash behavior for non-existent targets is defined and enforced consistently.
      - move destination collision behavior is explicit and covered by schema/docs/tests.
      - insert_after append-edge behavior is either supported or rejected with a clear documented rule and diagnostic.
      - Regression tests cover the chosen semantics for all three cases.
    verification:
      - go test ./internal/tool/builtin -run 'TestMutate.*|Test.*FileHash.*|Test.*Move.*|Test.*Insert.*'
      - go test ./...

  - id: step-5
    title: Finish repo-required verification and documentation alignment
    scope: >-
      Run the repository's required formatting and verification commands for the
      mutate changeset, update any remaining built-in tool documentation, and
      ensure the implementation lands with complete nearby tests and repo-level
      checks.
    files:
      - internal/tool/builtin/mutate.go
      - internal/tool/builtin/mutate_test.go
      - internal/tool/builtin/schema.go
      - internal/tool/builtin/result.go
      - internal/tool/builtin/input.go
      - README.md
      - docs/SUBAGENT_DELEGATION.md
    constraints:
      - Run gofmt and goimports on touched Go files.
      - Prefer targeted verification before full-repo checks, but do not skip make check before closeout.
      - Report any tooling gaps or failures exactly if the environment cannot run a required check.
    acceptance:
      - All touched Go files are formatted.
      - Required mutate docs are aligned with shipped behavior.
      - Targeted tests pass before broad checks.
      - make check is run and its outcome is recorded for closeout.
    verification:
      - gofmt -w <touched files>
      - goimports -w <touched files>
      - go test ./internal/tool/builtin
      - make check
