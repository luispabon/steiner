stages:
  - id: stage-1
    objective: Foundation — context manager interface, config, CLI flag, naive implementation
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: Define the context manager interface and wire naive/smart mode selection through config, CLI, and the agent loop
        scope: |
          Create the ContextManager interface with two hook points (PostIngestion, PreAssembly) and a Compactor sub-interface.
          Add context_mode (naive|smart) and compaction strategy config to internal/config.
          Add --context-mode CLI flag to cmd/steiner/.
          Implement NaiveContextManager as a pass-through.
          Wire the context manager into Runner.Run and turnProgressor so it is called at the right points.
          Create the SmartContextManager struct skeleton (methods return input unchanged for now).
        files:
          - internal/agent/context_manager.go
          - internal/agent/context_manager_test.go
          - internal/agent/runner.go
          - internal/agent/turn_progression.go
          - internal/config/config.go
          - internal/config/validate.go
          - cmd/steiner/*.go
        constraints:
          - Do not modify existing compaction behavior — naive mode must remain identical to current behavior
          - The ContextManager interface must be small — two methods for the pipeline hooks, one for compaction
          - Config must support all three compaction strategies (drop, summarize, hybrid) even though only naive is wired now
          - Do not add new packages — context_manager.go lives in internal/agent
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - internal/agent/context_manager.go with ContextManager interface, NaiveContextManager, SmartContextManager skeleton
          - Updated config structs with context_mode and compaction settings
          - CLI flag parsing and propagation to RunRequest
          - Tests for config validation, naive pass-through behavior
        acceptance:
          - steiner --context-mode naive runs identically to current behavior
          - steiner --context-mode smart starts without error (smart manager is skeleton)
          - Config with invalid context_mode or compaction strategy is rejected at validation
          - go test ./internal/agent/... passes
          - go test ./internal/config/... passes
          - go build ./... succeeds
        handoff: |
          Foundation stage: created ContextManager interface with PostIngestion/PreAssembly hooks and Compactor sub-interface.
          NaiveContextManager is pass-through. SmartContextManager is skeleton.
          Config supports context_mode (naive|smart) and compaction.strategy (drop|summarize|hybrid).
          CLI flag --context-mode wired through to RunRequest.
          Next stages plug implementations into the SmartContextManager methods.
        verification:
          - go test ./internal/agent/... -run TestContextManager
          - go test ./internal/config/... -run TestContextMode
          - go build ./...

  - id: stage-2
    objective: Ingestion pipeline — tool output truncation and noise stripping
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: Implement per-tool-type truncation strategies and a noise stripping pipeline that runs at tool result ingestion time
        scope: |
          Extend internal/tool/output_shaping.go with:
          - TruncationStrategy interface with Head, Tail, and CountCap implementations
          - Strategy selection per tool type: tail-priority for bash (errors at bottom), count-cap for grep/search, head for file reads
          - Configurable byte limits per tool type with sensible defaults
          - Truncation marker in output so model knows content was removed

          Add noise stripping pipeline:
          - ANSI escape code removal: use github.com/acarl005/stripansi (13-line battle-tested regex, handles CSI/OSC/8-bit). Add to go.mod.
          - Collapse duplicate consecutive blank lines to single (~4 lines inline)
          - Collapse repeated identical warning/info lines to count summary (~15 lines inline, keep first occurrence + "[repeated N times]")
          - Strip progress bar / spinner patterns via carriage return removal (~5 lines inline, strip \r-based overwrites)

          Wire into SmartContextManager.PostIngestion — this is where tool results get processed before storage.
          NaiveContextManager.PostIngestion remains pass-through.
        files:
          - internal/tool/output_shaping.go
          - internal/tool/output_shaping_test.go
          - internal/tool/noise_strip.go
          - internal/tool/noise_strip_test.go
          - internal/agent/context_manager.go
        constraints:
          - Truncation is destructive — applied once at ingestion, result stored truncated
          - Must not break existing boundedCapture for bash — extend, don't replace
          - Truncation marker must be clear and parseable (e.g., "[output truncated: 4521 of 12830 bytes shown, use offset/limit to see more]")
          - Noise stripping runs after truncation (strip noise from what survives)
          - File read output is NOT truncated here — file reads are managed at assembly time
        depends_on:
          - stage-1-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - TruncationStrategy interface with Head, Tail, CountCap implementations
          - NoiseStripper pipeline with ANSI, blank, duplicate, progress bar strippers
          - SmartContextManager.PostIngestion applies truncation + noise stripping
          - Tests covering each truncation strategy, each noise pattern, and the combined pipeline
        acceptance:
          - Bash output truncated from tail with marker
          - Grep output count-capped with marker
          - ANSI codes stripped from all tool output in smart mode
          - Duplicate blank lines collapsed
          - Repeated identical lines collapsed to count
          - Naive mode output unchanged
          - go test ./internal/tool/... passes
        handoff: |
          Ingestion pipeline complete. Tool outputs are now truncated per-type and noise-stripped in smart mode.
          PostIngestion hook processes results before they enter conversation history.
          Next: assembly-time masking and file read management.
        verification:
          - go test ./internal/tool/... -run TestTruncation
          - go test ./internal/tool/... -run TestNoiseStrip
          - go test ./internal/agent/... -run TestPostIngestion

  - id: stage-3
    objective: Assembly masking — observation masking, assistant prose masking, file read tracking and annotation
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: Implement observation masking and assistant prose masking in the prompt assembly pipeline
        scope: |
          Add a masking phase to the prompt assembly pipeline that runs in SmartContextManager.PreAssembly:
          - Rolling window observation masking: tool result bodies older than M turns replaced with placeholder
          - Tool call metadata (name, arguments summary) preserved in placeholder
          - Tool call and result are never separated — both masked or both kept
          - Assistant prose older than M turns trimmed to first line or dropped entirely
          - M is configurable via config, default 5
          - Masking operates on a copy of conversation messages — stored history unchanged

          The masking phase takes []Message + current turn number and returns []Message with masked content.
          This is a pure function — no side effects on stored history.
        files:
          - internal/prompt/masking.go
          - internal/prompt/masking_test.go
          - internal/agent/context_manager.go
        constraints:
          - Non-destructive — stored conversation history is never modified by masking
          - Tool call + tool result messages are atomic — never separate them
          - Multi-tool turns (assistant message with multiple tool calls + multiple tool results) must be handled correctly
          - Placeholder must include tool name and a truncated argument summary so model knows what was run
          - Masking must handle edge cases: conversation shorter than M, turns with no tool calls, consecutive assistant messages
        depends_on:
          - stage-1-step-1
        parallel_group: stage-3-parallel
        can_run_in_parallel: true
        suggested_model: cheap-good
        outputs:
          - internal/prompt/masking.go with MaskConversation function
          - Comprehensive tests for rolling window, multi-tool turns, edge cases
          - SmartContextManager.PreAssembly calls MaskConversation
        acceptance:
          - Tool results older than M turns are replaced with placeholder containing tool name
          - Tool results within M turns are unchanged
          - Tool call + result pairs are never separated
          - Assistant prose older than M turns is trimmed
          - Stored history is not modified
          - go test ./internal/prompt/... -run TestMask passes
        handoff: |
          Observation masking and assistant prose masking implemented.
          MaskConversation is a pure function called from SmartContextManager.PreAssembly.
          Rolling window with configurable M, default 5.
          Next step adds file read tracking and annotation on top of this.
        verification:
          - go test ./internal/prompt/... -run TestMask
          - go test ./internal/agent/... -run TestPreAssembly

      - id: stage-3-step-2
        objective: Implement file read metadata tracking and unchanged-file annotation
        scope: |
          Add file read tracking to the context manager:
          - FileTracker struct in internal/agent tracking: path, last read turn, byte range (offset+limit), mtime at read time
          - Updated on every file read tool result (detected by tool name "read")
          - Filesystem stat check for modification detection
          - Persists across compaction (lives in Go, not in conversation)

          Add file read annotation:
          - When model requests a file already tracked and unmodified since last read, SmartContextManager.PostIngestion replaces tool result with annotation: "[file unchanged since turn N, X lines — re-read with force=true if needed]"
          - Annotation includes enough metadata for model to decide whether to re-read
          - External modifications (mtime changed) invalidate tracking and serve full content
          - Configurable: can disable annotation and always serve full content

          Wire FileTracker into SmartContextManager so it updates on reads and checks before serving.
        files:
          - internal/agent/file_tracker.go
          - internal/agent/file_tracker_test.go
          - internal/agent/context_manager.go
        constraints:
          - FileTracker lives in Go memory, not in conversation messages
          - Must survive compaction — it is part of the context manager state, not conversation state
          - Use os.Stat for mtime checks — no git dependency for basic tracking
          - Do not track files that were written/edited by the model — only reads
          - Annotation must be clear enough that the model can request a re-read if needed
        depends_on:
          - stage-1-step-1
        parallel_group: stage-3-parallel
        can_run_in_parallel: true
        suggested_model: cheap-good
        outputs:
          - internal/agent/file_tracker.go with FileTracker struct and methods
          - Integration with SmartContextManager.PostIngestion for annotation
          - Tests for tracking, mtime invalidation, annotation generation, compaction survival
        acceptance:
          - File read tracked with path, turn, mtime
          - Unchanged re-read produces annotation instead of full content
          - Modified file (mtime changed) serves full content and updates tracking
          - FileTracker state survives compaction
          - go test ./internal/agent/... -run TestFileTracker passes
        handoff: |
          File read tracking and annotation complete.
          FileTracker tracks reads, detects unchanged re-reads, serves annotations.
          Survives compaction. Mtime-based invalidation for external edits.
          Next: scratchpad system.
        verification:
          - go test ./internal/agent/... -run TestFileTracker

  - id: stage-4
    objective: Scratchpad — scaffold state extension and model-written scratchpad with prompt injection
    parallel: false
    steps:
      - id: stage-4-step-1
        objective: Extend scaffold state, implement model scratchpad parsing, and add scratchpad injection to prompt assembly
        scope: |
          Extend ContextState in internal/agent/context_state.go:
          - Add FileTrackerSummary field (populated from FileTracker — list of tracked files with status)
          - Add TurnCount, CompactionCount fields
          - Add RecentToolCalls field (last N tool calls with name + truncated args, for orientation)
          - Render method that produces a compact text block for prompt injection (~200 tokens)

          Implement model scratchpad in internal/agent/scratchpad.go:
          - Scratchpad struct with flat string fields: Goal, Plan, Step, Next, Open
          - ParseScratchpad function: extract <scratchpad>...</scratchpad> from model response text, lenient parsing
          - If field missing, keep previous value. If block missing entirely, carry forward previous scratchpad.
          - ConsecutiveFailures counter. Log warning at 3+.
          - RenderScratchpad: produce the tagged-text block for prompt injection
          - Target budget: ~200-400 tokens for model scratchpad

          Add scratchpad injection to prompt assembly:
          - New ContextBlock source type for scaffold state and scratchpad
          - Injected after system preamble, before project context
          - SmartContextManager owns the scratchpad lifecycle: parse from response, store, inject on next turn

          Add system prompt instructions for scratchpad:
          - Short instruction block telling model to include <scratchpad> in every response
          - Include example of filled scratchpad
          - Instruction to keep fields short (one line each)
        files:
          - internal/agent/context_state.go
          - internal/agent/context_state_test.go
          - internal/agent/scratchpad.go
          - internal/agent/scratchpad_test.go
          - internal/prompt/assembler.go
          - internal/prompt/system.go
          - internal/agent/context_manager.go
        constraints:
          - Scaffold state render must stay under ~200 tokens
          - Model scratchpad parsing must be lenient — extract what's present, ignore what's missing
          - Scratchpad fields are flat strings only, no nesting, no arrays
          - System prompt scratchpad instructions must be concise — every token is fixed overhead
          - Scratchpad injection position is fixed: after system preamble, before project context
          - Do not modify scratchpad content — store exactly what model produces (after parsing)
          - Thinking block content must be excluded when parsing scratchpad (extract from visible output only)
        depends_on:
          - stage-3-step-2
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Extended ContextState with file summary, turn count, compaction count, recent tool calls
          - Scratchpad struct with parse/render, lenient parsing, carry-forward on failure
          - Prompt injection of scaffold state + scratchpad at fixed position
          - System prompt additions for scratchpad instructions
          - Comprehensive tests for parsing edge cases, carry-forward, staleness detection
        acceptance:
          - Scaffold state renders to compact text under 200 tokens
          - Model scratchpad parsed from <scratchpad> tags in response
          - Missing fields carry forward from previous scratchpad
          - Missing block entirely carries forward previous scratchpad
          - 3+ consecutive parse failures log warning
          - Scratchpad injected after system preamble in assembled prompt
          - Thinking block content excluded from scratchpad parsing
          - go test ./internal/agent/... -run TestScratchpad passes
          - go test ./internal/agent/... -run TestContextState passes
          - go test ./internal/prompt/... passes
        handoff: |
          Scratchpad system complete. Scaffold state extended with file summary, turn/compaction counts, recent tool calls.
          Model scratchpad parsed leniently from tagged text, carry-forward on failure.
          Both injected at fixed prompt position after system preamble.
          System prompt instructs model to produce scratchpad each turn.
          Next: compaction strategies.
        verification:
          - go test ./internal/agent/... -run TestScratchpad
          - go test ./internal/agent/... -run TestContextState
          - go test ./internal/prompt/... -run TestAssembl

  - id: stage-5
    objective: Compaction — Compactor interface with drop, summarize, and hybrid strategies
    parallel: false
    steps:
      - id: stage-5-step-1
        objective: Refactor compaction behind Compactor interface and implement three strategies (drop, summarize, hybrid)
        scope: |
          Define Compactor interface in internal/agent/context_manager.go:
          - Compact(ctx, conversation []Message, scratchpad Scratchpad, scaffoldState ContextState, config CompactionConfig) ([]Message, error)

          Implement three strategies:

          DropCompactor:
          - Preserve scratchpad + scaffold state (already injected at assembly, not in conversation)
          - Keep last N turns from conversation (configurable retain_turns, default 3)
          - Drop all older turns
          - Insert discontinuity marker message: "[context compacted — see scratchpad for task state, re-read files if needed]"
          - No model call. ~20 lines of logic.

          SummarizeCompactor:
          - Refactor existing compactConversationForBudget into this strategy
          - Add scratchpad preservation (include scratchpad in summary prompt so it's not lost)
          - Otherwise identical to current model-based compaction behavior
          - This is the existing code reorganized behind the interface

          HybridCompactor:
          - First applies observation masking to the conversation (reuse MaskConversation from stage-3)
          - Checks if masked conversation fits within threshold
          - If yes, return masked conversation (no model call needed)
          - If no, invoke SummarizeCompactor on the already-masked (smaller) input
          - Second threshold configurable (default: 80% after masking)

          Wire strategy selection from config into SmartContextManager.
          Update compaction trigger logic to use Compactor interface.
          Preserve existing escalation system (info → warning → critical).
        files:
          - internal/agent/compaction.go
          - internal/agent/compaction_test.go
          - internal/agent/context_manager.go
        constraints:
          - Never split a tool call from its result during compaction
          - Discontinuity marker must reference the scratchpad so model knows where to look
          - SummarizeCompactor must remain backward-compatible with current naive-mode compaction
          - Existing compaction tests must continue to pass (they test what is now SummarizeCompactor behavior)
          - HybridCompactor reuses MaskConversation — do not duplicate masking logic
          - Escalation thresholds (warning at 2, critical at 3) remain unchanged
        depends_on:
          - stage-4-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Compactor interface with three implementations
          - DropCompactor with turn retention and discontinuity marker
          - SummarizeCompactor refactored from existing code with scratchpad preservation
          - HybridCompactor combining masking + conditional summarization
          - Config-driven strategy selection
          - Tests for each strategy, edge cases, escalation
        acceptance:
          - DropCompactor keeps last N turns, drops rest, inserts marker
          - SummarizeCompactor produces same results as current compaction (backward compat)
          - HybridCompactor applies masking first, only summarizes if still over threshold
          - Tool call + result pairs never separated in any strategy
          - Escalation system works with all three strategies
          - Config selects strategy correctly
          - Existing compaction tests pass
          - go test ./internal/agent/... -run TestCompact passes
        handoff: |
          Compaction refactored behind Compactor interface. Three strategies available: drop, summarize, hybrid.
          Strategy selected via config. Escalation system preserved.
          All strategies preserve scratchpad and scaffold state.
          Next: observability and integration.
        verification:
          - go test ./internal/agent/... -run TestCompact
          - go test ./internal/agent/... -run TestCompaction

  - id: stage-6
    objective: Observability and end-to-end integration
    parallel: false
    steps:
      - id: stage-6-step-1
        objective: Add context management logging, debug mode, and verify end-to-end integration across all components
        scope: |
          Add observability events to output system:
          - ContextMaskingEvent: which turn, which tool call masked, reason
          - FileAnnotationEvent: file path, annotation vs full serve, reason (unchanged/modified)
          - CompactionEvent: strategy used, token count before/after, turns dropped, threshold
          - ScratchpadEvent: scratchpad content after each model response, parse success/failure
          - TokenBudgetEvent: per-category token counts each turn (system, scratchpad, project context, conversation)

          Add debug logging:
          - When log level is debug, emit the full assembled prompt with masking decisions annotated
          - Log why each piece of content was included or excluded
          - Log full unmasked conversation history alongside masked version

          Integration verification:
          - End-to-end test: multi-turn conversation in smart mode exercising ingestion → masking → scratchpad → compaction
          - Verify naive mode is completely unaffected by smart mode code paths
          - Verify config validation covers all new fields
          - Verify CLI help text documents --context-mode flag

          Wire all context management events through existing EventSink infrastructure.
        files:
          - internal/output/events.go
          - internal/output/event_render.go
          - internal/agent/context_manager.go
          - internal/agent/context_manager_test.go
          - internal/output/plain_render.go
        constraints:
          - Use existing EventSink and Event infrastructure — do not create a separate logging system
          - Debug-level logging must not affect performance in normal operation
          - Events must be structured (typed payloads) for machine-readable output mode
          - Do not log full file contents in events — log paths and sizes only
          - Token budget events should use the existing token estimator, not introduce a new one
        depends_on:
          - stage-5-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - New event types for masking, annotation, compaction, scratchpad, token budget
          - Event rendering in plain output mode
          - Debug-level logging of assembled prompt with masking annotations
          - End-to-end integration test
          - CLI help text update
        acceptance:
          - Context masking events emitted when tool results are masked
          - File annotation events emitted when unchanged re-reads are annotated
          - Compaction events include strategy, token counts, turns dropped
          - Scratchpad events show content and parse success/failure
          - Token budget events show per-category breakdown
          - Debug mode shows full assembled prompt with annotations
          - End-to-end test exercises full smart mode pipeline
          - Naive mode produces no context management events
          - go test ./... passes
          - go build ./... succeeds
          - go vet ./... clean
        handoff: |
          Observability complete. All context management decisions are logged through EventSink.
          Debug mode available for full prompt visibility.
          End-to-end integration verified.
          Feature is complete and ready for experimentation.
        verification:
          - go test ./...
          - go vet ./...
          - go build ./...
          - gofmt -d $(git ls-files '*.go')
