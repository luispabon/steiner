steps:
  - id: step-1
    title: Collapse context-mode config and CLI surface
    scope: Remove user-facing and config-facing context mode selection, smart-only config fields, and scratchpad-mode-driven tool exposure.
    files:
      - internal/config/config.go
      - internal/config/defaults.go
      - internal/config/load.go
      - internal/config/load_override.go
      - internal/config/patch.go
      - internal/config/patch_context.go
      - internal/config/validate.go
      - internal/config/validate_modes.go
      - internal/config/validate_runtime.go
      - internal/config/*_test.go
      - cmd/steiner/commands.go
      - cmd/steiner/runtime_build.go
      - cmd/steiner/runner_run.go
      - cmd/steiner/tools.go
      - cmd/steiner/*_test.go
    constraints:
      - Remove `--context-mode` and `CLIOverrides.ContextMode`.
      - Remove `ContextMode`, `CompactionStrategy`, `ScratchpadMode`, and smart-only `ContextManagementConfig` fields unless a remaining baseline field is explicitly needed.
      - Do not keep a one-value context mode enum for compatibility unless tests or documented migration requirements prove it necessary.
      - Keep read annotation behavior enabled by default if it remains configurable; otherwise make it baseline behavior.
      - Ensure built-in `scratchpad` is not conditionally exposed through removed scratchpad-mode config.
    acceptance:
      - Config no longer accepts or validates `context_management.mode`, `compaction_strategy`, `masking_window_turns`, or `scratchpad_mode`.
      - CLI no longer advertises or applies `--context-mode`.
      - Runtime no longer calls `agent.NewContextManager(string(cfg.ContextManagement.Mode), ...)`.
      - Tests cover removed config fields or are updated to the simplified config contract.
    verification:
      - go test ./internal/config
      - go test ./cmd/steiner

  - id: step-2
    title: Replace pluggable context manager with baseline context state
    scope: Remove the context-mode plugin abstraction and retain only concrete baseline behavior used by the runner.
    files:
      - internal/agent/context_manager.go
      - internal/agent/context_manager_base.go
      - internal/agent/context_manager_tool_result.go
      - internal/agent/context_manager_reset.go
      - internal/agent/runner.go
      - internal/agent/turn_progression.go
      - internal/agent/tool_exec.go
      - internal/agent/file_tracker*.go
      - internal/agent/*context_manager*_test.go
      - internal/agent/file_tracker*_test.go
      - internal/agent/tool_exec_test.go
      - internal/agent/runner_test.go
    constraints:
      - Remove `ContextManager`, `NewContextManager`, `SmartContextManager`, and `NaiveContextManager` as mode implementations.
      - Remove optional role interfaces that exist only for type assertions: `CompactionRecorder`, `EpochResetter`, `AssistantResponseIngestor`, `ScaffoldInferrer`, `CompactionStrategyProvider`, and `MaskingWindowProvider`.
      - Keep concrete baseline behavior: post-ingestion read normalization, fresh tool-result shaping, mutation tracking for read invalidation, file-annotation diagnostics, and cached system preamble.
      - Avoid moving baseline behavior into a generic `util`, `helper`, or `common` package.
      - Keep runner package boundaries intact; `cmd/steiner` should wire concrete dependencies only.
    acceptance:
      - No production code references `SmartContextManager`, `NaiveContextManager`, `NewContextManager`, `PreAssembly`, or `OnTurnComplete`.
      - Runner behavior still annotates unchanged read results and invalidates annotations after successful `mutate`.
      - System preamble caching remains byte-stable across turns for session-constant inputs.
      - Tests no longer assert smart/naive mode switching, but still cover baseline read annotation and mutation invalidation.
    verification:
      - go test ./internal/agent -run 'Test(FileTracker|.*Context|Runner|RecordMutation)'
      - go test ./internal/agent

  - id: step-3
    title: Remove smart-only masking, epoch, and scratchpad machinery
    scope: Delete code, tests, and event handling that only support epoch masking, scaffold inference, hybrid scratchpad, and the model-facing scratchpad tool.
    files:
      - internal/agent/masking.go
      - internal/agent/masking_test.go
      - internal/agent/epoch_manager.go
      - internal/agent/epoch_manager_test.go
      - internal/agent/scratchpad.go
      - internal/agent/scratchpad_manager.go
      - internal/agent/scratchpad_path.go
      - internal/agent/scratchpad*_test.go
      - internal/tool/builtin/scratchpad.go
      - internal/tool/builtin/scratchpad_test.go
      - internal/tool/builtin/builtins.go
      - internal/tool/builtin/builtins_test.go
      - internal/prompt/system.go
      - internal/output/*.go
      - internal/output/*_test.go
      - internal/tui/*.go
    constraints:
      - Remove the `scratchpad` built-in unless explicitly retained as a separate non-smart delegation feature.
      - Remove scratchpad instructions from the main system preamble when the tool is gone.
      - Remove scaffold inference model calls and scratchpad updated events if no remaining producer exists.
      - Keep `sanitizeScratchpadPathWithRoot` only if it is renamed and still used for baseline file/tool summaries.
      - Preserve unrelated output events and TUI state.
    acceptance:
      - `rg -n "scratchpad|Scratchpad|epoch|masking|ScaffoldInferrer|OnTurnComplete"` shows no production references except deliberate docs/history compatibility notes if retained.
      - Built-in tool list and provider tool specs no longer include `scratchpad`.
      - Sub-agent prompts and allowlists no longer instruct use of a missing scratchpad tool.
      - Output and TUI code no longer maintains scratchpad-only state with no producer.
    verification:
      - go test ./internal/tool/builtin
      - go test ./internal/output
      - go test ./internal/tui
      - go test ./internal/agent

  - id: step-4
    title: Simplify compaction to the baseline summarization fallback
    scope: Remove smart compaction strategies and strategy plumbing while preserving hard-limit model-based compaction if still required by baseline behavior.
    files:
      - internal/agent/compaction.go
      - internal/agent/compaction_test.go
      - internal/agent/turn_progression.go
      - internal/agent/model_call.go
      - internal/prompt/compaction.go
      - internal/prompt/types.go
      - internal/prompt/budget.go
      - internal/prompt/*compaction*_test.go
      - internal/prompt/*source*_test.go
      - testdata/stage3/compaction_fixture/**
    constraints:
      - Delete `dropCompactor` and `hybridCompactor`.
      - Remove compaction strategy selection from `RunRequest`/context state.
      - Remove epoch reset and compaction recorder hooks.
      - Replace scratchpad-oriented discontinuity wording with baseline wording if any marker remains.
      - Preserve model-based summarization only where the naive hard-limit fallback uses it.
      - Keep compaction logs only if summarization compaction still makes model calls.
    acceptance:
      - `compactorForRequest` is gone or always resolves directly to the remaining summarization path.
      - No production code references `CompactionStrategy`, `drop`, `hybrid`, `MaskingWindowProvider`, or `EpochResetter`.
      - Oversize-request tests still cover successful summarization compaction and irreducible request failure.
      - Compaction fixtures/snapshots match the simplified baseline behavior.
    verification:
      - go test ./internal/agent -run Compaction
      - go test ./internal/prompt -run Compaction
      - go test ./internal/agent
      - go test ./internal/prompt

  - id: step-5
    title: Clean prompt and durable context remnants
    scope: Remove prompt fields and rendering paths made unused by smart scratchpad or smart durable context while preserving conversation summaries needed by baseline compaction.
    files:
      - internal/agent/message_convert.go
      - internal/agent/message_convert_test.go
      - internal/agent/context_state.go
      - internal/agent/state.go
      - internal/prompt/types.go
      - internal/prompt/source_plan.go
      - internal/prompt/source_render.go
      - internal/prompt/assemble_test.go
      - internal/prompt/source_plan_test.go
      - internal/prompt/system_test.go
    constraints:
      - Remove `ScratchpadEnabled` and scratchpad message injection if no remaining scratchpad feature exists.
      - Remove `ContextState.Scratchpad`, active constraints/focus/unresolved work fields if they are only smart scaffold remnants.
      - Keep retained conversation summaries only if summarization compaction still stores and renders them.
      - Keep prompt source ordering intentional; update tests when block precedence changes.
    acceptance:
      - Prompt assembly no longer injects `[Current task state]` or scratchpad field placeholders.
      - System preamble no longer changes based on scratchpad enablement.
      - Remaining context-state conversions are minimal and tied to retained compaction summaries, if still used.
      - Prompt assembly tests document the simplified order.
    verification:
      - go test ./internal/prompt
      - go test ./internal/agent -run 'Test(MessageConvert|AssemblyOptions|Runner)'

  - id: step-6
    title: Update delegation defaults and documentation
    scope: Remove smart/scratchpad/context-mode documentation and update delegation guidance to match available tools.
    files:
      - README.md
      - docs/CONTEXT_MANAGEMENT.md
      - docs/DELEGATION.md
      - docs/SUBAGENTS.md
      - docs/PRD.md
      - docs/ROADMAP.md
      - docs/adr/0001-defer-context-manager-interface-consolidation.md
      - internal/delegation/agent_type.go
      - internal/delegation/bootstrap.go
      - internal/delegation/*_test.go
      - internal/config/defaults.go
      - internal/config/defaults_test.go
    constraints:
      - Delete `docs/CONTEXT_MANAGEMENT.md` or rewrite it as a short baseline-context note; do not leave smart-mode rationale as current guidance.
      - Remove `scratchpad` from sub-agent allowed-tool defaults and agent-type allowlists unless retained separately.
      - Remove sub-agent prompt text that says scratchpad findings are guaranteed to survive when the tool is gone.
      - Update ADR-0001 because the experiment has concluded and the deferred consolidation decision is obsolete.
    acceptance:
      - User docs do not mention `--context-mode smart`, smart masking, scaffold scratchpad, drop/hybrid compaction, or scratchpad-mode config as supported features.
      - Delegation docs and prompts list only tools that can actually be exposed.
      - Config defaults/tests no longer include scratchpad in allowed tools unless the tool is retained intentionally.
    verification:
      - go test ./internal/delegation
      - go test ./internal/config
      - rg -n "context-mode|smart context|scratchpad_mode|compaction_strategy|masking_window|drop|hybrid|scratchpad" README.md docs internal

  - id: step-7
    title: Final cleanup and repo-wide verification
    scope: Remove leftover dead files, stale tests, unused imports, and stale references after the deletion passes.
    files:
      - internal/agent/**
      - internal/config/**
      - internal/prompt/**
      - internal/output/**
      - internal/tool/**
      - cmd/steiner/**
      - docs/**
      - README.md
    constraints:
      - Use `rg` to find stale symbols before declaring cleanup complete.
      - Run `gofmt` and `goimports` on all changed Go files.
      - Do not revert or include unrelated pre-existing untracked planning files.
      - Keep unrelated refactors out of scope.
    acceptance:
      - `rg -n "SmartContextManager|NewContextManager|ContextModeSmart|context-mode|scratchpad_mode|CompactionStrategy|MaskingWindowProvider|ScaffoldInferrer|EpochResetter|dropCompactor|hybridCompactor"` returns no production references.
      - `go test ./...` passes before final mandated checks.
      - `make check` passes, or exact missing-tool/failure reason is reported.
    verification:
      - gofmt -w <changed go files>
      - goimports -w <changed go files>
      - go test ./...
      - make check
