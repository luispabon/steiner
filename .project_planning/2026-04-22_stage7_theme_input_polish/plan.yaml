stages:
  - id: stage-1
    objective: Build the theme package — interface, registry, and Catppuccin Mocha implementation
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: >
          Define the Theme interface, Styles struct, and theme registry.
          Add the catppuccin/go dependency to go.mod.
        scope: New package internal/tui/theme; go.mod update only
        files:
          - go.mod
          - go.sum
          - internal/tui/theme/theme.go
          - internal/tui/theme/registry.go
        constraints:
          - "Theme interface exposes exactly these semantic colour methods (all return lipgloss.Color):
            Background, Foreground, Accent, Muted, Border, Error, Warning, Success,
            SyntaxKeyword, SyntaxString, SyntaxComment, SyntaxFunction, SyntaxNumber, SyntaxOperator"
          - "Styles struct holds named lipgloss.Style values for: ContentPane, Sidebar, SidebarLabel,
            SidebarValue, ToolBlock, ThinkingBlock, AssistantProse, ApprovalHighlight, InputArea,
            StatusBar, Border, ErrorStyle, WarningStyle, SuccessStyle"
          - "Theme interface methods: LipGlossStyles() Styles and GlamourStyleSheet() glamour.TermRendererOption"
          - "Registry: Register(name string, theme Theme), Get(name string) (Theme, error), Default() Theme"
          - "Themes self-register via init() in their own files; registry.go does not import catppuccin.go"
          - "Add github.com/catppuccin/go to go.mod (run go get github.com/catppuccin/go)"
          - "Do not implement any theme in this step — only the interface, struct, and registry"
          - "Keep palette to 14 named colours — do not add more semantic names"
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - internal/tui/theme/theme.go with Theme interface, Styles struct, LipGlossStyles, GlamourStyleSheet
          - internal/tui/theme/registry.go with Register, Get, Default
          - go.mod updated with catppuccin/go dependency
        acceptance:
          - "go build ./internal/tui/theme/... succeeds"
          - "Theme interface and Styles struct compile cleanly"
          - "Registry compiles and exports Register, Get, Default"
          - "github.com/catppuccin/go appears in go.mod"
        handoff: >
          Theme interface, Styles struct, and registry are defined and build cleanly.
          catppuccin/go is in go.mod. Next step implements the Catppuccin Mocha theme.
        verification:
          - "gofmt -w internal/tui/theme/theme.go internal/tui/theme/registry.go"
          - "go build ./internal/tui/theme/..."

      - id: stage-1-step-2
        objective: >
          Implement the Catppuccin Mocha theme: palette values from catppuccin/go,
          Lip Gloss style derivation, and Glamour style sheet generation.
        scope: internal/tui/theme/catppuccin.go only
        files:
          - internal/tui/theme/catppuccin.go
        constraints:
          - "Import: github.com/catppuccin/go package catppuccingo; use catppuccingo.Mocha as the Flavor"
          - "Palette access pattern: mocha.Base().Hex gives a hex string; convert with lipgloss.Color(hex)"
          - "Do not hardcode any hex strings — all values come from catppuccingo.Mocha methods"
          - "LipGlossStyles(): build Styles struct mapping all 14 Styles fields to lipgloss.Style values
            derived from the palette; Background=mocha.Base, Foreground=mocha.Text, Accent=mocha.Lavender,
            Muted=mocha.Overlay0, Border=mocha.Surface1, Error=mocha.Red, Warning=mocha.Yellow,
            Success=mocha.Green; SyntaxKeyword=mocha.Mauve, SyntaxString=mocha.Green,
            SyntaxComment=mocha.Overlay0, SyntaxFunction=mocha.Blue, SyntaxNumber=mocha.Peach,
            SyntaxOperator=mocha.Sky"
          - "GlamourStyleSheet(): use glamour.WithStyles(ansi.StyleConfig{...}); populate *string fields
            by taking addr of hex strings from palette; set StyleCodeBlock.Theme to catppuccin-mocha if it
            exists in chroma, otherwise dracula; set document and code block Background to mocha.Mantle.Hex;
            set inline code Background to mocha.Surface0.Hex, Color to mocha.Peach.Hex;
            set heading colours to mocha.Lavender.Hex; set link colour to mocha.Blue.Hex;
            set emphasis (bold/italic) to mocha.Mauve.Hex"
          - "Register in init() as catppuccin-mocha; Default() returns this theme"
          - "Write a unit test (catppuccin_test.go) verifying: LipGlossStyles returns non-zero Styles,
            GlamourStyleSheet returns non-nil option, a second dummy theme can be registered and retrieved"
        depends_on:
          - stage-1-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - internal/tui/theme/catppuccin.go
          - internal/tui/theme/catppuccin_test.go
        acceptance:
          - "go build ./internal/tui/theme/... succeeds"
          - "go test ./internal/tui/theme/... passes"
          - "No hex string literals appear in catppuccin.go (all values sourced from catppuccingo.Mocha)"
          - "LipGlossStyles covers all 14 Styles fields"
          - "GlamourStyleSheet uses WithStyles, not WithStandardStyle"
        handoff: >
          Catppuccin Mocha theme implemented and tested. Theme package is complete.
          Next stage wires the theme through all TUI components.
        verification:
          - "gofmt -w internal/tui/theme/catppuccin.go internal/tui/theme/catppuccin_test.go"
          - "go build ./internal/tui/theme/..."
          - "go test ./internal/tui/theme/..."

  - id: stage-2
    objective: Wire the theme through all TUI components; fix the Glamour/Lip Gloss colour mismatch
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: >
          Remove all hardcoded hex colour constants and inline lipgloss.Color calls from the TUI.
          Load the active theme from config at startup. Pass Styles and GlamourStyleSheet to all
          components. Fix content.go's Glamour renderer to use the theme-derived style sheet.
        scope: internal/tui — render.go, content.go, sidebar.go, statusbar.go, app.go, model.go
        files:
          - internal/tui/render.go
          - internal/tui/content.go
          - internal/tui/sidebar.go
          - internal/tui/statusbar.go
          - internal/tui/app.go
          - internal/tui/model.go
        constraints:
          - "render.go: delete all catppuccinMocha* const block; replace all lipgloss.Color(catppuccinMocha*) references
            with fields from a Styles value; rename/restructure functions as needed so they accept Styles rather
            than building colours inline"
          - "app.go: at startup, read tui.theme config string; call registry.Get(name); on error log warning and
            call registry.Default(); store active Theme on the model"
          - "model.go: add Theme field; call theme.LipGlossStyles() once at init and store; pass Styles to
            content, sidebar, statusbar, input area; no component may call lipgloss.Color() with a literal string"
          - "content.go: markdownRenderer() must call theme.GlamourStyleSheet() instead of glamour.WithStandardStyle('dark');
            tool block and thinking block styles from Styles.ToolBlock and Styles.ThinkingBlock"
          - "sidebar.go: all styles from Styles.Sidebar, Styles.SidebarLabel, Styles.SidebarValue"
          - "statusbar.go: all styles from Styles fields"
          - "After refactor: grep -rn '#[0-9a-fA-F]\\{6\\}' internal/tui/ must return zero results (excluding theme/)"
          - "No new public API surface beyond what is needed for theme wiring"
        depends_on:
          - stage-1-step-2
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - All six files refactored with zero hardcoded hex literals
          - Theme loaded from config at startup with fallback
        acceptance:
          - "go build ./... succeeds"
          - "go vet ./... passes"
          - "grep -rn '#[0-9a-fA-F]\\{6\\}' internal/tui/ (excluding theme/) returns no results"
          - "content.go uses theme.GlamourStyleSheet(), not WithStandardStyle('dark')"
          - "app.go reads tui.theme config and falls back to Default() on error"
        handoff: >
          All TUI chrome colours sourced from theme. Glamour mismatch fixed. No hardcoded hex
          literals remain outside internal/tui/theme/. Next stage upgrades the input area.
        verification:
          - "gofmt -w internal/tui/render.go internal/tui/content.go internal/tui/sidebar.go internal/tui/statusbar.go internal/tui/app.go internal/tui/model.go"
          - "go build ./..."
          - "go vet ./..."
          - "grep -rn '#[0-9a-fA-F]\\{6\\}' internal/tui/ --include='*.go' | grep -v theme/"

  - id: stage-3
    objective: Upgrade input area and add help overlay
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: >
          Replace bubbles/textinput with bubbles/textarea. Wire submit on Enter (Shift+Enter inserts
          newline). Implement command history navigation (up/down). Add paste guard against accidental
          slash-command dispatch.
        scope: internal/tui — model.go, input.go, keys.go
        files:
          - internal/tui/model.go
          - internal/tui/input.go
          - internal/tui/keys.go
        constraints:
          - "Replace textinput.Model field in model struct with textarea.Model"
          - "textarea initialisation: set CharLimit(0), ShowLineNumbers(false), Prompt('> ');
            apply Styles.InputArea to the textarea style; call Focus() at startup"
          - "Submit wiring: in model.Update(), intercept tea.KeyMsg with Type==tea.KeyEnter and NO modifiers
            before passing to textarea; treat as submit (read textarea.Value(), reset textarea, parse input);
            for Shift+Enter (tea.KeyShiftEnter or tea.KeyAlt+tea.KeyEnter), let it reach textarea as a plain
            Enter to insert a newline — achieve by mapping: intercept ShiftEnter and re-dispatch as plain Enter
            to textarea"
          - "History: add inputHistory []string and historyIdx int to model struct; on submit, prepend value to
            inputHistory; on KeyUp when textarea cursor is on first line, load previous history entry into
            textarea; on KeyDown, load next entry or restore draft; store current draft before history navigation"
          - "Paste guard: after submit, if any line of submitted text starts with '/' and input had more than
            one line, log a warning but still submit — do not silently drop; the parseInput function already
            handles this correctly since it operates on the full value"
          - "input.go: parseInput signature and logic unchanged; only model.go and keys.go change"
          - "Approval prompt: when model is in approval mode, keep textarea but change Placeholder; single-line
            answers are sufficient — Enter still submits"
          - "All input area styles (border, foreground, background) from Styles.InputArea"
        depends_on:
          - stage-2-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - model.go with textarea, history, submit/newline wiring
          - keys.go updated for history navigation
        acceptance:
          - "go build ./... succeeds"
          - "Textarea renders in place of textinput in View()"
          - "Enter submits; Shift+Enter inserts a newline (verify by code inspection)"
          - "inputHistory grows on each submit"
          - "Up/down key handling present in model.Update()"
        handoff: >
          Textarea in place, history wired, submit/newline split working. Next step adds tab
          completion for slash commands.
        verification:
          - "gofmt -w internal/tui/model.go internal/tui/keys.go"
          - "go build ./..."
          - "go vet ./..."

      - id: stage-3-step-2
        objective: >
          Add tab completion for slash commands and skill names. Completion triggers only
          after a '/' prefix; no completion otherwise.
        scope: internal/tui — model.go (completion logic); input.go if helpers added
        files:
          - internal/tui/model.go
          - internal/tui/input.go
        constraints:
          - "Tab key: intercepted in model.Update() when textarea value starts with '/'"
          - "Completion candidates: built-in commands (/exit, /clear, /skills, /skill, /skill +name, /skill -name)
            plus all keys in the enabledSkills map prefixed with '/skill '"
          - "Completion algorithm: find all candidates with the current input as a prefix; if one match, complete
            fully; if multiple matches, cycle through on repeated Tab; if no match, do nothing"
          - "Completion state: add completionCandidates []string and completionIdx int to model struct;
            reset on any non-Tab keystroke"
          - "Tab without '/' prefix: do nothing (pass through to textarea)"
          - "No UI dropdown — inline completion replaces textarea value only"
        depends_on:
          - stage-3-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Completion logic in model.go
          - Completion candidate list generation (may be a helper in input.go)
        acceptance:
          - "go build ./... succeeds"
          - "Typing '/he' + Tab completes to '/help' or cycles through /help candidates"
          - "Typing 'hello' + Tab does nothing (no '/' prefix)"
          - "Repeated Tab cycles candidates"
          - "Any non-Tab key resets completion state"
        handoff: >
          Tab completion working for slash commands and skill names. Next step adds help overlay.
        verification:
          - "gofmt -w internal/tui/model.go internal/tui/input.go"
          - "go build ./..."
          - "go vet ./..."

      - id: stage-3-step-3
        objective: >
          Implement the help overlay: a Lip Gloss-styled keybind reference panel toggled by '?',
          rendered as an inline overlay over the content pane.
        scope: internal/tui — help.go (new), model.go, keys.go
        files:
          - internal/tui/help.go
          - internal/tui/model.go
          - internal/tui/keys.go
        constraints:
          - "New file help.go: renderHelp(styles Styles, width int) string function; returns a bordered
            Lip Gloss panel listing keybindings in four groups: Navigation (scroll up/down, page up/down,
            home/end), Input (enter=submit, shift+enter=newline, up/down=history, tab=complete, ctrl+a/e/k/w/u),
            Session (ctrl+b=sidebar, /clear, /exit, ?=help), Approval (yes/no on approve prompt)"
          - "model.go: add helpVisible bool field; add renderHelp call in View() — when helpVisible, overlay
            the help panel centred over content pane using lipgloss.Place"
          - "keys.go: add ? key binding; guard: only fire toggle when textarea.Value() is empty, preventing
            help from triggering mid-sentence"
          - "Escape key: also dismiss help overlay (add Escape handler that sets helpVisible=false when true)"
          - "Styles: use Styles.Border for overlay border, Styles.Foreground for text, Styles.Muted for key names"
          - "Overlay must not affect focus or input state — it is view-only"
        depends_on:
          - stage-3-step-2
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - internal/tui/help.go
          - model.go with helpVisible flag and overlay render
          - keys.go with ? binding and guard
        acceptance:
          - "go build ./... succeeds"
          - "helpVisible toggled by ? key only when textarea is empty"
          - "Escape dismisses overlay"
          - "renderHelp returns non-empty string with all four keybinding groups"
          - "go test ./internal/tui/... passes (existing tests unbroken)"
        handoff: >
          Help overlay complete. All Stage 7 implementation done. Run full verification suite.
        verification:
          - "gofmt -w internal/tui/help.go internal/tui/model.go internal/tui/keys.go"
          - "go build ./..."
          - "go vet ./..."
          - "go test ./internal/tui/..."
          - "go test ./..."
          - "make build-binaries"
