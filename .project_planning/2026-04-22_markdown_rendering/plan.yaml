stages:
  - id: stage-6-prerequisites
    objective: Add Glamour dependency and prepare for implementation
    parallel: false
    steps:
      - id: stage-6-add-glamour
        objective: Add glamour to go.mod and verify it compiles
        scope: go.mod dependency
        files:
          - go.mod
          - go.sum
        constraints: []
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs: []
        acceptance:
          - glamour package can be imported in tui package
          - go build ./internal/tui succeeds
        handoff: Add `github.com/charmbracelet/glamour` to go.mod, run go mod tidy, verify compilation
        verification:
          - go build ./internal/tui

  - id: stage-6-render-styles
    objective: Create render.go with hardcoded Catppuccin Mocha styles
    parallel: false
    steps:
      - id: stage-6-render-go
        objective: Implement render.go with hardcoded Lip Gloss styles for content, sidebar, tool blocks, thinking blocks
        scope: internal/tui/render.go
        files:
          - internal/tui/render.go
        constraints:
          - Use Catppuccin Mocha hex values directly (no theme abstraction yet)
          - Styles for: content pane, sidebar, tool execution blocks, thinking blocks, assistant prose, approval highlight, input area, border
        depends_on:
          - stage-6-add-glamour
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs: []
        acceptance:
          - render.go defines all required style variables
          - no hardcoded colours leak to other tui files (they'll import from render)
        handoff: Create internal/tui/render.go with hardcoded Catppuccin Mocha palette values and Lip Gloss style definitions
        verification:
          - go vet ./internal/tui

  - id: stage-6-git-detection
    objective: Implement git branch and dirty state detection
    parallel: false
    steps:
      - id: stage-6-git-go
        objective: Create git.go to detect branch name and dirty state
        scope: internal/tui/git.go
        files:
          - internal/tui/git.go
        constraints:
          - Read .git/HEAD for branch name
          - Shell out to git status --porcelain only on session start and after write/edit tools
          - Cache results, do not shell out on every render
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs: []
        acceptance:
          - Branch name correctly extracted (including detached HEAD)
          - Dirty state detected after file modifications
          - No performance impact on render cycle
        handoff: Create internal/tui/git.go with branch and dirty state detection, called at session start and on ToolResult events
        verification:
          - go vet ./internal/tui

  - id: stage-6-sidebar
    objective: Implement status sidebar panel
    parallel: false
    steps:
      - id: stage-6-sidebar-go
        objective: Create sidebar.go with live session metrics display
        scope: internal/tui/sidebar.go
        files:
          - internal/tui/sidebar.go
        constraints:
          - Fixed width 30-35 characters
          - Show: model name, provider endpoint, context tokens used/budget%, current turn/max turns, compaction state, git branch+dirty, working dir, active skills
          - Auto-collapse below tui.sidebar_min_width
          - Manual toggle via keybind
          - Clear visual boundary from content pane (Lip Gloss border)
        depends_on:
          - stage-6-render-go
          - stage-6-git-go
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs: []
        acceptance:
          - Sidebar displays all specified metrics
          - Collapses correctly on terminal resize
          - Toggle keybind works
        handoff: Create internal/tui/sidebar.go implementing the status panel with all metrics
        verification:
          - go vet ./internal/tui

  - id: stage-6-markdown
    objective: Integrate Glamour markdown rendering in content pane
    parallel: false
    steps:
      - id: stage-6-content-markdown
        objective: Extend content.go with Glamour rendering and streaming block detection
        scope: internal/tui/content.go
        files:
          - internal/tui/content.go
        constraints:
          - Buffer incoming StreamChunk events
          - Track block boundaries: blank lines, code fences, header markers, list items
          - When block completes, render through Glamour with Chroma syntax highlighting
          - In-progress block shows as plain text below styled content
          - On StreamComplete, render remaining buffered text
          - Full markdown support: headers, bold, italic, inline code, code blocks, lists, tables, links
        depends_on:
          - stage-6-render-go
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs: []
        acceptance:
          - Markdown renders with correct styling
          - Code blocks have syntax highlighting
          - Streaming shows styled completed blocks above, plain in-progress below
          - Tool and thinking blocks rendered as muted/visually subordinate
        handoff: Extend internal/tui/content.go with Glamour integration, block boundary detection, and streaming strategy
        verification:
          - go build ./internal/tui

  - id: stage-6-model-layout
    objective: Update model.go for three-region layout
    parallel: false
    steps:
      - id: stage-6-model-update
        objective: Extend model.go to compose content pane, sidebar, and status bar
        scope: internal/tui/model.go
        files:
          - internal/tui/model.go
        constraints:
          - Model state gains sidebar visible flag and sidebar state
          - View() updated for three-region layout
          - Layout reflow on WindowSizeMsg
          - Sidebar visibility toggled by keybind and terminal width
        depends_on:
          - stage-6-sidebar-go
          - stage-6-content-markdown
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs: []
        acceptance:
          - Three-region layout renders correctly
          - Sidebar appears/disappears on resize
          - Toggle keybind works
        handoff: Update internal/tui/model.go for three-region layout with sidebar
        verification:
          - go build ./internal/tui

  - id: stage-6-keys
    objective: Add sidebar toggle keybind
    parallel: false
    steps:
      - id: stage-6-keys-update
        objective: Update keys.go to include sidebar toggle
        scope: internal/tui/keys.go
        files:
          - internal/tui/keys.go
        constraints:
          - Add sidebar toggle keybind (e.g., ctrl+b)
          - Update hints to include sidebar toggle
        depends_on:
          - stage-6-model-update
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs: []
        acceptance:
          - Keybind registered and triggers sidebar toggle
          - Hints string updated
        handoff: Update internal/tui/keys.go with sidebar toggle keybind
        verification:
          - go vet ./internal/tui

  - id: stage-6-verify
    objective: Final verification of Stage 6 implementation
    parallel: false
    steps:
      - id: stage-6-full-build
        objective: Build and verify the complete implementation
        scope: Full project
        files: []
        constraints:
          - All verification as per overview.md
        depends_on:
          - stage-6-keys-update
        parallel_group:
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
        acceptance:
          - go build ./... succeeds
          - go vet ./... passes
          - go test ./internal/tui/... passes (if tests exist)
          - TUI renders correctly with markdown, sidebar, and visual hierarchy
        handoff: Run full verification: build, vet, test
        verification:
          - go build ./...
          - go vet ./...
          - go test ./internal/tui/...