    summary: "Bubble Tea startup/runtime failures are swallowed unconditionally."
    why_it_matters: "The comment says normal quit errors are expected, but the implementation drops all errors. Real terminal setup failures or TUI crashes disappear, leaving the caller with a silent exit and no diagnostic trail."
    current_code: |
      go func() {
      	defer wg.Done()
      	if _, err := teaProgram.Run(); err != nil {
      		// Non-fatal: program exit errors are expected on normal quit.
      		_ = err
      	}
      	stop()
      }()
    suggested_code: |
      go func() {
      	defer wg.Done()
      	if _, err := teaProgram.Run(); err != nil {
      		rt.events.Emit(output.NewContextDiagnosticsEvent(output.ContextDiagnosticsEvent{
      			Kind:     "session_health",
      			Severity: "warning",
      			Notes:    []string{fmt.Sprintf("interactive tui stopped with error: %v", err)},
      		}))
      	}
      	stop()
      }()
    rationale: "If the team later wants to suppress a specific expected quit error, that filtering can be added explicitly. The current blanket ignore masks the useful failures as well."
