    summary: "CLI subcommands build a runtime but never close it, leaking the history writer, optional log sink, and `/dev/tty` approval handle."
    why_it_matters: "Every successful `steiner tools` or `steiner skills` invocation leaves cleanup work deferred forever. In the current runtime this can keep file descriptors open and suppress close-time diagnostics that `closeRuntime` is meant to emit."
    current_code: |
      func newToolsCommand(flags *cliFlags) *cobra.Command {
      	return &cobra.Command{
      		RunE: func(cmd *cobra.Command, args []string) error {
      			rt, err := buildRuntime(cmd.Context(), cmd, flags)
      			if err != nil {
      				return err
      			}
      			renderNames(output.NewStream(cmd.OutOrStdout()), "tools", rt.toolNames)
      			return nil
      		},
      	}
      }

      func newSkillsCommand(flags *cliFlags) *cobra.Command {
      	return &cobra.Command{
      		RunE: func(cmd *cobra.Command, args []string) error {
      			rt, err := buildRuntime(cmd.Context(), cmd, flags)
      			if err != nil {
      				return err
      			}
      			renderNames(output.NewStream(cmd.OutOrStdout()), "skills", rt.skillNames)
      			return nil
      		},
      	}
      }
    suggested_code: |
      func newToolsCommand(flags *cliFlags) *cobra.Command {
      	return &cobra.Command{
      		Use:   "tools",
      		Short: "List configured tools",
      		Args:  cobra.NoArgs,
      		RunE: func(cmd *cobra.Command, args []string) error {
      			rt, err := buildRuntime(cmd.Context(), cmd, flags)
      			if err != nil {
      				return err
      			}
      			defer closeRuntime(&rt)
      			renderNames(output.NewStream(cmd.OutOrStdout()), "tools", rt.toolNames)
      			return nil
      		},
      	}
      }

      func newSkillsCommand(flags *cliFlags) *cobra.Command {
      	return &cobra.Command{
      		Use:   "skills",
      		Short: "List discovered skills",
      		Args:  cobra.NoArgs,
      		RunE: func(cmd *cobra.Command, args []string) error {
      			rt, err := buildRuntime(cmd.Context(), cmd, flags)
      			if err != nil {
      				return err
      			}
      			defer closeRuntime(&rt)
      			renderNames(output.NewStream(cmd.OutOrStdout()), "skills", rt.skillNames)
      			return nil
      		},
      	}
      }
    rationale: "This preserves behaviour while restoring the same lifecycle management already used in `runExecMode` and `runInteractiveMode`."
