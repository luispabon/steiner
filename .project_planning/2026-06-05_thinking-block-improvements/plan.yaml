steps:
  - id: step-1
    title: Wire width through to thinking block renderer
    scope: |
      Pass width from renderSupplementalSegment to renderThinkingBlockSegment.
      Update renderThinkingBlockSegment signature to accept width int.
      Apply ansi.Wordwrap + ansi.Hardwrap to each body line in expanded state.
      For collapsed state: wrap body to available width, take first 3 lines,
      append "…" if truncated. Use "▸ Thinking" header + "▎" bar prefix
      (matching expanded style).
    files:
      - internal/tui/content_render.go
      - internal/tui/content_render_markdown.go
    constraints:
      - Reuse ansi.Wordwrap/ansi.Hardwrap pattern from wrapStyledDelegationLines
      - Do not change thinkingBlockData struct
      - Do not change content_events_stream.go preview population
      - Collapsed bar prefix "▎" must match expanded style
      - Width accounting must subtract bar prefix width (2 chars)
    acceptance:
      - Expanded thinking lines wrap at viewport width
      - Collapsed thinking shows header + up to 3 wrapped lines with "…" if truncated
      - Short thinking blocks (<= 3 lines) show full text when collapsed without "…"
      - Render cache invalidates on width change (already handled by cachedRenderWidth)
    verification:
      - gofmt -w internal/tui/content_render.go internal/tui/content_render_markdown.go
      - goimports -w internal/tui/content_render.go internal/tui/content_render_markdown.go
      - go build ./...
      - go vet ./internal/tui/...
      - go test ./internal/tui/... -run Thinking

  - id: step-2
    title: Tests and full verification
    scope: |
      Add or update table-driven tests for renderThinkingBlockSegment covering:
      expanded wrapping, collapsed 3-line preview, short text no truncation,
      empty/nil thinkData. Run make check.
    files:
      - internal/tui/content_test.go
    depends_on: [step-1]
    constraints:
      - Table-driven tests
      - Test at narrow width (40) and wide width (120)
      - Do not test private helpers directly; go through renderThinkingBlockSegment or String()
    acceptance:
      - Tests pass for all cases
      - make check passes clean
    verification:
      - go test ./internal/tui/... -v
      - make check
