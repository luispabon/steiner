steps:
  - id: step-1
    title: Pin session persistence regressions for compaction and tool turns
    scope: Add focused failing tests that describe the two reported bugs at the durable session boundary before changing behavior.
    files:
      - internal/interactive/compaction_test.go
      - internal/interactive/session_test.go
      - internal/session/store_test.go
      - internal/agent/replay_sanitize_test.go
      - internal/agent/message_convert_test.go
    constraints:
      - Keep tests near the package that owns the behavior being asserted.
      - Do not change production behavior in this step unless needed only for test scaffolding.
      - Preserve existing replay-safety expectations for orphan and incomplete tool-call transcripts.
    acceptance:
      - A test proves successful manual compaction persists a saved session without requiring a later prompt.
      - A test proves saved session lineage round-trips assistant tool calls and matching tool results through JSON persistence.
      - A test proves resumed conversation setup preserves valid tool/delegation-style messages for display and subsequent state.
      - Existing replay sanitizer tests still assert invalid tool transcripts are normalized before provider replay.
    verification:
      - go test ./internal/interactive ./internal/session ./internal/agent

  - id: step-2
    title: Persist manual compaction results immediately
    scope: Update the manual compaction flow so successful compaction mutations to conversation and lineage are saved to the configured session store immediately.
    files:
      - internal/interactive/compaction.go
      - internal/interactive/session.go
      - internal/interactive/compaction_test.go
      - internal/interactive/session_test.go
    constraints:
      - Keep session persistence owned by internal/interactive and internal/session; do not move business logic into cmd/steiner.
      - Reuse existing saveSession/session metadata paths where possible rather than introducing a parallel persistence mechanism.
      - Emit an existing warning-style diagnostic if persistence fails; do not fail an otherwise successful compaction solely because save failed unless current session-save behavior already does so.
      - Do not record manual compaction in prompt readline history.
    acceptance:
      - Running manual compaction updates in-memory conversation and saved session lineage consistently.
      - Exiting immediately after manual compaction no longer loses the compacted summary on resume.
      - Session title, ID, model, and lineage metadata remain stable except for the expected updated timestamp/lineage.
    verification:
      - go test ./internal/interactive -run 'Compaction|Session'
      - go test ./internal/interactive ./internal/session
    depends_on:
      - step-1

  - id: step-3
    title: Preserve valid tool and delegation turns across save and resume
    scope: Fix the resume/session-load path if it drops, flattens, or sanitizes valid assistant tool calls, tool results, or delegation-style results that should remain in durable conversation state.
    files:
      - internal/interactive/session.go
      - internal/session/session.go
      - internal/session/store.go
      - internal/agent/replay_sanitize.go
      - internal/agent/message_convert.go
      - internal/agent/subagent_state.go
      - internal/agent/subagent_state_test.go
      - internal/session/store_test.go
      - internal/interactive/session_test.go
    constraints:
      - Distinguish durable saved state from replay-safe provider normalization.
      - Preserve `agent.ReplaySafeConversation` behavior for invalid orphan tool messages and incomplete assistant tool calls.
      - Avoid schema churn unless tests prove current JSON structure cannot represent the required state.
      - If a persisted schema migration or backward-compatible load fallback is needed, keep it local to internal/session.
    acceptance:
      - Complete assistant tool-call plus matching tool-result sequences survive save/load and session resume.
      - Delegation-style records represented in `agent.Message`/lineage survive save/load and remain available for display and context decisions.
      - Provider replay still receives only replay-safe transcripts.
      - Older saved sessions without tool/delegation fields continue to load.
    verification:
      - go test ./internal/session ./internal/interactive ./internal/agent
    depends_on:
      - step-1

  - id: step-4
    title: Integrate docs decision and full verification
    scope: Run formatting, targeted verification, repository-required checks, and update docs only if implementation changed user-visible session/history behavior beyond the bug fixes.
    files:
      - README.md
      - docs/CONTEXT_MANAGEMENT.md
      - .project_planning/2026-06-09_history_resume_compaction/overview.md
      - .project_planning/2026-06-09_history_resume_compaction/plan.yaml
    constraints:
      - Do not update README or docs unless the implementation changes documented behavior or adds a new top-level behavior.
      - Run `gofmt -w` and `goimports -w` on edited Go files before check-only verification.
      - Before finalizing Go changes, run `make check`; if it cannot run, report the exact command and failure.
      - Do not touch unrelated untracked planning artifacts.
    acceptance:
      - Edited Go files are gofmt/goimports formatted.
      - Targeted package tests pass.
      - `make check` passes or any inability to run it is explicitly reported with the exact failure.
      - Documentation is either updated where required or deliberately left unchanged with the reason recorded in closeout.
    verification:
      - gofmt -w <edited-go-files>
      - goimports -w <edited-go-files>
      - go test ./internal/interactive ./internal/session ./internal/agent
      - make check
    depends_on:
      - step-2
      - step-3
