steps:
  - id: step-1
    title: Add ImageBlock types and Message.Images field
    scope: |
      Define ImageBlock struct in both agent and provider packages. Add Images []ImageBlock
      field to agent.Message and provider.Message. Add helper to detect image file extensions.
      Update message_convert.go to carry images across agent↔provider conversion.
    files:
      - internal/agent/types.go
      - internal/provider/types.go
      - internal/agent/message_convert.go
      - internal/agent/message_convert_test.go
      - internal/tool/builtin/binary.go
    constraints:
      - ImageBlock carries MediaType (string) and Data (string, base64-encoded)
      - Optional Width, Height int fields for metadata
      - Optional SizeBytes int field for display
      - Keep existing Content string field unchanged
      - Do not change any wire format yet
    acceptance:
      - ImageBlock type exists in both packages
      - Messages with Images round-trip through ToProviderMessages
      - IsImageExtension helper correctly identifies png/jpg/jpeg/gif/webp
      - go build ./... passes
    verification:
      - go test ./internal/agent/ -run TestImageBlock
      - go test ./internal/agent/ -run TestToProviderMessages
      - go build ./...

  - id: step-2
    title: Extend read tool for image files
    depends_on: [step-1]
    scope: |
      When read tool receives a path with an image extension, read the file, base64-encode it,
      validate size (reject > 5MB), extract dimensions if possible, and return a ReadResult
      with image metadata text plus an ImageBlock sideband. Add ImageBlock field to ReadResult.
      Update ToolResultEnvelope to carry images. Wire image from tool result into agent.Message.
    files:
      - internal/tool/builtin/read.go
      - internal/tool/builtin/schema.go
      - internal/tool/builtin/result.go
      - internal/agent/tool_result.go
      - internal/agent/tool_exec.go
    constraints:
      - Max image size 5MB before base64 encoding
      - Supported extensions: .png, .jpg, .jpeg, .gif, .webp
      - Text output for model is metadata only: "[image: WxH format size]"
      - Do not load image into memory twice (read once, encode once)
      - Use image stdlib package for dimension detection (png, jpeg, gif headers)
    acceptance:
      - read tool returns ImageBlock for .png file
      - read tool returns error for image > 5MB
      - read tool returns normal text for .txt file (no regression)
      - ToolResultEnvelope carries ImageBlock to agent message
      - go build ./... passes
    verification:
      - go test ./internal/tool/builtin/ -run TestRead
      - go test ./internal/agent/ -run TestToolResult
      - go build ./...

  - id: step-3
    title: Anthropic wire format image support
    depends_on: [step-1]
    scope: |
      Update toAnthropicMessage to emit image content blocks for user messages carrying
      Images. For tool result messages with images, emit both tool_result and image blocks.
      Add image source block to anthropicContentBlock struct.
    files:
      - internal/provider/anthropic_wire.go
      - internal/provider/anthropic_wire_test.go
    constraints:
      - Image block format: {"type": "image", "source": {"type": "base64", "media_type": "...", "data": "..."}}
      - Image blocks go in same content array as text blocks
      - Tool result messages become user role with tool_result + image blocks
      - Raw base64 data, no data: URI prefix
    acceptance:
      - User message with image serializes correct Anthropic image block
      - Tool result message with image includes both tool_result and image content blocks
      - Messages without images unchanged (no regression)
      - JSON output matches Anthropic API spec
    verification:
      - go test ./internal/provider/ -run TestAnthropicMessage
      - go test ./internal/provider/ -run TestAnthropicRequestWire
      - go build ./...
    parallel_group: wire-formats

  - id: step-4
    title: OpenAI wire format image support
    depends_on: [step-1]
    scope: |
      Update toOpenAIMessage to emit image_url content blocks for user messages carrying
      Images. When a message has images, Content becomes an array of content parts instead
      of a plain string. Handle tool result messages with images.
    files:
      - internal/provider/openai_wire.go
      - internal/provider/openai_wire_test.go
    constraints:
      - Image block format: {"type": "image_url", "image_url": {"url": "data:image/...;base64,...", "detail": "auto"}}
      - When images present, content field becomes array of {"type": "text", "text": "..."} and image_url parts
      - Tool result messages: image appended as follow-up user message (OpenAI doesn't support mixed tool_result + image)
    acceptance:
      - User message with image serializes correct OpenAI image_url block
      - Content field is array when images present, string when not
      - Messages without images unchanged (no regression)
      - JSON output matches OpenAI API spec
    verification:
      - go test ./internal/provider/ -run TestOpenAIMessage
      - go test ./internal/provider/ -run TestOpenAIRequestWire
      - go build ./...
    parallel_group: wire-formats

  - id: step-5
    title: Vision capability config and warning
    depends_on: [step-3, step-4]
    scope: |
      Add Vision *bool field to ModelConfig. In provider wire conversion, check vision
      capability before including image blocks. When vision is explicitly false and images
      are present, strip images and emit a diagnostic warning. Update config loading/validation.
    files:
      - internal/config/config.go
      - internal/config/config_test.go
      - internal/provider/anthropic_wire.go
      - internal/provider/openai_wire.go
      - internal/agent/model_call.go
    constraints:
      - nil Vision means assumed capable (default)
      - Vision explicitly false strips images and emits diagnostic
      - Diagnostic message tells user which model lacks vision support
      - Do not block the request — strip images and continue
    acceptance:
      - ModelConfig accepts vision field from YAML
      - Images stripped when vision=false
      - Diagnostic warning emitted when images stripped
      - No warning when vision=true or nil
    verification:
      - go test ./internal/config/ -run TestVision
      - go test ./internal/provider/ -run TestVision
      - go build ./...

  - id: step-6
    title: Compaction image handling
    depends_on: [step-1]
    scope: |
      Update compaction logic to drop ImageBlock data from messages being compacted,
      replacing with text marker "[image was attached]" appended to Content.
    files:
      - internal/agent/compaction.go
      - internal/agent/compaction_test.go
    constraints:
      - Images field set to nil after compaction
      - Text marker appended to existing Content (not replacing)
      - Marker format exactly "[image was attached]"
    acceptance:
      - Compacted messages have nil Images
      - Compacted messages contain "[image was attached]" in Content
      - Messages without images unaffected
    verification:
      - go test ./internal/agent/ -run TestCompaction
      - go build ./...
    parallel_group: post-pipeline

  - id: step-7
    title: TUI image placeholder display
    depends_on: [step-1]
    scope: |
      Update TUI content rendering to detect ImageBlock in messages and display
      a styled placeholder like "[image: 1024x768 png 234KB]". Handle tool result
      messages that contain images.
    files:
      - internal/tui/model_content.go
      - internal/output/render.go
    constraints:
      - Placeholder format: "[image: WxH format size]"
      - Styled distinctly (dimmed or colored) from regular text
      - Falls back to "[image]" if dimensions unknown
      - Do not attempt to render actual image in terminal
    acceptance:
      - Messages with images show placeholder text
      - Placeholder includes dimensions and size when available
      - Regular messages unaffected
    verification:
      - go test ./internal/tui/ -run TestImage
      - go build ./...
    parallel_group: post-pipeline

  - id: step-8
    title: Documentation and final verification
    depends_on: [step-2, step-3, step-4, step-5, step-6, step-7]
    scope: |
      Update README.md built-in tools section to document read tool image support.
      Update docs/CONFIGURATION.md with vision field. Run make check.
    files:
      - README.md
      - docs/CONFIGURATION.md
    constraints:
      - Follow documentation maintenance rules from CLAUDE.md
      - Document supported image formats and size limit
      - Document vision config field
    acceptance:
      - README documents image support in read tool
      - CONFIGURATION.md documents vision field
      - make check passes clean
    verification:
      - make check
