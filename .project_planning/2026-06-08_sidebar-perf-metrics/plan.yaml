steps:
  - id: step-1
    title: Extend ModelCallFinishedEvent with timing fields
    scope: |
      Add DurationMs, TTFTMs, and OutputTPS fields to the event payload struct
      and update the constructor to accept and populate them.
    files:
      - internal/output/event_types.go
      - internal/output/event_constructors.go
    constraints:
      - Keep existing constructor callers compiling — add new params at the end
      - JSON field names: duration_ms, ttft_ms, output_tps
      - Use int64 for milliseconds, float64 for tokens/sec
      - Zero values mean "not available"
    acceptance:
      - ModelCallFinishedEvent has DurationMs int64, TTFTMs int64, OutputTPS float64
      - NewModelCallFinishedEvent accepts and populates all three
    verification:
      - go build ./internal/output/...

  - id: step-2
    title: Capture timing in model call execution path
    depends_on: [step-1]
    scope: |
      Record wall-clock start time before performModelCall, capture first-chunk
      time during streaming, compute duration/TTFT/TPS at the end, and pass
      them to NewModelCallFinishedEvent. For non-streaming (ChatCompletion),
      TTFT equals total duration.

      In consumeModelStream, add a firstChunkTime *time.Time out-param that gets
      set on the first content or thinking chunk. Thread it back to executeModelCall.

      Update all call sites of NewModelCallFinishedEvent in turn_progression.go
      (success path, error paths, cancellation path) — error/cancel paths pass zeros.
    files:
      - internal/agent/turn_progression.go
      - internal/agent/model_call.go
    constraints:
      - time.Now() calls only — no external clock dependency
      - consumeModelStream signature change must not break callers
      - Keep token count logic unchanged
      - TTFT for non-streaming = duration (single response, no chunks)
      - OutputTPS = completionTokens / durationSeconds; zero if duration is zero or tokens unavailable
    acceptance:
      - Streaming path captures start, first-chunk, and end times
      - Non-streaming path captures start and end times, TTFT = duration
      - ModelCallFinishedEvent carries correct DurationMs, TTFTMs, OutputTPS
    verification:
      - go test ./internal/agent/... -run TestWrapCommand
      - go test ./internal/agent/...

  - id: step-3
    title: Add performance section to TUI sidebar
    depends_on: [step-1]
    scope: |
      Add perfDurationMs, perfTTFTMs, perfOutputTPS fields to sidebarState.
      Add performanceSection() to sidebar_sections.go rendering duration, ttft,
      and tps as card fields. Insert between model and context sections in
      staticLines(). Handle the "no data yet" state (show "—" values).

      In model_events.go, update the ModelCallFinishedEvent case to populate the
      new sidebar fields from the event payload.
    files:
      - internal/tui/sidebar.go
      - internal/tui/sidebar_sections.go
      - internal/tui/model_events.go
    constraints:
      - Section only renders when at least one metric is non-zero (hide before first call)
      - Format duration and TTFT as human-friendly (e.g. "1.2s", "340ms")
      - Format TPS as "42.1 t/s"
      - Respect sidebar width constraints via fitText
    acceptance:
      - Sidebar shows "performance" section after first model call
      - Values update on each subsequent ModelCallFinishedEvent
      - Section hidden before any model call
    verification:
      - go build ./internal/tui/...
      - go test ./internal/tui/...

  - id: step-4
    title: Update existing tests and add new tests
    depends_on: [step-1, step-2, step-3]
    scope: |
      Fix all existing test call sites of NewModelCallFinishedEvent to pass the
      three new zero-valued timing params.

      Add tests for:
      - Event constructor populates timing fields correctly
      - Sidebar performance section renders expected output
      - Sidebar performance section hidden when all metrics zero
      - Duration/TTFT formatting helper
      - TPS formatting
    files:
      - internal/output/event_constructors_test.go (if exists, else event_types_test.go)
      - internal/agent/turn_progression_test.go
      - internal/agent/runner_test.go
      - internal/tui/sidebar_test.go (or sidebar_sections_test.go)
      - internal/tui/content_test.go
    constraints:
      - Table-driven tests per Go conventions
      - Do not break existing test assertions — only extend
    acceptance:
      - All existing tests pass with updated signatures
      - New tests cover timing capture and display
    verification:
      - go test ./internal/agent/... ./internal/output/... ./internal/tui/...
      - make check
