stages:
  - id: stage-1
    objective: Registry cloning and delegate tool wiring in the runner
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: Add Clone() to tool.Registry and wire delegate tool into cliRunner.Run()
        scope: |
          1. Add Clone() method to tool.Registry that deep-copies all ToolDefs.
          2. Export DelegateToolName constant from internal/delegation/tool.go (rename delegateToolName to DelegateToolName).
          3. In cmd/steiner/runner.go cliRunner.Run(): after provider and events are ready, check r.runtime.cfg.SubAgent.Enabled. When true:
             a. Clone r.runtime.registry
             b. Create delegation.DelegateHandlerDeps with current provider, cloned registry, cfg.SubAgent, events, agent.NewRunner(), workDir
             c. Call delegation.NewDelegateHandler(deps) to get the handler
             d. Register delegation.DelegateToolDef(handler) on the cloned registry
             e. Use cloned registry for executor construction and Tools field in RunRequest
             When false: use r.runtime.registry directly as today (zero overhead path).
          4. Add import of internal/delegation in runner.go.
          5. Unit tests for Registry.Clone() in internal/tool/registry_test.go.
          6. Unit tests for delegate wiring in cmd/steiner/runner_test.go: verify delegate tool present when enabled, absent when disabled.
        files:
          - internal/tool/registry.go
          - internal/tool/registry_test.go
          - internal/delegation/tool.go
          - internal/delegation/tool_test.go
          - cmd/steiner/runner.go
          - cmd/steiner/runner_test.go
        constraints:
          - Do not modify runtimeRegistry() or runtimeRegistryWithSink() in tools.go — base registry stays clean
          - Do not change any delegation contract structs
          - Clone() must deep-copy ParameterSchema maps to prevent cross-registry mutation
          - The delegate tool must use config.ApprovalModeAuto (already set in DelegateToolDef)
          - When sub_agent.enabled is false, the code path must not import or call any delegation functions at runtime (the import is fine, just don't execute)
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: sonnet
        outputs:
          - internal/tool/registry.go with Clone() method
          - internal/delegation/tool.go with exported DelegateToolName
          - cmd/steiner/runner.go with delegate wiring block
          - Tests passing for all three packages
        acceptance:
          - Registry.Clone() returns independent copy; mutating clone does not affect original
          - When sub_agent.enabled=true, RunRequest.Tools includes "delegate" in the tool specs
          - When sub_agent.enabled=false, RunRequest.Tools does not include "delegate"
          - Delegate handler receives correct DelegateHandlerDeps fields
          - go build ./... succeeds
          - go test ./internal/tool/... passes
          - go test ./cmd/steiner/... passes
          - go test ./internal/delegation/... passes (existing tests still pass with exported constant)
        handoff: |
          Add Clone() to tool.Registry. Export DelegateToolName from delegation/tool.go.
          In cmd/steiner/runner.go cliRunner.Run(), after provider/events setup and before executor
          creation: when cfg.SubAgent.Enabled, clone registry, create DelegateHandlerDeps, create
          handler via NewDelegateHandler, register DelegateToolDef on clone, use clone for executor
          and RunRequest.Tools. When disabled, use registry as-is. Add tests for Clone() and wiring.
          Read runner.go lines 33-123 carefully — the delegate wiring block goes after the events
          MultiSink (line 101) and before the executor creation (line 102). The cloned registry
          replaces r.runtime.registry in both the NewExecutor call and the ToProviderSpecs call.
        verification:
          - gofmt -w internal/tool/registry.go internal/delegation/tool.go cmd/steiner/runner.go
          - go test ./internal/tool/... -run TestClone
          - go test ./cmd/steiner/... -run TestDelegate
          - go test ./internal/delegation/...
          - go build ./...

  - id: stage-2
    objective: End-to-end delegation integration tests
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: Add integration tests proving delegation works through the full wiring path
        scope: |
          1. In internal/delegation/integration_test.go, add tests that exercise the full path:
             a. TestEndToEndDelegation: fake provider returns a tool_call for "delegate" with a task,
                then the child provider returns a text response, then the parent provider returns a
                final text response incorporating the child result. Verify parent conversation does
                not contain child internal messages. Verify DelegationResult fields.
             b. TestNestingPrevention: verify that when a child agent's provider returns a tool_call
                for "delegate", the child executor returns an error (tool not found). The child should
                still complete with the error surfaced.
             c. TestParentContextIsolation: after delegation, verify parent conversation length is
                bounded — the child's multi-turn tool chatter does not appear in parent messages.
             d. TestConfigGatingDisabled: when SubAgentConfig.Enabled=false, verify delegate tool
                is not in the registry and model cannot call it.
          2. These tests use fake providers with scripted responses, not live LLM calls.
          3. Tests should use agent.NewRunner() directly with hand-built RunRequests that mirror
             what cliRunner.Run() would construct, including the cloned registry with delegate tool.
        files:
          - internal/delegation/integration_test.go
        constraints:
          - Do not modify any production code in this step
          - Use the existing fakeProvider pattern from the current integration_test.go
          - Tests must not require network access
          - Keep test helpers DRY with existing helpers in the file
        depends_on:
          - stage-1-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: sonnet
        outputs:
          - Expanded integration_test.go with 4 new test functions
        acceptance:
          - TestEndToEndDelegation passes — parent receives child result, child transcript absent from parent
          - TestNestingPrevention passes — child cannot call delegate tool
          - TestParentContextIsolation passes — parent conversation length bounded
          - TestConfigGatingDisabled passes — no delegate tool when disabled
          - go test ./internal/delegation/... passes (all existing + new tests)
        handoff: |
          Add four integration tests to internal/delegation/integration_test.go. Use existing
          fakeProvider and helper patterns. TestEndToEndDelegation: script provider to return
          delegate tool_call from parent, text from child, final text from parent. Verify result.
          TestNestingPrevention: child provider returns delegate tool_call, verify error.
          TestParentContextIsolation: child does multi-turn with tool calls, verify parent
          conversation excludes child internals. TestConfigGatingDisabled: build registry without
          delegate when config disabled. Read existing integration_test.go for patterns.
        verification:
          - gofmt -w internal/delegation/integration_test.go
          - go test ./internal/delegation/... -v -run "TestEndToEnd|TestNesting|TestParentContext|TestConfigGating"

  - id: stage-3
    objective: TUI delegation rendering with spinner, compact results, and collapsible output
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: Implement full-polish delegation rendering in TUI content pane
        scope: |
          1. Add delegation tracking state to content buffer or model:
             - activeDelegations map: agentID → delegationDisplayState{startTime, taskPreview, spinnerFrame}
             - spinnerFrames: simple dot animation ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"] or similar
             - collapsedDelegations set: agentID → bool (whether output is collapsed)

          2. Rework formatDelegationEvent in content.go:
             - DelegationStarted: render bordered muted block header:
               "⟩ delegate <agentID>" with task preview on next line (truncated to ~80 chars)
               Use theme border + muted styles.
             - DelegationComplete: render compact result block:
               "✓ delegate <agentID> — <status> (<N> turns, <M> tokens, <elapsed>)"
               If result output non-empty, render collapsible output section below
               (collapsed by default, show "[output hidden, press <key> to expand]")
             - DelegationFailed: render error block:
               "✗ delegate <agentID> — failed: <error>" in error/warning style

          3. Add spinner tick mechanism:
             - In model.go, when activeDelegations is non-empty, return a tick Cmd (200ms interval)
             - On tick, advance spinner frame for all active delegations, trigger re-render
             - Stop ticking when no active delegations remain

          4. Add elapsed time tracking:
             - On DelegationStarted, record time.Now() for the agentID
             - On DelegationComplete/Failed, compute elapsed = now - startTime
             - During active state, show live elapsed in spinner line

          5. Add expand/collapse keybind:
             - Ctrl+D or similar to toggle delegation output visibility
             - When multiple delegations exist, toggle the most recent one
             - Update keys.go with the new binding
             - Update help overlay if one exists

          6. Update content_events.go appendDelegationEvent:
             - On Started: add to activeDelegations, append start block
             - On Complete: remove from activeDelegations, append result block with output
             - On Failed: remove from activeDelegations, append error block

          7. Tests:
             - Test spinner frame advancement
             - Test elapsed time display formatting
             - Test collapsed/expanded output toggle
             - Test delegation block formatting for all three event types
             - Update existing delegation content tests if rendering format changed
        files:
          - internal/tui/content.go
          - internal/tui/content_events.go
          - internal/tui/model.go
          - internal/tui/keys.go
          - internal/tui/content_test.go
        constraints:
          - Use theme styles for all colours — no hardcoded hex values
          - Spinner must not leak goroutines — use Bubble Tea tick Cmd pattern
          - Do not break existing content buffer scroll/append behaviour
          - Delegation blocks must be visually subordinate to assistant prose (muted style)
          - Keep delegation output collapsed by default to avoid context pollution in the visual flow
          - Preserve all existing test assertions that still apply (update expected strings if format changed)
        depends_on:
          - stage-1-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: sonnet
        outputs:
          - Enhanced delegation rendering in content.go and content_events.go
          - Spinner tick mechanism in model.go
          - Expand/collapse keybind in keys.go
          - Updated and new tests in content_test.go
        acceptance:
          - DelegationStarted renders bordered muted block with task preview
          - Active delegation shows spinner animation with elapsed time
          - DelegationComplete shows compact result with turn count, tokens, elapsed
          - DelegationFailed shows error-styled block
          - Delegation output is collapsed by default, expandable via keybind
          - Spinner ticks stop when no delegations are active
          - No goroutine leaks from spinner
          - All existing TUI tests pass (with updated expectations where format changed)
          - go test ./internal/tui/... passes
        handoff: |
          Implement full delegation rendering in TUI. Read internal/tui/content.go (formatDelegationEvent
          around line 65), content_events.go (appendDelegationEvent around line 213), model.go for tick
          patterns, and keys.go for keybind patterns. Add activeDelegations tracking state. Rework
          formatDelegationEvent for bordered blocks with task preview, spinner, compact results.
          Add tick Cmd in model.go Update method for spinner animation. Add Ctrl+D keybind for
          expand/collapse. Use theme styles from the existing theme system (look at how tool blocks
          and thinking blocks are styled for reference). Update content_test.go — existing delegation
          tests will need updated expected strings since rendering format is changing.
        verification:
          - gofmt -w internal/tui/content.go internal/tui/content_events.go internal/tui/model.go internal/tui/keys.go
          - go test ./internal/tui/... -run "Delegation"
          - go test ./internal/tui/...
          - go build ./...
