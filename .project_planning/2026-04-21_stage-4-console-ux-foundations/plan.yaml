stages:
  - id: stage-1
    objective: Establish the Stage 4 console contract and rendering foundation without changing agent or provider semantics.
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: Introduce an explicit terminal output contract and richer renderer foundation in internal/output.
        scope: Own the terminal-facing output model for assistant, status, tool, approval, and error traffic, while preserving the existing event model as the canonical runtime path.
        files:
          - internal/output/log.go
          - internal/output/stream.go
          - internal/output/debug.go
          - internal/output/file_log.go
          - internal/output/stream_test.go
          - internal/output/*.go
        constraints:
          - Do not change prompt assembly, agent loop semantics, or provider responsibilities.
          - Do not bypass the event model; richer rendering must consume existing events or thin output-layer wrappers around them.
          - Keep approvals and truncation details explicit and easy to scan.
          - Default to a strong dark theme, but degrade safely on non-TTY or lower-capability terminals.
          - Avoid introducing a full TUI state/render loop.
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Output-layer types or conventions for distinct terminal channels.
          - Streaming-capable assistant rendering primitives.
          - Improved approval/tool/status formatting and theme tokens.
          - Updated output tests covering formatting and incremental rendering behavior.
        acceptance:
          - The output package can render assistant replies separately from status/event output.
          - Streaming/incremental rendering is possible without corrupting terminal state assumptions at the output boundary.
          - Approval rendering surfaces tool, action, and key arguments clearly.
          - Existing logging/diagnostic paths remain compatible with the richer renderer design.
        handoff: Implement the output contract and renderer primitives first so the REPL work can integrate against a stable terminal-facing boundary.
        verification:
          - go test ./internal/output
          - go test ./cmd/steiner ./internal/output ./internal/repl

  - id: stage-2
    objective: Replace the line-buffered interactive input loop with a real prompt/input layer that fits the new rendering contract.
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: Rework internal/repl to use a line-editing prompt abstraction with history, cursor movement, and completion preservation.
        scope: Own interactive prompt behavior, prompt refresh coordination, and command/help/history behavior in internal/repl without altering command semantics.
        files:
          - internal/repl/repl.go
          - internal/repl/commands.go
          - internal/repl/completer.go
          - internal/repl/repl_test.go
          - internal/repl/*.go
          - go.mod
          - go.sum
        constraints:
          - Prefer a lightweight prompt library approach over a full TUI framework.
          - Preserve built-in command parsing, skill toggling, and completion expectations unless the approved overview requires a narrow UX contract change.
          - Keep Stage 4 history scope minimal; do not add broader persistence semantics unless directly required by the chosen prompt library integration.
          - Prompt refresh ownership must stay in the REPL/output boundary, not in provider code.
        depends_on:
          - stage-1-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Real terminal input handling with editing, cursor motion, and history navigation.
          - Preserved or improved completion behavior for commands and skills.
          - REPL tests updated for command semantics and any testable prompt coordination logic.
          - Dependency additions required for the chosen prompt library.
        acceptance:
          - Interactive mode no longer depends on a basic ReadString newline loop.
          - History navigation and cursor movement work through the prompt abstraction.
          - Prompt behavior remains compatible with rendered assistant/status output during interactive sessions.
          - REPL command/help/tool/skill flows remain behaviorally correct.
        handoff: Integrate the chosen prompt library into the existing session loop while keeping command semantics stable and exposing only the minimum new abstractions needed.
        verification:
          - go test ./internal/repl
          - go test ./cmd/steiner ./internal/repl ./internal/output

  - id: stage-3
    objective: Wire the richer console behavior through the CLI entrypoints and finish the Stage 4 validation surface.
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: Integrate the richer REPL and renderer into interactive and exec flows, then finalize Stage 4 verification coverage.
        scope: Own cmd/steiner interactive wiring, output stream composition, and final cross-package tests needed to make Stage 4 execution-ready.
        files:
          - cmd/steiner/main.go
          - cmd/steiner/main_test.go
          - internal/repl/repl.go
          - internal/output/stream.go
          - internal/output/log.go
          - cmd/steiner/*.go
        constraints:
          - Keep --exec readable and deterministic even if it uses a simpler non-interactive rendering mode.
          - Do not introduce architecture changes outside Stage 4 console UX scope.
          - Maintain predictable behavior on constrained setups and non-interactive outputs.
          - Keep changes aligned with the approved verification strategy and end-of-implementation checks.
        depends_on:
          - stage-2-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Updated CLI wiring for interactive and exec console paths.
          - Integration-style coverage for streamed vs non-streamed rendering and approval visibility.
          - Final Stage 4-ready console UX path consistent with the approved overview.
        acceptance:
          - Interactive sessions clearly distinguish assistant replies, approvals, tool activity, and status output.
          - Exec mode remains coherent and does not inherit prompt-management complexity unnecessarily.
          - Cross-package tests cover the Stage 4 path well enough for review and execution handoff.
          - The implementation satisfies the approved Stage 4 spec softening without leaking terminal concerns into provider code.
        handoff: Finish the CLI integration only after output and REPL contracts are stable, then run the repo-relevant validation set to leave a reviewable Stage 4 slice.
        verification:
          - go test ./cmd/steiner ./internal/repl ./internal/output
          - go vet ./...
          - go test ./...
          - go build ./cmd/steiner ./cmd/steiner-core-tools
