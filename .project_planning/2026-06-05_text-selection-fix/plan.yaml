steps:
  - id: step-1
    title: Fix frame height overflow with MaxHeight
    scope: |
      Add MaxHeight(m.height) to renderMainColumn's final style in model_view.go
      so the frame is clamped to the terminal height. This prevents the alternate
      screen buffer from scrolling and fixes the mouse Y coordinate offset.
    files:
      - internal/tui/model_view.go
    constraints:
      - Only add MaxHeight to the existing style chain — no other changes to renderMainColumn
      - lipgloss MaxHeight truncates from the bottom, which is acceptable (status bar hidden at extreme sizes)
    acceptance:
      - Frame output from renderMainColumn never exceeds m.height lines
      - screenLines always has exactly m.height entries
      - Text selection works correctly at any terminal height
    verification:
      - go test ./internal/tui/ -run TestView
      - go test ./internal/tui/ -run TestLayout
      - go test ./internal/tui/ -run TestSelection

  - id: step-2
    title: Fix off-by-one line counting in syncViewport and content_render
    scope: |
      Fix contentLines counting in syncViewport (model_layout.go:50) from
      strings.Count(rendered, "\n") to strings.Count(rendered, "\n") + 1.
      Fix segmentHeights counting in content_render.go (lines 27, 37) the same way.
      This restores correct contentTopPad, fixes always-visible scrollbar,
      and fixes segment click targeting.
    files:
      - internal/tui/model_layout.go
      - internal/tui/content_render.go
    constraints:
      - Only change the line-counting expressions — no logic changes
      - Verify the ContentPane path (no scrollbar) is now reachable when content fits
    acceptance:
      - contentTopPad equals viewport.Height minus actual content lines (not off by 1)
      - Scrollbar only shows when content exceeds viewport height
      - segmentHeights reflect actual rendered line count per segment
    verification:
      - go test ./internal/tui/ -run TestSync
      - go test ./internal/tui/ -run TestContent
      - go test ./internal/tui/ -run TestSegment

  - id: step-3
    title: Add tests for frame height clamping and selection at small heights
    scope: |
      Add table-driven tests verifying:
      1. renderMainColumn output never exceeds m.height lines at various heights (including edge cases where viewport.Height clamps to 1)
      2. screenLines has exactly m.height entries after View() at small terminal sizes
      3. Selection coordinates map correctly when terminal height is small
      4. contentTopPad is correct (no off-by-one) for various content sizes
      5. Scrollbar is hidden when content fits within viewport
    files:
      - internal/tui/model_test.go
    constraints:
      - Use table-driven tests
      - Test at heights 5, 8, 10, 15, 24, 40 to cover clamped and unclamped cases
      - Test with both single-line and multi-line input
    acceptance:
      - All new tests pass
      - Tests cover the specific scenario from issue #121
    verification:
      - go test ./internal/tui/ -run TestFrameHeight
      - go test ./internal/tui/ -run TestSelectionSmallHeight

  - id: step-4
    title: Final verification
    scope: |
      Run make check to ensure all linting, vetting, and tests pass.
      Format all changed files.
    files: []
    constraints:
      - No code changes — verification only
    acceptance:
      - make check passes
      - No regressions
    verification:
      - gofmt -w internal/tui/model_view.go internal/tui/model_layout.go internal/tui/content_render.go internal/tui/model_test.go
      - goimports -w internal/tui/model_view.go internal/tui/model_layout.go internal/tui/content_render.go internal/tui/model_test.go
      - make check
