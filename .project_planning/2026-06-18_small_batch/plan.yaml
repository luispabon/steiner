steps:
  - id: step-1
    title: "Broaden isTextLikeContentType for fetch_url (#221)"
    scope: |
      Change isTextLikeContentType in internal/tool/builtin/fetch_url_image.go to accept
      all text/* via prefix match, plus common application text types: application/javascript,
      application/typescript, application/yaml, application/x-yaml, application/ld+json,
      application/graphql, application/x-www-form-urlencoded. Update tests in
      fetch_url_test.go to cover new accepted and still-rejected types.
    files:
      - internal/tool/builtin/fetch_url_image.go
      - internal/tool/builtin/fetch_url_test.go
    constraints:
      - Do not change fetch_url.go routing logic — only the helper function
      - Binary application/* types (pdf, zip, octet-stream, video/*, audio/*) must still be rejected
      - Keep the function comment accurate
    acceptance:
      - isTextLikeContentType("text/csv") returns true
      - isTextLikeContentType("text/calendar") returns true
      - isTextLikeContentType("application/javascript") returns true
      - isTextLikeContentType("application/yaml") returns true
      - isTextLikeContentType("application/ld+json") returns true
      - isTextLikeContentType("application/pdf") returns false
      - isTextLikeContentType("video/mp4") returns false
      - Existing true cases still pass
    verification:
      - go test ./internal/tool/builtin/... -run TestFetchURL
      - gofmt -w internal/tool/builtin/fetch_url_image.go

  - id: step-2
    title: "Show provider name in sidebar (#220)"
    scope: |
      Thread provider name (config map key) from cmd/steiner through tui.Config into
      sidebarState. Add ProviderName string field to tui.Config, modelProviderNames
      map[string]string to Model, and providerName string to sidebarState. Build the
      modelProviderNames map in cmd/steiner/model.go (parallel to modelBaseURLs). Update
      sidebar_sections.go modelSection to render label "provider" with the provider name,
      falling back to stripProviderURL if no name available. Update applyModelSelection
      and syncSidebar. Update tests.
    files:
      - cmd/steiner/model.go
      - cmd/steiner/interactive_session.go
      - internal/tui/app.go
      - internal/tui/model.go
      - internal/tui/model_init.go
      - internal/tui/model_input.go
      - internal/tui/model_update.go
      - internal/tui/sidebar.go
      - internal/tui/sidebar_sections.go
      - internal/tui/sidebar_sections_test.go
      - internal/tui/model_test.go
    constraints:
      - Keep stripProviderURL as fallback when providerName is empty
      - Do not change sidebar_context.go (stripProviderURL stays for fallback use)
      - Mirror the modelBaseURLs pattern exactly for modelProviderNames
    acceptance:
      - Sidebar shows "provider" label (not "host")
      - Value is the config map key name (e.g. "anthropic", "ollama")
      - Falls back to stripped URL when provider name unavailable
      - Model switching updates the provider name
    verification:
      - go test ./internal/tui/... -run "TestSidebar|TestModel"
      - gofmt -w internal/tui/sidebar_sections.go internal/tui/model.go internal/tui/model_init.go

  - id: step-3
    title: "Bump textarea MaxHeight to 30 (#219)"
    no_delegate: true
    scope: |
      Change input.MaxHeight from 10 to 30 in internal/tui/model_init.go:73.
      Update any test that asserts MaxHeight = 10.
    files:
      - internal/tui/model_init.go
      - internal/tui/model_test.go
    constraints:
      - Single line change plus test update if needed
    acceptance:
      - input.MaxHeight == 30 in newModelInput()
      - ALT+ENTER can create newlines beyond 12 lines
    verification:
      - go test ./internal/tui/... -run TestModel
      - gofmt -w internal/tui/model_init.go
