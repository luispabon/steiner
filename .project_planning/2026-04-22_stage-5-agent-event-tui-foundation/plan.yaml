stages:
  - id: stage-1
    objective: Establish the Stage 5 event boundary and preserve `--exec` output through a dedicated plain renderer.
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: Expand the typed output event model and extract the current stream renderer into a standalone plain renderer/subscriber without changing `--exec` behavior.
        scope: Own the `internal/output` event contract, subscriber seam, and plain-rendering regression baseline before any TUI work begins.
        files:
          - internal/output/log.go
          - internal/output/events.go
          - internal/output/plain.go
          - internal/output/stream.go
          - internal/output/file_log.go
          - internal/output/stream_test.go
          - internal/output/*test.go
        constraints:
          - Keep the event interface renderer-agnostic; do not encode Bubble Tea types into `internal/output`.
          - Preserve existing event types and compatibility paths while adding the Stage 5 event set.
          - Treat plain renderer output equivalence as the regression gate for `--exec`.
          - Do not modify interactive-mode wiring or delete `internal/repl/` in this step.
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Expanded typed event constants, payload structs, and constructor helpers covering Stage 5 runtime events.
          - A subscriber/event-stream seam usable by both the plain renderer and the future TUI bridge.
          - A dedicated plain renderer extracted from the current stream implementation.
          - Focused renderer tests and at least one golden-style baseline that protects current `--exec` formatting.
        acceptance:
          - `internal/output` exposes a clear subscriber/event-stream boundary that does not depend on UI packages.
          - The plain renderer can consume emitted events and reproduce current terminal output behavior for `--exec`.
          - Existing file logging still works against the updated event model.
          - Output tests clearly fail on regressions in plain renderer behavior.
        handoff: Build the Stage 5 event model and plain renderer first, and leave the package as the stable contract that later steps consume unchanged where possible.
        verification:
          - go test ./internal/output ./cmd/steiner

      - id: stage-1-step-2
        objective: Refactor runtime execution paths to emit structured events only, and introduce the approval-response seam needed for both plain and TUI modes.
        scope: Own agent-loop, provider, tool-execution, and CLI approval plumbing changes required to remove runtime terminal writes and support a blocked approval request/resume flow.
        files:
          - internal/agent/loop.go
          - internal/agent/events.go
          - internal/agent/*test.go
          - internal/provider/openai_compat.go
          - internal/provider/*test.go
          - internal/tool/executor.go
          - internal/tool/types.go
          - internal/tool/*test.go
          - cmd/steiner/main.go
          - cmd/steiner/main_test.go
        constraints:
          - Do not let `internal/agent` or `internal/tool` depend on TUI code.
          - Approval handling must become an explicit request/response contract, not reused REPL stdin prompting.
          - Remove or route away direct stdout/stderr writes from runtime paths in `internal/agent`, `internal/provider`, and `internal/tool`.
          - Keep `--exec` functional through the plain renderer path while interactive mode is still using the old REPL or temporary compatibility wiring.
        depends_on:
          - stage-1-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Agent loop emits the Stage 5 event set for streaming, tool lifecycle, context updates, limits, completion, and errors.
          - Provider streaming deltas are surfaced through runtime events instead of ad hoc terminal output.
          - Tool execution emits approval and execution lifecycle events and can block on an explicit approval response mechanism.
          - Runtime tests cover approval flow and no-direct-write expectations for touched paths.
        acceptance:
          - Runtime execution paths no longer rely on direct terminal writes for user-visible progress.
          - Approval prompts can be represented as events and resumed with a response object/channel path.
          - `--exec` still works against the refactored event pipeline before the TUI exists.
          - Focused tests cover the approval redesign and streamed event emission.
        handoff: Leave behind a stable runtime event pipeline and approval contract that the TUI can consume without further architecture changes.
        verification:
          - go test ./internal/agent ./internal/provider ./internal/tool ./cmd/steiner

  - id: stage-2
    objective: Replace the interactive REPL with a minimal Bubble Tea TUI built on the new event stream.
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: Implement the minimal TUI package with event-to-Tea bridging, viewport-backed content, single-line input, status bar, and approval mode.
        scope: Own the new `internal/tui` package and its internal components, including the Bubble Tea model, event bridge, scroll behavior, resize handling, and interactive command handling.
        files:
          - internal/tui/app.go
          - internal/tui/model.go
          - internal/tui/content.go
          - internal/tui/input.go
          - internal/tui/statusbar.go
          - internal/tui/keys.go
          - internal/tui/*test.go
          - go.mod
          - go.sum
        constraints:
          - Keep the TUI model minimal: content buffer, viewport state, input state, status state, approval state, dimensions, and run state only.
          - Use Bubble Tea as the UI boundary; domain code must not depend on `tea.Msg`.
          - Stay within Stage 5 scope: plain streamed text only, no markdown, no sidebar, no theme system, no multiline input, no completion, no clickable mouse interactions.
          - Startup/shutdown ordering must avoid `Program.Send` deadlocks before program start and must shut down cleanly on `/exit`, ctrl+c, or run completion.
        depends_on:
          - stage-1-step-2
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - New `internal/tui` package with Bubble Tea and Lip Gloss dependencies added.
          - Event-to-Tea bridge for consuming runtime events from a background agent loop.
          - Scrollable content pane with auto-scroll and user scroll-lock behavior.
          - Single-line input area supporting built-in slash commands, skill toggles, and approval mode.
          - Bottom status bar showing model, turn, context, and keybind hints.
        acceptance:
          - The TUI can launch, receive streamed events, render content, accept input, and handle approvals.
          - Resize handling reflows layout correctly and preserves sensible viewport behavior.
          - Scroll wheel and keyboard scrolling work in the content pane without expanding mouse scope.
          - TUI tests cover event bridging, basic input dispatch, approval mode transitions, and resize behavior.
        handoff: Deliver a self-contained `internal/tui` package that can replace interactive REPL mode once CLI wiring is switched over.
        verification:
          - go test ./internal/tui

      - id: stage-2-step-2
        objective: Switch interactive mode to the TUI, remove the old REPL package, and finish Stage 5 verification and enforcement.
        scope: Own CLI mode selection, final runtime wiring, REPL removal, dependency cleanup, and broad regression validation for both interactive and `--exec` paths.
        files:
          - cmd/steiner/main.go
          - cmd/steiner/main_test.go
          - internal/repl/**
          - internal/output/**
          - internal/tui/**
          - go.mod
          - go.sum
        constraints:
          - Do not remove `internal/repl/` until the TUI path covers command handling and approval prompts.
          - Keep `--exec` on the plain renderer path; do not route it through the TUI as the primary implementation.
          - Enforce the no-direct-writes rule for runtime packages and leave only approved output entry points.
          - Finish with repo-wide verification appropriate to the touched surface.
        depends_on:
          - stage-2-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Interactive CLI path launches the Bubble Tea TUI instead of `internal/repl`.
          - `internal/repl/` removed and `go-readline-ny` dropped from module dependencies.
          - Final regression tests for `--exec`, interactive behavior, approval flow, and no-direct-write enforcement.
          - Stage 5 build/test state validated against repo commands.
        acceptance:
          - Interactive mode no longer imports or depends on `internal/repl`.
          - `--exec` behavior remains stable via the plain renderer.
          - No remaining direct stdout/stderr writes exist in runtime packages outside intended output/log entry points.
          - Repo-wide build and test commands pass for the completed change.
        handoff: Finalize the Stage 5 cutover by wiring the TUI into `cmd/steiner`, deleting the old REPL path, and proving the result with broad validation.
        verification:
          - go test ./...
          - go build ./...
          - make build-binaries
