steps:
  - id: step-1a
    title: Decouple sandbox writable-root from agent workDir; parameterize workDir + model
    scope: >
      Make run construction accept an explicit agent workDir and model alias, and
      crucially decouple the sandbox writable-root from that workDir. The sandbox
      writable-root must remain the project root (so the shared parent .git -
      .git/worktrees/<id> and .git/objects - stays writable and git commit/status
      work inside a worktree subdir), while the agent's operational workDir (prompt
      paths, path policy, tool cwd) can point at the worktree. Keep exec and
      interactive behaviour byte-for-byte unchanged.
    files:
      - cmd/steiner/runtime.go
      - cmd/steiner/runtime_build.go
      - cmd/steiner/runner_run.go
      - cmd/steiner/tools.go
      - internal/sandbox/mounts.go
      - internal/sandbox/sandbox.go
    constraints:
      - Sandbox writable-root stays the project root; agent workDir may be a subdir (the worktree).
      - git commit and git status must succeed in a worktree subdir under the sandbox.
      - Existing exec/interactive paths keep workDir = os.Getwd() and selected model; their tests pass unchanged.
      - discoverRuntimeSkills / project-context discovery must use the intended root explicitly, not an implicit os.Getwd().
    acceptance:
      - A run can be constructed for an explicit agent workDir + model alias with sandbox writable-root at project root.
      - A sandboxed bash git commit inside a worktree subdir succeeds (test).
      - exec and interactive behaviour is unchanged (existing tests green).
    verification:
      - gofmt -w + goimports -w on touched files
      - go build ./...
      - go test ./cmd/steiner/... ./internal/sandbox/...

  - id: step-1b
    title: PhaseRunner factory rebinding registry/executor/sandbox/prompt/advisor per phase
    scope: >
      Define the PhaseRunner consumer interface in internal/oneshot and implement it
      in cmd/steiner. The factory builds and executes one phase run given (agent
      workDir, model alias, seed conversation, approver, steer channel, per-phase
      AdvisorConfig override, parent interrupt context) and returns the result +
      session lineage. It encapsulates registry/executor/sandbox/prompt/advisor
      rebinding so internal/oneshot never imports cmd/steiner. The phase run must
      NOT install its own signal handler (it takes the orchestrator's child context).
    files:
      - cmd/steiner/runner.go
      - cmd/steiner/cmd_oneshot.go
      - internal/oneshot/runner.go
    constraints:
      - No internal -> main imports; PhaseRunner is the boundary.
      - Per-phase AdvisorConfig override (Enabled=true + per-phase budget) is threaded into registry build WITHOUT mutating global cfg.
      - Phase runs use the orchestrator's child context; no per-phase signal.NotifyContext.
      - Reset package-level run state (e.g. fallbackWarningModels) appropriately between phases.
    acceptance:
      - internal/oneshot can execute a phase run via the injected factory with a fresh advisor budget and no own signal handler.
      - Advisor is force-enabled for the phase even when global AdvisorConfig.Enabled is false.
    verification:
      - gofmt -w + goimports -w on touched files
      - go build ./...
      - go test ./cmd/steiner/...
    depends_on: [step-1a]

  - id: step-2
    title: Add oneshot config block (models + auto_pr)
    scope: >
      Introduce an OneShot config struct with a models map (plan/implement/review
      -> alias) and an auto_pr bool. Wire defaults, validation (aliases must exist
      in Config.Models; phase keys constrained), and config patching. Update
      configuration docs. Advisor round caps / per-phase budgets are NOT config in
      this iteration (they are constants in internal/oneshot).
    files:
      - internal/config/config.go
      - internal/config/defaults.go
      - internal/config/validate_runtime.go
      - internal/config/patch.go
      - internal/config/patch_runtime.go
      - internal/config/patch_apply.go
      - docs/CONFIGURATION.md
    constraints:
      - auto_pr defaults to false.
      - Unset phase models fall back to DefaultModel at resolution time, not at load time.
      - Mirror the existing workflow_handoff.models validation pattern.
      - Update docs/CONFIGURATION.md in the same change (CLAUDE.md doc rule for config).
    acceptance:
      - oneshot.models and oneshot.auto_pr parse, default, validate, and patch correctly.
      - Invalid phase aliases produce a clear validation problem.
      - CONFIGURATION.md documents the new block and defaults.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/config/...
    parallel_group: foundations

  - id: step-3
    title: Add run-id/group field to Session model, store, and a group-carrying rotate
    scope: >
      Add a lightweight run-id/group field to session.Session and IndexEntry so the
      three oneshot phase sessions are linkable as one run. Thread it through
      NewSession (option), store Save/Load/index, and Fork. Add a group-carrying
      session-rotation variant (the current interactive RotateSession is
      parameterless) so the orchestrator can stamp each phase's session with the run
      id. Keep backward compatibility with existing saved sessions.
    files:
      - internal/session/session.go
      - internal/session/store.go
      - internal/interactive/actions.go
    constraints:
      - Existing sessions without the field must still load (omitempty / zero value).
      - Do not change ID generation semantics.
      - Add a group-carrying rotate variant rather than overloading the parameterless RotateSession.
    acceptance:
      - Sessions persist with a group/run id and round-trip; the index lists the group.
      - A group-carrying rotation stamps a new session with a supplied run id.
      - Pre-existing session JSON still loads.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/session/...
    parallel_group: foundations

  - id: step-4
    title: oneshot run identity, manifest, worktree lifecycle, atomic lock
    scope: >
      Create the internal/oneshot foundation (no agent execution). Derive run id +
      feature slug; provision a worktree from origin/main at
      .steiner/worktrees/oneshot-<id> on branch oneshot/<slug>-<id>, running the
      .steiner scaffolding (ensureSteinerProjectDir equivalent) against the worktree
      after add; implement an ATOMIC per-run lock (O_EXCL create) recording owner +
      timestamp, with compare-and-swap stale reclaim; implement the durable run
      manifest (.steiner/oneshot/<id>/run.json) atomic write/update/read; worktree
      cleanup that prunes admin dirs before re-add. Pin planning artifacts to the
      worktree's .steiner/plans/<...> path. Ensure .steiner/worktrees and
      .steiner/oneshot are ignored so they never dirty the tree.
    files:
      - internal/oneshot/identity.go
      - internal/oneshot/worktree.go
      - internal/oneshot/lock.go
      - internal/oneshot/manifest.go
    constraints:
      - Worktrees live under .steiner/worktrees/ in the project root, never /tmp.
      - After git worktree add, verify the directory exists and is on the expected branch; run git worktree prune before re-add; handle a leftover .git/worktrees/<id> admin dir.
      - Lock acquisition is atomic (O_EXCL); stale reclaim is a compare-and-swap against recorded owner/mtime; a live lock blocks a second run.
      - Manifest records run id, slug, task, branch, worktree path, model snapshot, current phase, per-phase status, per-phase session ids, commit milestones; writes are atomic.
      - .steiner/worktrees and .steiner/oneshot are git-ignored within the worktree checkout.
    acceptance:
      - A run provisions a verified worktree + branch + scaffolding, takes an atomic lock, writes a manifest, and cleans up (including prune).
      - Concurrent runs get distinct ids/branches/worktrees and never collide; two provisioners racing one id is safe.
      - Stale locks reclaim via CAS; live locks block.
      - Manifest round-trips and updates atomically; tree-clean is unaffected by .steiner writes.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/oneshot/...
    parallel_group: foundations

  - id: step-5
    title: Autonomous phase prose (plan / implement / review)
    scope: >
      Author the embedded autonomous phase prompts for plan, implement, and review,
      distinct from skills/*/SKILL.md. Encode: no user-approval gates; no clarifying
      questions; bounded recorded assumptions; commit-per-validated-unit driven by
      the model; sub-agents work directly in the shared worktree (no per-step
      worktrees); advisor as a loop driver in plan and review and point-consult in
      implement; review drives all blocking + non-blocking findings to resolution;
      phase-completion contract. Provide embed + loader.
    files:
      - internal/oneshot/prompts/plan.md
      - internal/oneshot/prompts/implement.md
      - internal/oneshot/prompts/review.md
      - internal/oneshot/prompts.go
    constraints:
      - Prose must forbid stop-to-ask and require bounded assumptions recorded for the report.
      - Implement prose directs sub-agents to work in the shared worktree and the model to commit accepted units.
      - Review prose drives all findings (blocking and non-blocking) to green + advisor sign-off within bounds.
      - Prose is orchestrator-internal, not a user slash-command skill.
    acceptance:
      - The three prompts embed and load by phase name.
      - Content invariants (no-gates, commit-per-unit, advisor loops, worktree-direct sub-agents) are asserted by tests.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/oneshot/...
    parallel_group: foundations

  - id: step-6
    title: Phase orchestration loop (re-pointed runtime, advisor, approver, steering, signals, events)
    scope: >
      Implement the engine that drives plan -> implement -> review via the injected
      PhaseRunner. Each phase is a fresh run with the phase prose, an empty
      conversation seeded with task + on-disk artifact pointers, the per-phase model
      from oneshot.models (fallback DefaultModel), the advisor force-enabled with the
      per-phase budget constant, a worktree-scoped auto-approver, and the steer
      channel wired in. The orchestrator owns a single interrupt context (SIGINT ->
      abort current phase, persist manifest, release lock, leave worktree). Enforce
      mechanical boundary contracts (artifacts present; tree clean ignoring
      .steiner) and update the manifest + group-stamp each phase session. Emit a
      unified event stream including phase-transition / phase-indicator events for
      the TUI to consume. Termination bounds (advisor budget + round caps) prevent
      thrashing; residuals are surfaced.
    files:
      - internal/oneshot/orchestrator.go
      - internal/oneshot/phase.go
      - internal/oneshot/approver.go
      - internal/oneshot/boundary.go
      - internal/oneshot/events.go
    constraints:
      - Model context resets between phases; cross-phase state is disk artifacts + git only.
      - Auto-approver is scoped to the worktree; the bash sandbox stays the guardrail.
      - Steering is non-blocking; the run never waits for user input.
      - Advisor is force-enabled per phase via the override; round caps/budgets are the named constants.
      - tree-clean boundary ignores .steiner/; failure stops the run cleanly with manifest intact.
      - The orchestrator owns the only signal handler; phase runs get the child context.
      - Define explicit engine->consumer event types for phase transitions/indicators.
      - No nested sub-agents; the orchestrator is machinery, not an agent.
    acceptance:
      - A full plan->implement->review run executes unattended against a stubbed phase runner.
      - Each phase gets the correct model, fresh context, advisor enabled, and the steer channel.
      - SIGINT mid-run aborts the phase, persists the manifest, and releases the lock.
      - Boundary failures stop cleanly; per-phase sessions are persisted and grouped.
      - Phase-transition events are emitted on the stream.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/oneshot/...
    depends_on: [step-1b, step-2, step-3, step-4, step-5]

  - id: step-7
    title: Final report assembly (success and failure shapes)
    scope: >
      Assemble the structured final report from manifest + git + review outcome:
      task summary, changes, files changed, validation run/results, review outcome,
      review-fix iterations, assumptions, risks/limitations, completion flag. Define
      the failure-report shape (what was attempted, what blocked, what was left
      behind). Write the report to the worktree's .steiner/plans/<...> folder and
      return it for emission. List per-phase session ids + branch/worktree.
    files:
      - internal/oneshot/report.go
    constraints:
      - Report lists per-phase session ids and the branch/worktree for later navigation.
      - Failure reports state whether changes were left behind.
      - Keep the report concise and bounded.
    acceptance:
      - Success and failure reports render with all required fields.
      - The report is written to disk and returned to the caller.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/oneshot/...
    depends_on: [step-6]

  - id: step-8
    title: Phase-level resume and run listing
    scope: >
      Implement manifest-driven resume: reclaim a stale lock via CAS, validate or
      re-provision the worktree from the branch (prune admin dir first), determine
      the first incomplete phase, and re-run it from its start using on-disk
      artifacts + committed work; skip completed phases. Refuse to resume a run whose
      lock is still live. Implement run listing surfacing resumable runs from
      manifests with status.
    files:
      - internal/oneshot/resume.go
      - internal/oneshot/list.go
    constraints:
      - Resume is phase-level only; do not attempt mid-phase turn restoration.
      - A missing worktree is re-provisioned from the existing branch after prune.
      - Refuse to resume a run whose lock is still live (CAS check).
    acceptance:
      - An interrupted run resumes at the first incomplete phase and completes; completed phases are not re-run.
      - A live-locked run is refused; a stale-locked run reclaims safely.
      - Run listing enumerates resumable runs with status.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/oneshot/...
    depends_on: [step-6, step-7]

  - id: step-9
    title: Config-gated auto-PR closeout step
    scope: >
      When oneshot.auto_pr is enabled, perform the closeout PR/MR step after a
      passing review: detect the remote provider, push the branch, and open a PR/MR
      with a body assembled from overview.md's overview section, the loop's non-merge
      commit messages, and the final review outcome/risks. Reuse existing provider
      flows (GitHub gh, GitLab push options, Azure az); report cleanly for
      unsupported providers. Define whether push/PR runs inside or outside the
      sandbox so credentials (SSH overlay / gh auth) are available.
    files:
      - internal/oneshot/closeout.go
    constraints:
      - No push/PR when auto_pr is false.
      - Push/PR must run with credential access (name the sandbox interaction explicitly).
      - Provider target-branch selection mirrors the review/pull-request skill order.
      - Unsupported providers do not invalidate the reviewed work; report and continue.
    acceptance:
      - With auto_pr true and a passing review, a PR/MR is created via the detected provider.
      - With auto_pr false, no outward-facing action occurs.
      - Unsupported provider is reported without failing the run.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/oneshot/...
    depends_on: [step-6, step-7, step-2]

  - id: step-10
    title: CLI subcommand steiner oneshot (run / resume / list)
    scope: >
      Add the steiner oneshot CLI subcommand wiring the engine: run a task
      (steiner oneshot "<task>"), --resume <id>, and --list. The cmd-side
      PhaseRunner factory (step-1b) and event streaming are wired here. CLI runs with
      no steer source by default; the autonomy contract is identical.
    files:
      - cmd/steiner/cmd_oneshot.go
      - cmd/steiner/commands.go
      - cmd/steiner/main.go
    constraints:
      - cmd/steiner stays composition/wiring only; orchestration logic lives in internal/oneshot.
      - Headless run requires no interactive input and never blocks.
      - Reuse buildRuntime / PhaseRunner factory; no duplicated run construction.
    acceptance:
      - steiner oneshot "<task>" runs end-to-end headless and prints the final report.
      - --resume and --list operate against manifests.
    verification:
      - gofmt -w + goimports -w on touched files
      - go build ./...
      - go test ./cmd/steiner/...
    depends_on: [step-6, step-7, step-8, step-9]

  - id: step-11
    title: TUI /oneshot command, scrollback dividers, steering, resume entry
    scope: >
      Add the /oneshot command to the interactive TUI: parse the command, launch the
      engine in-session, wire the session steer channel across phases, consume the
      engine's phase-transition events to insert "-- Phase N: <name> --" dividers
      while resetting only the model context (NOT wiping scrollback), show a live
      phase indicator, and provide a resume entry. Stamp each phase session with the
      run id via the group-carrying rotate (step-3). Persist per-phase sessions
      grouped by run id.
    files:
      - internal/tui/input.go
      - internal/tui/model.go
      - internal/tui/model_events.go
      - internal/interactive/session.go
      - internal/interactive/run_flow.go
    constraints:
      - Do not reuse workflow_handoff's wipe-on-transition; keep scrollback with dividers.
      - Steering stays available and non-blocking across phase boundaries (orchestrator owns the channel; re-wired per phase).
      - Only the model context resets on transition; displayed/persisted history is retained.
      - Use the group-carrying rotate to stamp each phase session with the run id.
      - Do not alter existing workflow_handoff behaviour.
    acceptance:
      - /oneshot <task> launches an autonomous run with live phase dividers and a phase indicator.
      - Steering typed mid-run reaches the active phase without stopping it.
      - The user can scroll back through all phases at the end and resume an interrupted run.
    verification:
      - gofmt -w + goimports -w on touched files
      - go test ./internal/tui/... ./internal/interactive/...
    depends_on: [step-6, step-7, step-8]

  - id: step-12
    title: Documentation for the oneshot feature
    scope: >
      Document the new top-level feature: a README feature section (description +
      config example + CLI/TUI usage), a dedicated docs/ONESHOT.md detailing the
      mechanism (phases, worktree/identity + sandbox decoupling, advisor loops,
      resume, auto-PR, visibility, signals), CONFIGURATION cross-check, and a new
      maintenance rule in CLAUDE.md for internal/oneshot changes.
    files:
      - README.md
      - docs/ONESHOT.md
      - CLAUDE.md
    constraints:
      - Follow CLAUDE.md documentation-maintenance rules for a new top-level feature.
      - Keep README changes focused; deep detail goes in docs/ONESHOT.md.
    acceptance:
      - README has an oneshot feature section with a config example and usage.
      - docs/ONESHOT.md documents the full mechanism including the sandbox/worktree decoupling.
      - CLAUDE.md gains an internal/oneshot maintenance rule.
    verification:
      - Prose review; links resolve; config example matches step-2 schema.
    depends_on: [step-2, step-9, step-10, step-11]

  - id: step-13
    title: End-to-end integration test and full verification gate
    scope: >
      Add a functional integration test exercising a oneshot run against a stubbed
      provider/fixtures: happy path (plan->implement->review->report), a boundary
      failure clean-stop, SIGINT mid-run (manifest persisted, lock released), and a
      phase-level resume. Include a concurrency test that spawns two provisioners
      against one id, and a sandbox-on test that a worktree commit succeeds. Then run
      the full repo verification gate.
    files:
      - internal/oneshot/integration_test.go
      - testdata/oneshot/
    constraints:
      - Use testdata fixtures; avoid large inline literals.
      - Tests must be deterministic and not require network or a real model.
      - Cover concurrency safety (two provisioners, one id) and sandbox commit success, not just unit-level.
    acceptance:
      - Integration test covers happy path, clean failure stop, SIGINT, and resume.
      - Concurrency and sandbox-commit tests pass.
      - make check passes; race detector is clean.
    verification:
      - golangci-lint cache clean
      - go test -race ./...
      - golangci-lint run ./...
      - govulncheck ./...
      - make check
    depends_on: [step-10, step-11, step-12]
