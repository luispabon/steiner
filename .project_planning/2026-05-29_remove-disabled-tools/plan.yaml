steps:
  - id: step-1
    title: Remove write tool
    scope: |
      Delete the standalone write tool and all its dead references.
    files:
      - internal/tool/builtin/write.go          # delete
      - internal/tool/builtin/write_test.go      # delete
      - internal/tool/builtin/schema.go          # remove WriteSchema()
      - internal/tool/builtin/input.go           # remove WriteInput struct
      - internal/tool/builtin/schema_test.go     # remove write-related test cases
    constraints:
      - Do not touch mutate's internal "write" operation type — that is a mutate op name, not the standalone tool
      - policy.go "write" case is handled in step-4
    acceptance:
      - write.go and write_test.go deleted
      - WriteSchema() removed from schema.go
      - WriteInput removed from input.go
      - No dangling references to NewWriteTool or WriteInput
      - go build ./... passes
    verification:
      - go build ./...
      - go test ./internal/tool/...

  - id: step-2
    title: Remove apply_patch tool and patchdoc subpackage
    scope: |
      Delete the standalone apply_patch tool, its test, the entire patchdoc/ subpackage,
      and all dead result types and schema functions that only apply_patch used.
    files:
      - internal/tool/builtin/apply_patch.go                # delete
      - internal/tool/builtin/apply_patch_test.go            # delete
      - internal/tool/builtin/patchdoc/                      # delete entire directory
      - internal/tool/builtin/schema.go                      # remove ApplyPatchSchema()
      - internal/tool/builtin/result.go                      # remove ApplyPatchResult, MoveResult, newApplyPatchResult, summarizeApplyPatchResult, copyMoveResults, patchdoc import
    constraints:
      - result.go retains MutationResult and MutateResult — only remove apply_patch-specific types
      - Verify no other file imports patchdoc before deleting
    acceptance:
      - apply_patch.go, apply_patch_test.go, patchdoc/ all deleted
      - ApplyPatchSchema() removed from schema.go
      - ApplyPatchResult and related types/funcs removed from result.go
      - No dangling patchdoc imports
      - go build ./... passes
    verification:
      - go build ./...
      - go test ./internal/tool/...

  - id: step-3
    title: Extract edit diagnostics and remove edit tool
    scope: |
      Move diagnostic/matching helpers from edit.go into new mutate_diagnostics.go,
      then delete the edit tool constructor, handler, and all edit-only code.
      Delete edit_test.go. Create mutate_diagnostics_test.go for the moved functions.
    files:
      - internal/tool/builtin/edit.go                        # delete after extraction
      - internal/tool/builtin/edit_test.go                   # delete (create new test file for diagnostics)
      - internal/tool/builtin/mutate_diagnostics.go          # create — diagnostic helpers
      - internal/tool/builtin/mutate_diagnostics_test.go     # create — tests for moved helpers
      - internal/tool/builtin/schema.go                      # remove EditSchema()
      - internal/tool/builtin/input.go                       # remove EditInput struct
    constraints:
      - Functions to preserve in mutate_diagnostics.go: buildNoMatchDiagnostics, buildAmbiguousDiagnostics, normalizedWhitespaceMatchExists, extractNormalizedMatch, findDiagnosticAnchor, diagnosticAnchorCandidates, findExactMatchPreview, lineNumberAt, previewContext, truncatePreviewLine, editOutputMessage
      - Functions to delete (edit-only): NewEditTool, runEdit, applyEditMutation
      - Moved functions must keep identical signatures — mutate.go callers must not change
      - Migrate relevant test cases from edit_test.go to mutate_diagnostics_test.go
    acceptance:
      - edit.go and edit_test.go deleted
      - mutate_diagnostics.go contains all shared diagnostic helpers
      - mutate_diagnostics_test.go has coverage for moved helpers
      - EditSchema() removed from schema.go
      - EditInput removed from input.go
      - mutate.go unchanged (callers still work)
      - go build ./... passes
      - go test ./internal/tool/... passes
    verification:
      - go build ./...
      - go test ./internal/tool/...

  - id: step-4
    title: Clean policy and remaining test references
    scope: |
      Remove dead policy branches for write/edit, clean policy_test.go,
      and remove any remaining test references in builtins_test.go, schema_test.go,
      preview_test.go, or other test files.
    files:
      - internal/tool/policy.go                  # remove "write", "edit" from ValidateToolInput switch
      - internal/tool/policy_test.go             # remove write, edit, apply_patch test cases
      - internal/tool/builtin/builtins_test.go   # remove any write/edit/apply_patch references
      - internal/tool/builtin/schema_test.go     # remove any write/edit/apply_patch references
      - internal/tool/preview_test.go            # remove any apply_patch preview tests if present
    constraints:
      - policy.go validateWritableToolInput may still be needed if other tools use it — verify before deleting
      - Keep "mutate" policy branch intact
      - Do not remove "bash" policy branch
    acceptance:
      - No references to write, edit, or apply_patch tool names in policy.go switch
      - Dead test cases removed
      - All remaining tests pass
      - make check passes
    verification:
      - make check
