stages:
  - id: stage-1
    objective: Establish concise, reusable session-diagnostic surfaces for budgets, compaction, and stop reasons without exposing raw prompt internals.
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: Define and wire the terminal-facing diagnostic summaries that Stage 5 features will consume.
        scope: Own the event and formatting layer for context budgets, compaction visibility, and actionable stop-reason summaries, plus any minimal agent or CLI plumbing needed to retain those summaries for interactive inspection.
        files:
          - internal/output/debug.go
          - internal/output/log.go
          - internal/output/stream.go
          - internal/output/stream_test.go
          - internal/agent/loop.go
          - internal/agent/state.go
          - cmd/steiner/main.go
          - cmd/steiner/main_test.go
        constraints:
          - Keep summaries concise and summary-first; do not dump raw prompt internals or full prompt blocks.
          - Preserve existing package boundaries; `internal/output` owns presentation, `internal/agent` owns only minimal diagnostic state/event additions.
          - Do not change prompt assembly semantics or compaction policy as part of this step unless a minimal blocker is discovered.
          - Maintain compatibility with existing event sinks and non-interactive exec output.
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Stable formatting helpers or event payload adjustments for budget, compaction, and stop-reason summaries.
          - CLI runner state that preserves the diagnostic data needed by the REPL without replaying raw internals.
          - Tests covering concise formatting and actionable stop-reason output.
        acceptance:
          - Context budget diagnostics can be rendered as user-facing summaries that include scope, used budget, configured budget, and truncation notes where relevant.
          - Compaction diagnostics clearly explain what was compacted and what summary was retained without exposing compacted raw message content beyond the existing bounded summary policy.
          - Stop reasons are rendered in a form suitable for later REPL inspection and immediate terminal display.
          - Existing event rendering behavior remains coherent for exec mode and interactive mode.
        handoff: Implement the shared diagnostic presentation layer first so later REPL commands consume a stable summary surface instead of inventing their own formatting.
        verification:
          - gofmt -w internal/output/debug.go internal/output/log.go internal/output/stream.go internal/output/stream_test.go internal/agent/loop.go internal/agent/state.go cmd/steiner/main.go cmd/steiner/main_test.go
          - go test ./internal/output ./internal/agent ./cmd/steiner

  - id: stage-2
    objective: Expand the REPL control surface so users can inspect current session state and recent diagnostics from the console.
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: Add a small coherent set of Stage 5 REPL inspection controls and upgrade `/history` from a minimal dump to a useful session-visibility tool.
        scope: Own REPL command registration, command handling, completion coverage, session visibility helpers, and the user-facing terminal output for recent diagnostic inspection.
        files:
          - internal/repl/commands.go
          - internal/repl/repl.go
          - internal/repl/repl_test.go
          - internal/repl/completer.go
          - internal/repl/prompt.go
          - internal/output/stream.go
          - internal/output/stream_test.go
        constraints:
          - Keep the command surface coherent; prefer a few well-scoped commands or submodes over many one-off debug commands.
          - Preserve existing slash-command namespace rules and skill-toggle behavior.
          - Default to concise summaries and recent-history views rather than transcript dumps.
          - Avoid duplicating formatting logic that should live in `internal/output`.
        depends_on:
          - stage-1-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Updated built-in REPL commands and completions for session visibility.
          - Improved `/history` or replacement inspection commands that expose recent diagnostics, context fullness, and stop reasons in a manageable format.
          - Tests that lock command behavior, namespace preservation, and summary-first output.
        acceptance:
          - Users can inspect recent session diagnostics from the REPL without reading log files.
          - Users can understand context fullness and recent compaction activity from the console using the new or improved inspection commands.
          - Built-in command parsing, completion, and skill toggling continue to behave deterministically.
          - Visibility output remains concise for long sessions and avoids replaying full internal transcripts.
        handoff: Build the REPL around the stage-1 summary surface; do not let REPL commands reach into agent internals directly for bespoke formatting.
        verification:
          - gofmt -w internal/repl/commands.go internal/repl/repl.go internal/repl/repl_test.go internal/repl/completer.go internal/repl/prompt.go internal/output/stream.go internal/output/stream_test.go
          - go test ./internal/repl ./internal/output

  - id: stage-3
    objective: Make interruption and cancellation behavior controllable and inspectable while preserving deterministic session state.
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: Add interruption and cancellation UX hooks that leave the session coherent and explain why work stopped.
        scope: Own prompt/session/run-loop integration for cancellation behavior, stop-reason propagation, and tests proving interrupted sessions remain inspectable and usable.
        files:
          - internal/repl/repl.go
          - internal/repl/prompt.go
          - internal/repl/repl_test.go
          - internal/repl/prompt_test.go
          - cmd/steiner/main.go
          - cmd/steiner/main_test.go
          - internal/agent/loop.go
          - internal/agent/loop_test.go
          - internal/output/log.go
          - internal/output/stream.go
        constraints:
          - Preserve deterministic session state when a run is interrupted or cancelled.
          - Ensure users can inspect why the run stopped after the interruption instead of losing the reason in transient output.
          - Keep cancellation behavior aligned with the existing CLI and REPL interaction model rather than introducing a separate control system.
          - Do not add nested-agent or delegation behavior; Stage 5 remains single-session console control.
        depends_on:
          - stage-1-step-1
          - stage-2-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Session/run-loop changes that capture interrupted or cancelled outcomes as inspectable stop reasons.
          - Prompt/terminal UX hooks for interruption that fit the existing console flow.
          - Regression tests covering interrupted runs, coherent post-stop inspection, and unchanged prompt semantics.
        acceptance:
          - An interrupted or cancelled run leaves the session in a coherent state that can continue or be inspected.
          - Users can see an actionable stop reason after interruption without consulting external logs.
          - Interrupt handling does not corrupt conversation history, active skills, or retained diagnostics.
          - Existing prompt assembly and normal success-path interaction remain behaviorally unchanged apart from the new visibility/control affordances.
        handoff: Integrate cancellation only after the summary and inspection surfaces exist so interrupted-state reporting reuses the same inspection model instead of special-casing output.
        verification:
          - gofmt -w internal/repl/repl.go internal/repl/prompt.go internal/repl/repl_test.go internal/repl/prompt_test.go cmd/steiner/main.go cmd/steiner/main_test.go internal/agent/loop.go internal/agent/loop_test.go internal/output/log.go internal/output/stream.go
          - go test ./internal/repl ./internal/agent ./cmd/steiner
          - go test ./...
          - go vet ./...
          - go build ./...
