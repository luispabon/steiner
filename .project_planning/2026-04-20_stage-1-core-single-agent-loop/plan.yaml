stages:
  - id: stage-1
    objective: Establish the provider, tool execution, and prompt-building foundations required for a usable single-agent loop
    parallel: false
    steps:
      - id: stage-1-step-1
        objective: Implement the OpenAI-compatible provider path and normalize streaming/non-streaming responses behind the existing provider interface and scheduler
        scope: Own the provider transport layer for chat completions, streamed chunks, tool-call decoding, and usage extraction without leaking provider-specific types into agent logic
        files:
          - internal/provider/interface.go
          - internal/provider/types.go
          - internal/provider/openai_compat.go
          - internal/provider/scheduler.go
          - internal/provider/scheduler_test.go
        constraints:
          - Preserve the scheduler as the sole enforcement point for provider parallelism
          - Keep provider-specific wire formats confined to internal/provider
          - Normalize streamed and non-streamed tool calls into the same internal response model
          - Thread context cancellation through all provider calls
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - OpenAI-compatible provider implementation with chat and streaming paths
          - Response normalization helpers covering assistant text, tool calls, finish reasons, and usage
          - Provider-focused tests for normalization and scheduler behavior
        acceptance:
          - Provider can return a normalized final assistant message from a fake or testable response path
          - Provider can return normalized tool call data from both streaming and non-streaming flows
          - Scheduler-backed provider use remains deterministic with parallelism set to 1
        handoff: Implement only the provider layer and its direct tests; do not start agent-loop orchestration or prompt assembly in this step
        verification:
          - gofmt -w internal/provider/*.go
          - go test ./internal/provider/...

      - id: stage-1-step-2
        objective: Implement JSON-contract core tool execution and the Stage 1 core tools binary
        scope: Own direct subprocess execution, approval resolution, and the read/glob/search/write/bash tool implementations under the strict JSON input-output contract
        files:
          - internal/tool/types.go
          - internal/tool/registry.go
          - internal/tool/schema.go
          - internal/tool/executor.go
          - internal/tool/approval.go
          - internal/tool/schema_test.go
          - cmd/steiner-core-tools/main.go
          - cmd/steiner-core-tools/read.go
          - cmd/steiner-core-tools/write.go
          - cmd/steiner-core-tools/glob.go
          - cmd/steiner-core-tools/search.go
          - cmd/steiner-core-tools/bash.go
          - testdata/repos/go_tiny_bug/**
          - testdata/repos/multi_file_search/**
          - testdata/repos/large_output/**
        constraints:
          - Keep all core tools on structured JSON I/O with non-zero exit codes on failure
          - Preserve Stage 1 approval defaults from config and AGENTS guidance
          - Keep execution sequential and project-root-relative
          - Avoid baking Stage 2 path-confinement or edit-preview behavior into this step
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Tool executor and approval flow implementation
          - Working core tools binary for read/glob/search/write/bash
          - Tests or fixtures covering JSON wrapping/parsing and temp-repo execution
        acceptance:
          - Tool registry can surface OpenAI-compatible tool schemas from config-backed definitions
          - Executor can run a registered tool, parse JSON output, and surface structured errors
          - Mutating or shell-capable tools respect prompt approvals while read-only tools can remain automatic
        handoff: Deliver the Stage 1 tool path only; do not add the Stage 2 edit primitive or broader sandboxing
        verification:
          - gofmt -w internal/tool/*.go cmd/steiner-core-tools/*.go
          - go test ./internal/tool/...
          - go test ./cmd/steiner/...

      - id: stage-1-step-3
        objective: Implement bounded prompt assembly and skill loading with the repository-mandated context precedence order
        scope: Own prompt preamble loading, global and project AGENTS loading, bounded project context gathering, explicit skill loading, and assembly into provider-ready messages
        files:
          - internal/prompt/types.go
          - internal/prompt/system.go
          - internal/prompt/agents.go
          - internal/prompt/context.go
          - internal/prompt/skills.go
          - internal/prompt/assemble.go
          - internal/skill/loader.go
          - internal/skill/**
        constraints:
          - Preserve the exact precedence order from AGENTS.md
          - Keep skills as auxiliary context only, never peer system authority
          - Enforce a hard bound on auto-discovered project context
          - Keep prompt assembly separate from agent execution logic
        depends_on: []
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Prompt assembly helpers that emit provider-ready messages and track context blocks
          - Skill discovery/loading implementation for explicit invocation
          - Unit or golden tests for prompt order, bounded context, and skill injection rules
        acceptance:
          - Prompt assembly reflects fixed preamble, AGENTS, project context, skills, conversation, and tool results in the correct order
          - Skills are omitted unless explicitly invoked
          - Project context loading stops at a deterministic byte or token budget
        handoff: Keep this step limited to prompt and skill loading; do not wire the run loop or REPL here
        verification:
          - gofmt -w internal/prompt/*.go internal/skill/*.go
          - go test ./internal/prompt/... ./internal/skill/...

  - id: stage-2
    objective: Wire the single-agent loop to the provider, prompt, and tool layers and expose the first usable execution modes
    parallel: false
    steps:
      - id: stage-2-step-1
        objective: Implement the main single-agent ReAct loop with stop controls, tool branching, and event emission
        scope: Own agent orchestration, turn counting, stop-reason handling, tool-call execution sequencing, conversation updates, and event emission for model/tool/approval lifecycle boundaries
        files:
          - internal/agent/types.go
          - internal/agent/state.go
          - internal/agent/limits.go
          - internal/agent/loop.go
          - internal/output/log.go
          - internal/output/stream.go
        constraints:
          - Keep internal/agent dependent on abstractions rather than direct provider transport details
          - Execute at most one tool call at a time in Stage 1
          - Surface explicit stop reasons for completion, cancellation, max turns, and errors
          - Keep event output plain and lightweight rather than building a rich UI layer
        depends_on:
          - stage-1-step-1
          - stage-1-step-2
          - stage-1-step-3
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Main run loop implementation joining prompt assembly, provider calls, tool execution, and conversation state
          - Output/event helpers for model call start-end, tool call start-end, approval requested-accepted-denied, and stop reason emission
          - Integration tests around tool-call then final-answer execution flow
        acceptance:
          - Fake-provider integration can drive tool call -> tool execution -> final assistant answer
          - Max-turn stopping works without deadlocking or skipping stop-reason output
          - Tool results are appended in a form the next provider request can consume
        handoff: Focus on orchestration and events only; leave Cobra command UX and REPL commands for the next step
        verification:
          - gofmt -w internal/agent/*.go internal/output/*.go
          - go test ./internal/agent/... ./internal/output/...

      - id: stage-2-step-2
        objective: Expose the Stage 1 loop through CLI exec mode and a minimal interactive REPL
        scope: Own Cobra command wiring, exec-path entrypoints, REPL shell, basic slash commands, explicit skill invocation from the REPL, and streamed terminal output integration
        files:
          - cmd/steiner/main.go
          - cmd/steiner/main_test.go
          - internal/repl/repl.go
          - internal/repl/commands.go
          - internal/repl/completer.go
          - internal/output/stream.go
        constraints:
          - Keep REPL scope intentionally thin with only the Stage 1 commands described in the plan docs
          - Ensure `--exec` works headlessly without REPL-only assumptions
          - Reuse agent-loop and output abstractions rather than duplicating orchestration in CLI code
          - Avoid adding persistence or complex history management
        depends_on:
          - stage-2-step-1
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Working CLI entrypoints for REPL and `--exec`
          - Minimal slash-command support for `/help`, `/tools`, `/skills`, `/clear`, and `/exit`
          - Tests covering headless execution and basic REPL command handling
        acceptance:
          - `steiner --exec` can run a single request through the loop without interactive prompts beyond configured approvals
          - REPL can clear conversation state and enumerate tools and skills
          - Terminal output remains readable during streaming and tool execution
        handoff: Limit changes to CLI and REPL plumbing that consume the already-built loop; do not reopen provider or prompt design in this step
        verification:
          - gofmt -w cmd/steiner/*.go internal/repl/*.go internal/output/*.go
          - go test ./cmd/steiner/...

  - id: stage-3
    objective: Close the Stage 1 slice with repository fixtures, broader validation, and final behavior tightening for the toy-repo bugfix target
    parallel: false
    steps:
      - id: stage-3-step-1
        objective: Add or finish the missing tests and fixtures needed to prove the Stage 1 exit criteria end to end
        scope: Own remaining unit, integration, golden, and fixture work required to validate prompt order, approval behavior, tool JSON contract, scheduler serialization, and toy-repo execution flow
        files:
          - cmd/steiner/main_test.go
          - internal/config/config_test.go
          - internal/provider/scheduler_test.go
          - internal/tool/schema_test.go
          - internal/agent/**
          - internal/prompt/**
          - testdata/repos/go_tiny_bug/**
          - testdata/repos/multi_file_search/**
          - testdata/repos/large_output/**
        constraints:
          - Add only Stage 1-relevant fixtures and assertions
          - Prefer table-driven tests and testdata fixtures over inline large blobs
          - Keep verification focused on the promised Stage 1 behaviors rather than Stage 2 or Stage 3 capabilities
        depends_on:
          - stage-2-step-2
        parallel_group: null
        can_run_in_parallel: false
        suggested_model: cheap-good
        outputs:
          - Completed test coverage for the Stage 1 behavior contract
          - Any missing fixture repositories needed for temp-repo and toy-repo validation
          - Final pass on small gaps discovered while writing tests
        acceptance:
          - Prompt assembly order, skill injection gating, approval resolution, provider normalization, and max-turn stopping are covered by tests
          - Temp-repo or fixture-based tests cover read/write/search/bash behavior and the toy bugfix path
          - The repository can pass the agreed Stage 1 end-of-implementation checks
        handoff: Use tests to close gaps, but do not expand scope into Stage 2 safety features or Stage 3 compaction work
        verification:
          - gofmt -w cmd/steiner/*.go internal/agent/*.go internal/prompt/*.go internal/provider/*.go internal/tool/*.go
          - go build ./...
          - go test ./...
          - go vet ./...
