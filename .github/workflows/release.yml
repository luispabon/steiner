name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: Build binaries
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ github.ref_name }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in dist/*/; do
            cp "$dir"* release/
          done
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          (cd release && sha256sum steiner-* > "steiner_${VERSION}_checksums.txt")

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          gh release create "${{ github.ref_name }}" release/* --generate-notes --title "v${VERSION}"
