name: release

on:
  push:
    tags:
      - v*

jobs:
  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            binary_ext: ""
            cgo_enabled: "0"
          - os: linux
            arch: arm64
            binary_ext: ""
            cgo_enabled: "0"
          - os: darwin
            arch: amd64
            binary_ext: ""
          - os: darwin
            arch: arm64
            binary_ext: ""
          - os: windows
            arch: amd64
            binary_ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install UPX
        if: matrix.os != 'darwin'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx-ucl

      - name: Build
        env:
          BINARY: steiner-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.binary_ext }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ "${{ matrix.os }}" = "linux" ]; then
            CGO_ENABLED=${{ matrix.cgo_enabled }} GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w -X main.version=${VERSION}" -trimpath -o "dist/${BINARY}" ./cmd/steiner
          else
            GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w -X main.version=${VERSION}" -trimpath -o "dist/${BINARY}" ./cmd/steiner
          fi

      - name: Compress with UPX
        if: matrix.os != 'darwin'
        env:
          BINARY: steiner-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.binary_ext }}
        run: |
          upx --best "dist/${BINARY}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: steiner-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/steiner-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.binary_ext }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in dist/*/; do
            cp "$dir"* release/
          done
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          (cd release && sha256sum steiner-* > "steiner_${VERSION}_checksums.txt")

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          gh release create "${{ github.ref_name }}" release/* --generate-notes --title "v${VERSION}"
