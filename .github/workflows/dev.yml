name: dev

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build dev binaries
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: dev-${{ github.sha }}
      artifact_prefix: dev-

  release:
    name: Create/update dev release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          for dir in dist/*/; do
            cp "$dir"* release/
          done
          (cd release && sha256sum steiner-* > steiner_dev_checksums.txt)

      - name: Create or update dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create dev release/* --prerelease --title "dev" --notes "Development build from main" || true
          gh release upload dev release/* --clobber
