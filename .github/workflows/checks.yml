name: checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded pushes to the same ref are pointless work; cancel them. main is
# excluded so pushes there always produce a completed run per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  vet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # Per-job cache (setup-go's built-in one shares a single key across all
      # jobs, so a darwin build cache ended up restored into the race job).
      # Only main saves; PRs restore main's entries.
      - name: Restore Go caches
        id: go-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-

      - name: Download Go modules
        run: go mod download

      - name: Vet
        run: make vet

      # Compile-only check: catches rot in `//go:build !linux` / `//go:build
      # darwin`-gated files (e.g. internal/notify) that the Linux-only runner
      # above never compiles. No macOS test execution, just a cross-compile
      # vet pass.
      - name: Vet (darwin cross-compile)
        run: GOOS=darwin go vet ./...

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled() && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}

  test:
    runs-on: ubuntu-latest

    # The race job below requires CGO_ENABLED=1, so it can never exercise the
    # CGO_ENABLED=0 configuration the release binaries actually ship with.
    # Running this one with cgo off (Build and Test alike) makes it real
    # coverage of that build rather than a duplicate of the race job.
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # Per-job cache (setup-go's built-in one shares a single key across all
      # jobs, so a darwin build cache ended up restored into the race job).
      # Only main saves; PRs restore main's entries.
      - name: Restore Go caches
        id: go-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-cgo0-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-cgo0-

      - name: Download Go modules
        run: go mod download

      - name: Build
        run: make build-binaries

      - name: Test (CGO_ENABLED=0, as shipped)
        run: make test

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled() && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-cgo0-${{ hashFiles('go.sum') }}

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # Per-job cache (setup-go's built-in one shares a single key across all
      # jobs, so a darwin build cache ended up restored into the race job).
      # Only main saves; PRs restore main's entries.
      - name: Restore Go caches
        id: go-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-

      - name: Download Go modules
        run: go mod download

      - name: Cache Go tools
        id: cache-go-tools
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}

      - name: Install check tools
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: make install-check-tools

      - name: Tidy check
        run: make tidy-check

      - name: Format check
        run: make fmt-check

      - name: Imports check
        run: make imports-check

      - name: Locate golangci-lint cache
        id: golangci-cache
        run: |
          echo "GOLANGCI_LINT_CACHE=$(golangci-lint cache status | sed -n 's/^Dir: //p')" >> "$GITHUB_OUTPUT"

      - name: Restore golangci-lint cache
        id: golangci-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.golangci-cache.outputs.GOLANGCI_LINT_CACHE }}
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: Lint
        run: make lint

      - name: Save golangci-lint cache
        if: github.ref == 'refs/heads/main' && !cancelled() && steps.golangci-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.golangci-cache.outputs.GOLANGCI_LINT_CACHE }}
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum', '.golangci.yml') }}

      - name: Vuln check
        run: make vuln

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled() && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # Per-job cache (setup-go's built-in one shares a single key across all
      # jobs, so a darwin build cache ended up restored into the race job).
      # Only main saves; PRs restore main's entries.
      - name: Restore Go caches
        id: go-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-

      - name: Download Go modules
        run: go mod download

      - name: Test race
        run: make test-race

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled() && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}

  # Allocation ceilings live behind the perfguard build tag so their benchmark
  # runs stay out of the normal suite. They run here as their own job rather
  # than a step in another check, so they neither delay nor are delayed by the
  # other checks. The ceilings carry 15-20% headroom precisely because shared runners
  # are noisy: they exist to catch an order-of-magnitude regression from a
  # broken frame cache, not to police individual allocations.
  perf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Locate Go caches
        id: go-cache
        run: |
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      # Per-job cache (setup-go's built-in one shares a single key across all
      # jobs, so a darwin build cache ended up restored into the race job).
      # Only main saves; PRs restore main's entries.
      - name: Restore Go caches
        id: go-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-

      - name: Download Go modules
        run: go mod download

      - name: Performance guards
        run: make test-perf

      - name: Save Go caches
        if: github.ref == 'refs/heads/main' && !cancelled() && steps.go-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ steps.go-cache.outputs.GOMODCACHE }}
            ${{ steps.go-cache.outputs.GOCACHE }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ hashFiles('go.sum') }}
