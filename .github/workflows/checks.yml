name: checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install check tools
        run: make install-check-tools

      - name: Tidy check
        run: make tidy-check

      - name: Format check
        run: make fmt-check

      - name: Imports check
        run: make imports-check

      - name: Build
        run: make build-binaries

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Vuln check
        run: make vuln

      - name: Test race
        run: make test-race
