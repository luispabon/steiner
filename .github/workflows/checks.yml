name: checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded pushes to the same ref are pointless work; cancel them. main is
# excluded so pushes there always produce a completed run per commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Go tools
        id: cache-go-tools
        uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-go-tools-${{ hashFiles('Makefile') }}

      - name: Install check tools
        if: steps.cache-go-tools.outputs.cache-hit != 'true'
        run: make install-check-tools

      - name: Tidy check
        run: make tidy-check

      - name: Format check
        run: make fmt-check

      - name: Imports check
        run: make imports-check

      - name: Build
        run: make build-binaries

      # The race job below requires CGO_ENABLED=1, so it can never exercise the
      # CGO_ENABLED=0 configuration the release binaries actually ship with.
      # Running this one with cgo off makes it real coverage of that build
      # rather than a duplicate of the race job.
      - name: Test (CGO_ENABLED=0, as shipped)
        run: make test
        env:
          CGO_ENABLED: 0

      - name: Vet
        run: make vet

      # Compile-only check: catches rot in `//go:build !linux` / `//go:build
      # darwin`-gated files (e.g. internal/notify) that the Linux-only runner
      # above never compiles. No macOS test execution, just a cross-compile
      # vet pass.
      - name: Vet (darwin cross-compile)
        run: GOOS=darwin go vet ./...

      - name: Lint
        run: make lint

      - name: Vuln check
        run: make vuln

  race:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test race
        run: make test-race
